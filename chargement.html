<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pribon Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<!-- v2.0 : Suivi live Kelbongoo (Firestore du projet distribkbg, compte Google master) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  if (window['pdfjsLib']) window['pdfjsLib'].GlobalWorkerOptions.workerSrc =
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
</script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4f5f7;color:#1a1a1a;font-size:15px}
  .header{background:#1a4d2e;color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center}
  .header h1{margin:0;font-size:19px}
  .header .sub{font-size:12px;opacity:.85}
  .wrap{max-width:1280px;margin:0 auto;padding:18px 22px 60px}
  #gate{max-width:440px;margin:60px auto;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.08);padding:26px;text-align:center}
  .muted{color:#888;font-size:13px;line-height:1.5}
  .err{color:#d32f2f;font-size:13px;margin-top:8px}
  .ok{color:#2e7d32;font-size:13px;margin-top:6px}
  .hidden{display:none}
  /* Tabs */
  .tabs{display:flex;gap:6px;border-bottom:2px solid #e6e8ec;margin-bottom:18px;flex-wrap:wrap}
  .tab{padding:12px 20px;background:none;border:none;font-size:15px;font-weight:700;color:#777;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
  .tab.active{color:#1a4d2e;border-bottom-color:#1a4d2e}
  /* Boutons */
  button.btn{padding:12px 18px;font-size:15px;font-weight:700;border:none;border-radius:8px;cursor:pointer}
  .btn-primary{background:#1a4d2e;color:#fff}
  .btn-primary:disabled{background:#aaa;cursor:default}
  .btn-green{background:#2e7d32;color:#fff}
  .btn-lg{padding:16px 24px;font-size:16px}
  input,select,textarea{font-family:inherit;font-size:15px;padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:none;border-color:#1a4d2e}
  label{font-size:12px;font-weight:700;color:#555;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
  /* Grille magasins */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .store-card{background:#fff;border:1.5px solid #e6e8ec;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .store-card h3{margin:0;font-size:16px;color:#1a4d2e;display:flex;justify-content:space-between;align-items:center}
  .store-card.nocfg{opacity:.55}
  .drop{border:2px dashed #1a4d2e;border-radius:10px;padding:16px;text-align:center;background:#f4f9f5;cursor:pointer;font-size:14px}
  .drop:hover{background:#e9f2ec}
  .drop.has{border-style:solid;background:#e8f5e9}
  .field{margin-bottom:4px}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
  .badge.ok{background:#e8f5e9;color:#2e7d32}
  .badge.warn{background:#fff3e0;color:#e65100}
  .badge.info{background:#eef2f7;color:#555}
  .parse-note{font-size:12px;color:#555;background:#f7f9f7;border-radius:6px;padding:6px 8px}
  .bar{position:sticky;bottom:0;background:#fff;border-top:1px solid #e6e8ec;padding:14px 22px;margin:22px -22px -60px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 -2px 8px rgba(0,0,0,.05)}
  /* Suivi live */
  .live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .rec{border:1.5px solid #e6e8ec;border-radius:10px;padding:12px;margin-bottom:10px}
  .rec.draft{background:#fff8e1;border-color:#ffb300}
  .rec.valid{background:#e8f5e9;border-color:#4caf50}
  .rec.expired{background:#f4f5f7;border-color:#ccc;opacity:.75}
  .pbar{background:#e6e8ec;height:9px;border-radius:5px;overflow:hidden;margin-top:8px}
  .pfill{height:100%;background:#4caf50}
  .since{font-variant-numeric:tabular-nums;font-weight:700;color:#e65100}
  .card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);padding:20px;max-width:640px}
  .dot{width:7px;height:7px;border-radius:50%;background:#e53935;display:inline-block;animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.2}}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  th,td{border:1px solid #e6e8ec;padding:6px 8px;text-align:left}
  th{background:#f4f9f5}
  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal-box{background:#fff;border-radius:12px;padding:20px;max-width:780px;width:100%;max-height:92vh;overflow:auto}
  .update-bar{position:fixed;top:0;left:0;right:0;z-index:300;background:#c62828;color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:13px;font-weight:700}
  .update-bar button{background:#fff;color:#c62828;font-weight:800;padding:6px 14px;border-radius:6px;font-size:13px;border:none;cursor:pointer}

/* =====================================================================
   CONSOLE 2.0 — design system (aligné sur le Master Kelbongoo sur PC)
   ===================================================================== */
:root{
  --bg:#f7f5f0;--card:#fff;--muted:#fcfaf6;--ink:#1f1d1a;--ink2:#57534d;--mute:#94908a;--line:#e8e3da;--line2:#d6d0c4;
  --acc:#4a7c3b;--acc-d:#355a29;--acc-s:#ebf3e6;--warn:#b85820;--warn-s:#fff1e6;--dan:#a32a2a;--dan-s:#fde6e6;--info:#2c4a8c;--info-s:#e1e8f5;
  --side:#17221a;--side-ink:#c9d4c4;--disp:#1a4d2e;--pick:#1565c0;--cold:#0b7285;--cold-s:#e3f6f8;--dry:#9a6b16;--dry-s:#fbf2de;
  --sh:0 1px 2px rgba(0,0,0,.04);--r:12px;
}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
/* Connexion */
#gate{max-width:420px;margin:12vh auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.06);padding:30px 28px;text-align:center}
#gate .g-logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#6da55a,#3f6e31);display:grid;place-items:center;color:#fff;font-weight:900;font-size:24px;margin:0 auto 14px}
#gate h2{margin:0 0 4px;font-size:21px;letter-spacing:-.02em}
/* Menu latéral */
.side{position:fixed;left:0;top:0;bottom:0;width:248px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px 14px;z-index:50;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:2px 10px 16px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#6da55a,#3f6e31);display:grid;place-items:center;color:#fff;font-weight:900;font-size:16px}
.brand b{color:#fff;font-size:15px;display:block;letter-spacing:-.01em}.brand small{font-size:11px;color:#8fa189}
.side-sec{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6f8268;padding:14px 12px 6px}
.side button.tab{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:7px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--side-ink);cursor:pointer;margin:0;border:none}
.side button.tab:hover{background:rgba(255,255,255,.06);color:#fff}
.side button.tab.active{background:rgba(141,196,120,.16);color:#fff;font-weight:650;box-shadow:inset 2px 0 0 #8dc478}
.side button.tab .em{width:22px;flex:0 0 22px;text-align:center;font-size:16px;line-height:1;filter:saturate(.9)}
.side button.tab.active .em{filter:none;transform:scale(1.08)}
.side-sec .se{margin-right:6px;font-size:12px;letter-spacing:0}
.side button.tab svg{width:17px;height:17px;flex:0 0 17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.side .cnt{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.09);border-radius:999px;padding:1px 7px;color:#dfe8da}
.side .cnt.r{background:#f04438;color:#fff}.side .cnt.a{background:#f5a524;color:#1d1503}.side .cnt:empty{display:none}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.07);display:flex;gap:10px;align-items:center}
.side-av{width:30px;height:30px;border-radius:50%;background:#2c3b2a;color:#cfe3c6;display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 30px}
.side-foot div{font-size:12px;color:#e6eee2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.side-foot small{display:block;color:#7d8f77;font-size:11px}
/* Zone principale */
.main{margin-left:248px;min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;height:60px;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid var(--line);background:rgba(247,245,240,.94);backdrop-filter:blur(6px)}
.crumb{font-size:12.5px;color:var(--mute)}.crumb b{color:var(--ink);font-weight:650}
.sp{flex:1}
.live-badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:650;color:var(--acc-d);background:var(--acc-s);border-radius:999px;padding:5px 10px}
.ldot{width:7px;height:7px;border-radius:50%;background:#22a33a;box-shadow:0 0 0 3px rgba(34,163,58,.18);display:inline-block}
.ldot.off{background:#b9b4ab;box-shadow:none}
.tbtn{display:inline-flex;align-items:center;gap:7px;font:600 13px Inter,sans-serif;border-radius:8px;padding:7px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
.tbtn:hover{border-color:var(--line2);background:var(--muted)}
.tbtn.p{background:var(--acc);border-color:var(--acc);color:#fff}.tbtn.p:hover{background:var(--acc-d)}
.tbtn.w{background:var(--warn);border-color:var(--warn);color:#fff}.tbtn.d{color:var(--dan);border-color:#f0c9c9}
.tbtn.s{padding:5px 9px;font-size:12px}.tbtn:disabled{opacity:.5;cursor:default}
.wrap{max-width:1480px;width:100%;margin:0;padding:22px 28px 60px}
.tabs{display:none}
.page-h{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.page-h h1{margin:0;font-size:24px;letter-spacing:-.03em}.page-h .sub{color:var(--ink2);font-size:14px;margin-top:3px}
.seg{display:inline-flex;background:#efebe3;border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;font:600 12.5px Inter,sans-serif;padding:5px 11px;border-radius:7px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* Cartes, KPI, listes */
.cx{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.cx-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.cx-h h3{margin:0;font-size:13px;font-weight:700;letter-spacing:-.005em;color:var(--ink)}
.cx-h .sub{font-size:12px;color:var(--mute)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px;cursor:pointer;transition:border-color .15s}.kpi:hover{border-color:var(--line2)}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:4px;display:flex;align-items:baseline;gap:8px;line-height:1.1}
.kpi .v small{font-size:12.5px;font-weight:600;color:var(--mute);letter-spacing:0}
.kpi .s{font-size:12px;color:var(--ink2);margin-top:4px}
.kbar{height:5px;border-radius:9px;background:#efebe3;margin-top:10px;overflow:hidden;display:flex}.kbar i{display:block;height:100%}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.grid-r{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 32px;font-size:15px}
.t1{font-size:13.5px;font-weight:650}.t2{font-size:12px;color:var(--mute)}
.feed .row{padding:9px 16px;gap:10px}.feed .t1{font-weight:500;font-size:13px}.feed time{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums;width:38px;flex:0 0 38px}
.tag{font:700 10px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pg{background:#e7f4ea;color:#1f7a3a}.pr{background:var(--dan-s);color:var(--dan)}.po{background:var(--warn-s);color:var(--warn)}.pb{background:var(--info-s);color:var(--info)}.pn{background:#eef0ee;color:#4a5547}
.pcold{background:var(--cold-s);color:var(--cold)}.pdry{background:var(--dry-s);color:var(--dry)}
.store{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}.store i{width:9px;height:9px;border-radius:3px;display:inline-block}
.empty{padding:22px 16px;color:var(--mute);font-size:13px;text-align:center}
table.tb{width:100%;border-collapse:collapse;font-size:13px;margin:0}
table.tb th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:700;padding:8px 14px;border:none;border-bottom:1px solid var(--line);background:var(--muted)}
table.tb td{padding:10px 14px;border:none;border-bottom:1px solid var(--line);vertical-align:middle}
table.tb tr:last-child td{border-bottom:none}
.thumb{width:44px;height:32px;border-radius:5px;object-fit:cover;background:#eee;display:block;border:1px solid var(--line)}
.steps{display:flex;align-items:center;padding:16px}
.step{display:flex;align-items:center;gap:10px;flex:1}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:800 12px Inter,sans-serif;flex:0 0 28px}
.step .l{font-size:12.5px;font-weight:650}.step .l small{display:block;font-weight:500;color:var(--mute);font-size:11.5px}
.step .ln{flex:1;height:2px;background:var(--line);margin:0 12px}
.step.done .n{background:var(--acc);color:#fff}.step.done .ln{background:var(--acc)}.step.cur .n{background:#fff;border:2px solid var(--warn);color:var(--warn)}.step.todo .n{background:#efebe3;color:var(--mute)}
.pc{display:flex;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}.pc:last-child{border-bottom:none}
.pav{width:38px;height:38px;border-radius:50%;color:#fff;font:800 13px Inter,sans-serif;display:grid;place-items:center;position:relative;flex:0 0 38px}
.pdot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2.5px solid #fff}
.srow{display:flex;align-items:center;gap:12px;padding:9px 16px}.sbar{flex:1;height:8px;border-radius:9px;background:#efebe3;overflow:hidden}.sbar i{display:block;height:100%;border-radius:9px}
.phone{width:390px;height:min(760px,calc(100vh - 170px));min-height:560px;border-radius:38px;background:#111;padding:12px;box-shadow:0 24px 60px rgba(0,0,0,.22)}
.phone iframe{width:100%;height:100%;border:0;border-radius:28px;background:#fff}
textarea.note{font:13px Inter,sans-serif;width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical;min-height:70px;color:var(--ink);box-sizing:border-box}
/* Contenu des anciens onglets : harmonisation */
.wrap .card{border:1px solid var(--line);box-shadow:var(--sh);max-width:none}
.store-card{border:1px solid var(--line)!important;box-shadow:var(--sh)}
.store-card h3{color:var(--ink)!important}
.rec{border-width:1px;border-radius:10px}
button.btn{font-family:Inter,sans-serif;font-weight:650;border-radius:8px}
.wrap table:not(.tb) th{background:var(--muted)}
.modal-box{border-radius:14px}
/* v2.1.0 — Suivi fromage */
.fr-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.fr-kpi{padding:14px 16px}.fr-kpi .v{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:4px;line-height:1.1}
.fr-kpi .v small{font-size:12.5px;font-weight:600;color:var(--mute);letter-spacing:0;margin-left:4px}.fr-kpi .s{font-size:12px;color:var(--ink2);margin-top:4px}
.fr-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.fr-bar input[type=search]{font:13px Inter,sans-serif;border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:220px;flex:1;background:#fff}
.fr-bar input[type=date]{font:13px Inter,sans-serif;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
details.fr-day{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
details.fr-day>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--muted)}
details.fr-day>summary::-webkit-details-marker{display:none}
details.fr-day>summary .dt{font-size:15px;font-weight:800;letter-spacing:-.01em;text-transform:capitalize}
details.fr-day>summary .chev{transition:transform .15s;color:var(--mute)}details.fr-day[open]>summary .chev{transform:rotate(90deg)}
details.fr-day[open]>summary{border-bottom:1px solid var(--line)}
.fr-tb td.num,.fr-tb th.num{text-align:right;font-variant-numeric:tabular-nums}
.fr-tb td small{display:block;color:var(--mute);font-size:11.5px}
.fr-tb td.num{white-space:nowrap}
.fr-dest{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.fr-dest.kbg{background:#e3eefc;color:#1d4f9a}.fr-dest.rob{background:#f1e6f6;color:#6a1b9a}
.fr-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);background:var(--muted)}
.fr-pv{overflow:auto}.fr-pv table{border-collapse:collapse;font-size:12.5px;width:100%}
.fr-pv th,.fr-pv td{border-bottom:1px solid var(--line);padding:7px 10px;white-space:nowrap}
.fr-pv th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);background:var(--muted);position:sticky;top:0}
.fr-pv td.c{text-align:center;font-variant-numeric:tabular-nums}.fr-pv td.c.z{color:#cfcac0}
.fr-pv td.first{position:sticky;left:0;background:#fff;font-weight:650;cursor:pointer}.fr-pv td.first:hover{color:var(--acc-d);text-decoration:underline}
.fr-pv td.tot{font-weight:800;background:var(--muted)}
.fr-cell b{display:block;font-size:13px}.fr-cell span{font-size:11px;color:var(--mute)}
/* v2.2.0 — BL fromage */
.blf-tb td{vertical-align:top}.blf-tb tr.clos td{opacity:.62}.blf-tb tr:hover td{background:#fffdf7}
.blf-prog{height:6px;border-radius:9px;background:#efebe3;overflow:hidden;margin-top:5px;min-width:90px}.blf-prog i{display:block;height:100%;background:var(--acc)}

<script>
let ID_TOKEN=null;
let ME_EMAIL="";
const dbByStore={};      // code -> firebase database
const names={};          // operatorCode -> "Prénom Nom"
const state={};          // code -> { receptions, docs, broadcasts }
let pendingNames=false;
let msgStore=null;       // magasin sélectionné dans l'onglet Messages
let avoirView="magasin", avoirStatut="", avoirDate=""; // onglet Suivi des avoirs
let dbCentrale=null;                       // Firebase du projet CENTRALE (app Dispatch)
const centraleState={ dispatch:{}, picking:{}, reception:{}, decoupe:{}, ecartsSuivi:{}, broadcasts:{}, tracabilite:{}, inventaireVin:{}, kbgPoids:{}, enlevements:{}, rungisNotes:{}, decAlertes:{}, blHisto:{} };
let centraleView="ecarts";                 // onglet Dispatch & Découpe : ecarts | histo | decoupe
let dpDecoupeDate="", dpDecoupeSearch="";  // filtres de l'historique découpe
let dpHistoDate="", dpHistoSearch="";      // filtres de l'historique dispatch

let FOURNS=[];           // répertoire fournisseurs (nom + email litiges)
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function norm(s){ return (s||"").toString().normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim(); }
function toNum(s){ if(s==null) return 0; const n=parseFloat(String(s).replace(/\s/g,"").replace(",",".")); return isNaN(n)?0:n; }
// Extraction EAN depuis un code scanné, y compris QR/DataMatrix GS1 (AI (01) + GTIN-14 + lot/série).
// Ex. 0103463310025489986733 -> 3463310025489 ; un EAN classique est renvoyé tel quel.
function extractEan(raw){
  let s=String(raw==null?"":raw).replace(/\D/g,"");
  if(s.indexOf("01")===0){
    if(s.length>=16){ let g=s.substr(2,14); return (g.length===14&&g[0]==="0")?g.slice(1):g; }
    if(s.length===15) return s.substr(2);
  }
  return s;
}
/* --- écarts / avoirs (v1.2) --- */
const MOTIF_LABELS={ mauvaise_qte:"Mauvaise quantité", casse_fournisseur:"Casse fournisseur", auto_conso:"Auto-consommation", casse_salarie:"Casse (salarié)", delotage:"Délotage", perime_perte:"Périmé / perte" };
function motifLabel(k){ return MOTIF_LABELS[k]||k||"écart"; }
function recLineArr(r){ return Object.values((r&&r.lines)||{}); }
function recEcartLines(r){ return recLineArr(r).filter(s=>s && (s.status==='ecart'||s.status==='nonrecu')); }
function recAvoirLines(r){ return recLineArr(r).filter(s=>s && s.avoir===true); }

/* ============================ VERSION / MAJ ============================ */
function isNewer(a,b){
  const pa=String(a).split(".").map(n=>parseInt(n,10)||0), pb=String(b).split(".").map(n=>parseInt(n,10)||0);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){ const x=pa[i]||0,y=pb[i]||0; if(y>x)return true; if(y<x)return false; }
  return false;
}
function reloadToLatest(latest){ try{ const u=new URL(location.href); u.searchParams.set("v",latest||String(Date.now())); location.replace(u.toString()); }catch(e){ location.reload(); } }
function showUpdateBar(latest){
  if(document.getElementById("updbar")) return;
  const d=document.createElement("div"); d.className="update-bar"; d.id="updbar";
  d.innerHTML='<span>Nouvelle version '+esc(latest)+' disponible</span>';
  const b=document.createElement("button"); b.textContent="Mettre à jour"; b.onclick=()=>reloadToLatest(latest);
  d.appendChild(b); document.body.appendChild(d);
}
// La console a SA PROPRE version (1.9.x) : elle ne peut pas se comparer à get-version (Apps Script),
// qui porte la version des apps magasin (1.3.x) → le bandeau ne s'affichait jamais.
// Ici : on relit le fichier publié sur GitHub Pages (sans cache) et on compare son APP_VERSION.
function checkVersion(){
  const u=location.origin+location.pathname+"?nocache="+Date.now();
  fetch(u,{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{
    const m=t&&t.match(/const APP_VERSION\s*=\s*"([\d.]+)"/);
    if(m && isNewer(APP_VERSION,m[1])) showUpdateBar(m[1]);
  }).catch(()=>{});
}

/* ============================ AUTH ============================ */
function onCredential(resp){
  ID_TOKEN=resp.credential;
  fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action:"verify-responsable",idToken:ID_TOKEN})})
    .then(r=>r.json()).then(j=>{
      if(j&&j.allowed){ start(j.email); }
      else document.getElementById("gateErr").textContent="Accès refusé : "+((j&&j.email)||"")+" n'est pas autorisé.";
    }).catch(e=>document.getElementById("gateErr").textContent="Erreur : "+e.message);
}
window.onload=function(){
  if(OAUTH_CLIENT_ID.indexOf("__")!==-1){ document.getElementById("gateErr").textContent="Renseigne OAUTH_CLIENT_ID et APPS_SCRIPT_URL en haut du fichier."; return; }
  try{ document.getElementById("gateVer").textContent="v"+APP_VERSION; document.getElementById("sideVer").textContent="Responsable · v"+APP_VERSION; }catch(e){}
  checkVersion(); setInterval(checkVersion, 5*60*1000); window.addEventListener("focus", checkVersion);
  const t=setInterval(()=>{ if(window.google&&google.accounts&&google.accounts.id){ clearInterval(t);
    google.accounts.id.initialize({client_id:OAUTH_CLIENT_ID,callback:onCredential});
    google.accounts.id.renderButton(document.getElementById("gbtn"),{theme:"filled_blue",size:"large",text:"signin_with"});
  }},150);
};

const readyStores=()=>STORES.filter(s=>s.firebaseConfig&&s.firebaseConfig.databaseURL);

function start(email){
  ME_EMAIL=email;
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("whoami").textContent=email;
  try{ document.getElementById("sideAv").textContent=String(email||"?").slice(0,2).toUpperCase(); document.getElementById("sideDate").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"}); }catch(e){}
  // Init une app Firebase par magasin configuré
  readyStores().forEach(s=>{
    try{
      const appF=firebase.initializeApp(s.firebaseConfig, s.code);
      dbByStore[s.code]=firebase.database(appF);
      state[s.code]={receptions:{},docs:{},broadcasts:{}};
    }catch(e){ console.error("Firebase "+s.code, e); }
  });
  // Connexion au projet CENTRALE (app Dispatch palette) — lecture des commandes dispatchées.
  try{
    const appC=firebase.initializeApp(CENTRALE_FIREBASE_CONFIG,"CENTRALE");
    dbCentrale=firebase.database(appC);
    dbCentrale.ref("dispatch").on("value",snap=>{ centraleState.dispatch=snap.val()||{}; renderCentrale(); renderSuivi(); });
    dbCentrale.ref("picking").on("value",snap=>{ centraleState.picking=snap.val()||{}; renderCentrale(); renderSuivi(); });
    dbCentrale.ref("decoupe").on("value",snap=>{ centraleState.decoupe=snap.val()||{}; renderCentrale(); renderSuivi(); if(ACTIVE_TAB==="fromage") renderFromage(); if(ACTIVE_TAB==="blf") renderBlf(); blfCount(); });
    dbCentrale.ref("decoupe_alertes").on("value",snap=>{ centraleState.decAlertes=snap.val()||{}; if(ACTIVE_TAB==="blf") renderBlf(); if(ACTIVE_TAB==="fromage") renderFromage(); blfCount(); });
    dbCentrale.ref("bl_historique").on("value",snap=>{ centraleState.blHisto=snap.val()||{}; if(ACTIVE_TAB==="blf") renderBlf(); });
    dbCentrale.ref("tracabilite").on("value",snap=>{ centraleState.tracabilite=snap.val()||{}; renderCentrale(); });
    dbCentrale.ref("centrale_reception").on("value",snap=>{ centraleState.reception=snap.val()||{}; renderCentrale(); });
    dbCentrale.ref("ecarts_suivi").on("value",snap=>{ centraleState.ecartsSuivi=snap.val()||{}; renderCentrale(); });
    dbCentrale.ref("inventaire_vin").on("value",snap=>{ centraleState.inventaireVin=snap.val()||{}; renderInventaire(); });
    dbCentrale.ref("config/kbg_poids").on("value",snap=>{ centraleState.kbgPoids=snap.val()||{}; renderKbgPoids(); });
    dbCentrale.ref("config/kbg_produits").on("value",snap=>{ centraleState.kbgSite=snap.val()||{}; KBG_SITE=(centraleState.kbgSite&&centraleState.kbgSite.items)||{}; kbgRebuildRef(); renderKbgPoids(); });
    dbCentrale.ref("broadcasts").on("value",snap=>{ centraleState.broadcasts=snap.val()||{}; renderMsg(); });
    // v2.0 — enlèvements Rungis + note du soir (console : accueil, page Enlèvements Rungis)
    dbCentrale.ref("enlevements").orderByChild("at").startAt(Date.now()-21*86400000).on("value",snap=>{ centraleState.enlevements=snap.val()||{}; dashTick(true); });
    // v2.4.0 — registre des palettes EPAL (envois validés par Rungis, retours chauffeur, ajustements console)
    dbCentrale.ref("epal/mvts").on("value",snap=>{ centraleState.epal=snap.val()||{}; dashTick(true); });
    dbCentrale.ref("rungis_notes").orderByKey().startAt(isoDay(Date.now()-7*86400000)).on("value",snap=>{ centraleState.rungisNotes=snap.val()||{}; dashTick(true); });
  }catch(e){ console.error("Firebase CENTRALE", e); }
  // Onglets (menu latéral)
  document.querySelectorAll(".side .tab").forEach(b=>b.onclick=()=>{ if(b.dataset.cview) centraleView=b.dataset.cview; switchTab(b.dataset.tab, b.dataset.key); });
  renderMulti(); renderMsg();
  apiRP("get-fournisseurs").then(j=>{ if(j&&j.fournisseurs) FOURNS=j.fournisseurs; }).catch(()=>{});
  // Écouteurs live : réceptions + documents + messages de chaque magasin
  readyStores().forEach(s=>{ const db=dbByStore[s.code]; if(!db) return;
    db.ref("receptions").on("value",snap=>{ state[s.code].receptions=snap.val()||{}; queueNames(); renderSuivi(); renderG5(); renderAvoirs(); renderLoadStatus(); });
    db.ref("documents").on("value",snap=>{ state[s.code].docs=snap.val()||{}; renderSuivi(); renderG5(); renderLoadStatus(); });
    db.ref("broadcasts").on("value",snap=>{ state[s.code].broadcasts=snap.val()||{}; queueNames(); renderMsg(); });
  });
  renderG5();
  setInterval(renderSuivi,1000);
  // v2.0 — accueil par défaut + compteurs du menu
  switchTab("home","home");
  setInterval(()=>dashTick(false), 4000);
}
let ACTIVE_TAB="home", ACTIVE_KEY="home";
const TAB_IDS=["home","multi","g5","centrale","rungis","inventaire","kbgpoids","fromage","blf","avoirs","suivi","msg","fourn","appview"];
const CRUMBS={ home:["Pilotage","Aujourd'hui"], suivi:["Pilotage","Suivi live"], multi:["Magasins","Chargement BL"], g5:["Magasins","Réceptions G5"], avoirs:["Magasins","Avoirs"], msg:["Magasins","Messages"],
  centrale:["Entrepôt PDP","Dispatch & Picking"], decoupe:["Fromage","Découpes par BL"], traca:["Fromage","Traçabilité lots"], fromage:["Fromage","Suivi fromage"], blf:["Fromage","BL fromage"], rungis:["Entrepôt PDP","Enlèvements Rungis"], inventaire:["Entrepôt PDP","Inventaires"], kbgpoids:["Fromage","Poids Kelbongoo"],
  fourn:["Référentiels & outils","Fournisseurs"], appview:["Référentiels & outils","Vue appli & ménage"] };
function switchTab(t, key){
  if(TAB_IDS.indexOf(t)<0) t="home";
  key = key || (t==="centrale" && centraleView==="decoupe" ? "decoupe" : (t==="centrale" && centraleView==="traca" ? "traca" : t));
  ACTIVE_TAB=t; ACTIVE_KEY=key;
  document.querySelectorAll(".side .tab").forEach(b=>b.classList.toggle("active", b.dataset.key===key));
  TAB_IDS.forEach(x=>{ const el=document.getElementById("tab-"+x); if(el) el.classList.toggle("hidden",x!==t); });
  const c=CRUMBS[key]||CRUMBS[t]||["",""]; const cr=document.getElementById("crumb"); if(cr) cr.innerHTML=esc(c[0])+' › <b>'+esc(c[1])+'</b>';
  if(t==="home") renderHome();
  if(t==="avoirs") renderAvoirs();
  if(t==="centrale") renderCentrale();
  if(t==="inventaire") renderInventaire();
  if(t==="fourn") renderFournisseurs();
  if(t==="rungis") renderRungis();
  if(t==="suivi") renderLive();
  if(t==="appview") renderAppView();
  if(t==="kbgpoids") renderKbgPoids();
  if(t==="fromage") renderFromage();
  if(t==="blf") renderBlf();
  try{ window.scrollTo(0,0); }catch(e){}

/* Rafraîchit l'affichage de l'onglet courant SANS recharger la page (donc sans se reconnecter).

/* ============================ PARSEURS ============================ */
function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return {docNumber:"",supplier:"",lines:[]};
  const head=lines[0].split(";").map(h=>norm(h));
  const col=(names)=>{ for(const n of names){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
  const iType=col(["type de piece"]),iDoc=col(["numero piece"]),iEan=col(["ean"]),iRef=col(["reference"]),
        iDes=col(["designation"]),iQte=col(["qte","qte "]),iMar=col(["marque"]),iComm=col(["commentaire"]),
        iFam=col(["famille"]),iRay=col(["rayon"]);
  const out=[]; let docNumber="";
  for(let r=1;r<lines.length;r++){
    const c=lines[r].split(";"); if(c.length<3) continue;
    const type=(iType>=0?c[iType]:"").trim(), article=(iRef>=0?c[iRef]:"").trim(), des=(iDes>=0?c[iDes]:"").trim();
    if(!article&&!des) continue;
    const nonLivre=/non\s*livr/i.test(type);
    if(iDoc>=0&&c[iDoc]&&!docNumber&&!nonLivre) docNumber=c[iDoc].trim();
    const fam=(iFam>=0?c[iFam]:"").trim(), ray=(iRay>=0?c[iRay]:"").trim();
    out.push({ article, ean:(iEan>=0?c[iEan]:"").trim().replace(/^0+(?=\d)/,""), designation:des,
      marque:(iMar>=0?c[iMar]:"").trim(), attendu:toNum(iQte>=0?c[iQte]:0),
      categorie:(fam||ray||"Autres"), comment:(iComm>=0?(c[iComm]||"").trim():""), nonLivre });
  }
  return { docNumber, supplier:"", lines:out };
}
function parseTXT(text){
  const rows=text.split(/\r?\n/); const out=[]; let docNumber=""; let skipped=0;
  const dateRe=/^\d{2}\/\d{2}\/\d{4}$/;
  for(const raw of rows){
    if(!raw.trim()) continue;
    const c=raw.split("\t");
    if(c.length<9||!dateRe.test((c[2]||"").trim())){ skipped++; continue; }
    const article=(c[4]||"").trim(), des=(c[5]||"").trim(), qte=toNum(c[8]);
    if(!article||!des){ skipped++; continue; }
    if(c[3]) docNumber=(c[3]||"").trim();
    out.push({ article, ean:"", designation:des, marque:"", attendu:qte, categorie:"Autres", label:(c[6]||"").trim() });
  }
  return { docNumber, supplier:"", lines:out, skipped };
}
// Vitafrais : sur le PDF, la colonne PCB est imprimée ~1 px plus bas que la ligne article,
// pdf.js la sort donc sur une ligne à part (« 6 » seul). On la ré-injecte entre « Colis » et l'EAN.
function fixVitafraisPcbRows(rowLines){
  const out=[];
  const reNoPcb=/^(\d{2,7}\s+.*\S\s+)(\d+)\s+(\d{8,13})\s+(\d+)(\s+[\d.,]+(?:\s+[\d.,]+)?)\s*$/;
  for(let i=0;i<rowLines.length;i++){
    const L=rowLines[i], nx=rowLines[i+1];
    const m=L.match(reNoPcb);
    if(m && nx && /^\d{1,4}$/.test(nx.trim())){
      const colis=+m[2], pcb=+nx.trim(), qte=+m[4];
      if(pcb>0 && (colis*pcb===qte || qte%pcb===0)){ out.push(m[1]+m[2]+" "+pcb+" "+m[3]+" "+m[4]+m[5]); i++; continue; }
    }
    out.push(L);
  }
  return out;
}
function parsePDFLines(rowLines){
  rowLines=fixVitafraisPcbRows(rowLines);
  const out=[]; let supplier=""; let docNumber="";
  // Vitafrais : Code | Désignation+Marque | COLIS livrés | PCB (pièces/colis) | EAN | Qté(total) | Poids | [PU HT]
  //   -> cdt = PCB (colisage) ; qteCmd = colis livrés ; attendu = Qté totale (pièces) = colis × PCB.
  const reColis=/^(\d{2,7})\s+(.*\S)\s+(\d+)\s+(\d+)\s+(\d{8,13})\s+(\d+)\s+[\d.,]+(?:\s+[\d.,]+)?\s*$/;
  const reSimple=/^(\d{2,7})\s+(.*\S)\s+(\d{8,13})\s+(\d+)\s+[\d.,]+\s+[\d.,]+\s*$/;
  const clean=(s)=> String(s).replace(/\s*(BIO|DEM)\s*$/i,"").trim();
  for(const L of rowLines){
    if(!supplier&&/VITAFRAIS/i.test(L)) supplier="VITAFRAIS";
    const mBL=L.match(/n[°º]\s*BL\s*:?\s*(\d+)/i); if(mBL) docNumber=mBL[1];
    if(/^(Palette|Colis \d|Poids|Total|Distribution|Page|Commande|BIO :|DEM :)/i.test(L)) continue;
    let m=L.match(reColis);
    if(m){
      const colis=parseInt(m[3],10), pcb=parseInt(m[4],10), qte=parseInt(m[6],10);
      const cdt = pcb>0 ? pcb : null;
      let qteCmd = colis>0 ? colis : (cdt?Math.round(qte/cdt):qte);
      if(cdt && colis*pcb!==qte && qte%pcb===0) qteCmd=qte/pcb;   // cohérence colis × PCB = Qté
      out.push({ article:m[1], ean:m[5].replace(/^0+(?=\d)/,""), designation:clean(m[2]), marque:"",
                 cdt, qteCmd, unit: cdt?"colis":"piece", attendu:qte, categorie:"Autres" });
      continue;
    }
    m=L.match(reSimple);
    if(m){
      let des=m[2].replace(/\s+\d+\s+\d+\s*$/,"").replace(/\s+\d+\s*$/,"");
      out.push({ article:m[1], ean:m[3].replace(/^0+(?=\d)/,""), designation:clean(des), marque:"", attendu:parseInt(m[4],10), categorie:"Autres" });
    }
  }
  return { docNumber, supplier, lines:out };
}
// --- Parseur PDF Biodis (mise en page différente de Vitafrais) ---
function cleanDesBiodis(s){ return String(s||"").replace(/\s+(Non\s+Bio|Bio|Conv(?:ersion)?|Cosmebio|Ecocert)\s*$/i,"").trim(); }
function parseBiodisPDF(rowLines){
  const out=[]; let supplier="BIODIS", docNumber=""; let stopped=false;
  const reU  = /^(\d{3,7})\s+(.+?)\s+(\d{13})\s+\d+\s+(\d+)\s+U\s+[\d.,]+\s+[\d.,]+\s+\d+\s*$/;
  const reKG = /^(\d{3,7})\s+(.+?)\s+(\d{13})\s+\d+\s+([\d.,]+)\s*KG\s+[\d.,]+\s+[\d.,]+\s+\d+\s*$/;
  const reND = /^(\d{3,7})\s+(.+?)\s+(Non livr[ée]|Produit sur commande|Rupture fournisseur)\s+(\d+)\s+U\s*$/i;
  const isItemNum=(s)=>reU.test(s)||reKG.test(s);
  const isMeta=(s)=>/^(Prix\b|DLC\b|DDM\b|Contribution\b|Lot\b|Sous-total\b|Commande n\b|SASU\b|NAF\b|No AGREMENT|www\.|http|BIO :|CONV\b|COSMEBIO|FR-BIO|Page \d|Poids\b|Date\b|Certification\b|Marque\b|Cat\.|TPF\b|TVA\b|Bon de Livraison|PRIBON|T[ée]l\.|Fax\b|e_mail|Site WEB|EAN\b|PRIX\b|Montant\b|Colis\b|UNITAIRE|H\.T\.|Scannez|Espace Pro|C'est Biodis|Vous pouvez|pr[ée]command|commerciales|Merci|ne pourrons|PARTICIPATION|prix indicatif|-{3,})/i.test(s) || /^[\d.,]+$/.test(String(s).trim());
  for(let i=0;i<rowLines.length;i++){
    const L=rowLines[i];
    const doc=L.match(/(\d{2}\/\d{2}\/\d{4})\s+(\d{6,8})\s/); if(doc && !docNumber) docNumber=doc[2];
    if(/Produits en arr[eê]t long|R[ée]f[ée]rence D[ée]s/i.test(L)){ stopped=true; continue; }
    if(stopped) continue;
    let m;
    if((m=L.match(reND))){ out.push({ article:m[1], ean:"", designation:cleanDesBiodis(m[2]), marque:"", attendu:parseInt(m[4],10), categorie:"Autres", nonLivre:true, comment:m[3] }); continue; }
    let art=null, ean="", att=0;
    if((m=L.match(reU)))  { art=m[1]; ean=m[3]; att=parseInt(m[4],10); }
    else if((m=L.match(reKG))){ art=m[1]; ean=m[3]; att=toNum(m[4]); }
    if(art){
      let des=[];
      for(let j=i+1;j<rowLines.length && des.length<3;j++){
        const N=rowLines[j];
        if(isItemNum(N)||reND.test(N)||isMeta(N)) break;
        des.push(N);
      }
      out.push({ article:art, ean:ean.replace(/^0+(?=\d)/,""), designation:cleanDesBiodis(des.join(" ")), marque:"", attendu:att, categorie:"Autres" });
    }
  }
  return { docNumber, supplier, lines: out };
}
function pickPdfParser(rowLines){
  const j=rowLines.join("\n");
  if(/BIODIS/i.test(j)) return parseBiodisPDF(rowLines);
  return parsePDFLines(rowLines); // Vitafrais (par défaut)
}
async function readPDF(buf){
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let rowLines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p); const tc=await page.getTextContent();
    const rows={};
    for(const it of tc.items){ const y=Math.round(it.transform[5]); (rows[y]=rows[y]||[]).push([it.transform[4],it.str]); }
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{
      const line=rows[y].sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(" ").replace(/\s+/g," ").trim();
      if(line) rowLines.push(line);
    });
  }
  return pickPdfParser(rowLines);
}
/* ---------- LECTURE COMMANDE (export G5 xlsx) ---------- */
// Code fournisseur G5 -> nom lisible (complète au besoin).
const FOURN_MAP={ "K113":"SBV", "K005":"BODIN" };
async function parseOrderXlsx(file){
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""});
  // --- Format AGIDRA (export commande depuis leur site) : REF / Désignation produit / Code EAN / Colisage / Qté(colis) ---
  {
    const NA=(s)=>String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
    let ah=-1;
    for(let i=0;i<Math.min(rows.length,10);i++){ const r=(rows[i]||[]).map(NA);
      if(r.some(x=>x==="REF") && r.some(x=>x.includes("COLISAGE")) && r.some(x=>x.includes("DESIGNATION"))){ ah=i; break; } }
    if(ah>=0){
      const head=rows[ah].map(x=>String(x).trim());
      const acol=(names)=>{ for(const nm of names){ const i=head.findIndex(x=>NA(x)===NA(nm)||NA(x).includes(NA(nm))); if(i>=0) return i; } return -1; };
      const iRef=acol(["REF"]), iDes=acol(["DESIGNATION"]), iEan=acol(["CODE EAN","EAN"]),
            iCol=acol(["COLISAGE"]), iQte=acol(["QTE","QUANTITE"]);
      const lines=[];
      for(let i=ah+1;i<rows.length;i++){
        const r=rows[i]||[];
        const ref=String(iRef>=0?r[iRef]:"").trim(), des=String(iDes>=0?r[iDes]:"").trim();
        if(!ref||!des) continue;
        const cdt=toNum(iCol>=0?r[iCol]:0)||null, qte=toNum(iQte>=0?r[iQte]:0);
        lines.push({ article:ref, code:ref, ean:String(iEan>=0?r[iEan]:"").trim().replace(/^0+(?=\d)/,""),
          ref, designation:des, cdt, qteCmd:qte, unit:cdt?"colis":"piece",
          attendu: cdt?Math.round(qte*cdt):qte, poidsVariable:false, categorie:"Autres" });
      }
      if(!lines.length) throw new Error("Commande Agidra lue mais aucune ligne article trouvee.");
      const mCmd=String(file.name||"").match(/commande[_-]?(\d{5,})/i);
      return { format:"CMD", g5Key:"code", supplier:"AGIDRA", docNumber: mCmd?mCmd[1]:"", deliveryDate:"", lines };
    }
  }
  // --- Format commande "simple" (export interne : Code(EAN) / Réf fournisseur / Désignation / Qté finale) ---
  // Détecté par : Code + Désignation + une colonne Qté* + une Réf, ET absence de colonne CDT
  // (la colonne CDT est la signature de l'export G5 standard, traité plus bas).
  {
    const NS=(s)=>String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
    let sh=-1;
    for(let i=0;i<Math.min(rows.length,12);i++){ const r=(rows[i]||[]).map(NS);
      const hasCode=r.some(x=>x==="CODE"), hasDes=r.some(x=>x.includes("DESIGNATION")),
            hasQte=r.some(x=>x.startsWith("QTE")), hasRef=r.some(x=>x.includes("REF")),
            hasCDT=r.some(x=>x==="CDT");
      if(hasCode&&hasDes&&hasQte&&hasRef&&!hasCDT){ sh=i; break; } }
    if(sh>=0){
      const head=rows[sh].map(x=>String(x).trim());
      const find=(pred)=>head.findIndex(x=>pred(NS(x)));
      const iCode=find(x=>x==="CODE"), iRef=find(x=>x.includes("REF")),
            iDes=find(x=>x.includes("DESIGNATION"));
      // Quantité ATTENDUE en UNITÉS = « Qté finale » (jamais « Qté initiale », qui est en colis).
      let iQte=find(x=>x==="QTE FINALE"); if(iQte<0) iQte=find(x=>x.startsWith("QTE"));
      const iColis=find(x=>x==="QUANTITE");                         // nb de colis commandés
      const iColisage=find(x=>x==="COLISAGE"), iCond=find(x=>x.startsWith("CONDITION"));
      const lines=[];
      for(let i=sh+1;i<rows.length;i++){
        const r=rows[i]||[];
        const codeCell=String(iCode>=0?(r[iCode]??""):"").trim();
        const ref=String(iRef>=0?(r[iRef]??""):"").trim();
        const des=String(iDes>=0?(r[iDes]??""):"").trim();
        if(!des||(!codeCell&&!ref)) continue;
        const qte=toNum(iQte>=0?r[iQte]:0);                        // unités
        let cdt=toNum(String(iColisage>=0?r[iColisage]:"").replace(/^C/i,""))||toNum(iCond>=0?r[iCond]:0)||null;
        if(cdt && cdt<=0) cdt=null;
        const nColis=iColis>=0?toNum(r[iColis]):0;
        if(!cdt && nColis>0 && qte>0 && qte%nColis===0 && qte/nColis>1) cdt=qte/nColis;
        const qteCmd = cdt ? (nColis>0 ? nColis : Math.round(qte/cdt)) : qte;   // en colis
        const isEan=/^\d{12,13}$/.test(codeCell);
        lines.push({ article:codeCell||ref, code:codeCell||ref,
          ean:isEan?codeCell.replace(/^0+(?=\d)/,""):"", ref,
          designation:des, cdt, qteCmd, unit:cdt?"colis":"piece",
          attendu:qte, poidsVariable:false, categorie:"Autres" });
      }
      if(!lines.length) throw new Error("Commande lue mais aucune ligne article trouvée (format simple).");
      const mCmd=String(file.name||"").match(/(\d{6,})/);
      return { format:"CMD", g5Key:"code", supplier:"", docNumber: mCmd?mCmd[1]:"", deliveryDate:"", lines };
    }
  }
  const N=(s)=>String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
  let h=-1;
  for(let i=0;i<rows.length;i++){ const r=(rows[i]||[]).map(N);
    if(r.includes("CODE") && r.some(c=>c.startsWith("DESIGNATION"))){ h=i; break; } }
  if(h<0) throw new Error("Export de commande non reconnu (en-tête Code/Désignation introuvable).");
  const head=rows[h].map(x=>String(x).trim());
  const col=(names)=>{ for(const n of names){ const i=head.findIndex(c=>N(c)===N(n)); if(i>=0) return i; } return -1; };
  const iCode=col(["Code"]), iRef=col(["Ref Fourn.","Ref Fourn"]), iDes=col(["Désignation","Designation"]),
        iCdt=col(["CDT"]), iQte=col(["Qté","Qte"]), iFourn=col(["Fournisseur"]);
  let dateLiv="", cmd="", supplier="";
  rows.forEach(r=>{ const j=(r||[]).map(x=>String(x));
    const li=j.findIndex(x=>/^\s*Le\s*$/i.test(x)); if(li>=0 && /\d{2}\/\d{2}\/\d{4}/.test(j[li+1]||"")) dateLiv=j[li+1].trim();
    const ci=j.findIndex(x=>/Commande à la Centrale N°/i.test(x)); if(ci>=0 && j[ci+1]) cmd=String(j[ci+1]).trim();
    const fi=j.findIndex(x=>/Adresse de Livraison/i.test(x)); if(fi>=0 && j[fi+1]) supplier=j[fi+1].trim();
    j.forEach(x=>{ if(!cmd && /^\d{2}-\d-[A-Za-z0-9]+$/.test(String(x).trim())) cmd=String(x).trim(); });
  });
  const lines=[]; let fournCode="";
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]||[]; const code=String(r[iCode]||"").trim(); const des=String(r[iDes]||"").trim();
    if(!/^(NC-|\d)/i.test(code) || !des) continue;              // ignore pied de page / 2e en-tête
    const cdtRaw=iCdt>=0?String(r[iCdt]||"").trim():"";
    const cdt=cdtRaw?toNum(cdtRaw.replace(/^C/i,"")):null;      // "C6" -> 6 (pièces par colis)
    const qte=toNum(r[iQte]);
    if(iFourn>=0 && r[iFourn] && !fournCode) fournCode=String(r[iFourn]).trim();
    const isPV=/000000$/.test(code)||/^2\d{11,12}$/.test(code)||/\bENV\b/i.test(des);
    const isEan=/^\d{12,13}$/.test(code);
    lines.push({ article:code, code, ean:isEan?code.replace(/^0+(?=\d)/,""):"", ref:String(iRef>=0?r[iRef]||"":"").trim(),
      designation:des, cdt, qteCmd:qte, unit:cdt?"colis":"piece",
      attendu: cdt?Math.round(qte*cdt):qte, poidsVariable:isPV, categorie:"Autres" });
  }
  if(!supplier && fournCode) supplier=FOURN_MAP[fournCode]||fournCode;
  if(!lines.length) throw new Error("Commande lue mais aucune ligne article trouvée.");
  return { format:"CMD", g5Key:"code", supplier, docNumber:cmd||"", deliveryDate:dateLiv, lines };
}

async function parseAnyFile(file){
  const name=(file.name||"").toLowerCase();
  if(name.endsWith(".xlsx")||name.endsWith(".xls")) return await parseOrderXlsx(file);
  if(name.endsWith(".pdf")){ const buf=await file.arrayBuffer(); return { ...(await readPDF(buf)), format:"PDF" }; }
  const buf=await file.arrayBuffer();
  let text; try{ text=new TextDecoder("windows-1252").decode(buf); }catch(e){ text=new TextDecoder("utf-8").decode(buf); }
  const first=text.split(/\r?\n/).slice(0,5).join("\n");
  if(name.endsWith(".csv")||first.includes(";")){
    if(!first.includes(";")&&first.includes("\t")) return { ...parseTXT(text), format:"TXT" };
    return { ...parseCSV(text), format:"CSV" };
  }
  return { ...parseTXT(text), format:"TXT" };
}
function fmtFr(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-"); return d+"/"+m+"/"+y; }
// Écrit un document parsé dans le Firebase du magasin
async function loadToStore(code, parsed, {supplier,type,deliveryDate}){
  const db=dbByStore[code]; if(!db) throw new Error("Magasin "+code+" non configuré");
  const ref=db.ref("documents").push();
  await ref.set({ docNumber:parsed.docNumber||"(sans n°)", supplier:(supplier||parsed.supplier||"").trim()||"(fournisseur ?)",
    type:type||"BL", format:parsed.format, deliveryDate:fmtFr(deliveryDate)||"",
    g5Key:parsed.g5Key||'ean',
    createdAt:firebase.database.ServerValue.TIMESTAMP, lines:parsed.lines });
  return ref.key;
}
/* Réceptions liées à un document chargé (pour savoir s'il a été pris en compte). */
function recsForDoc(code, docKey){
  const st=state[code]; if(!st) return [];
  return Object.entries(st.receptions||{}).map(([id,r])=>({id,...r})).filter(r=>r.docId===docKey);
}
// Statut live d'un document chargé : attente / en cours / réceptionné.
function docStatus(code, docKey){
  const rs=recsForDoc(code, docKey);
  if(rs.some(r=>r.status==="validated")) return {k:"recu", label:"✅ Réceptionné", cls:"ok"};
  if(rs.some(r=>r.status!=="validated")) return {k:"encours", label:"🟡 Réception en cours", cls:"warn"};
  return {k:"attente", label:"📤 Chargé — en attente de réception", cls:"info"};
}
// Supprimer un document chargé (ex : doublon envoyé plusieurs fois).
async function deleteDoc(code, docKey){
  const db=dbByStore[code]; if(!db) return;
  const rs=recsForDoc(code, docKey);
  let msg="Supprimer ce document chargé du magasin ?\n\nÀ utiliser par ex. pour un doublon (même réception envoyée plusieurs fois).";
  if(rs.length) msg="⚠️ Ce document a "+rs.length+" réception(s) liée(s) (en cours ou validée).\n\nLe supprimer quand même ? Les réceptions liées ne seront plus rattachées à ce document.";
  if(!confirm(msg)) return;
  try{ await db.ref("documents/"+docKey).remove(); }catch(e){ alert("Erreur : "+e.message); }
}
/* Panneau de confirmation des chargements (onglet multi + simple). Se met à jour en live. */
let justLoaded={}; // code -> { at, count } chargements récents mis en avant
function renderLoadStatus(){
  const boxes=document.querySelectorAll(".load-status-box"); if(!boxes.length) return;
  const now=Date.now();
  const blocks=STORES.map(s=>{
    const st=state[s.code]; if(!st) return "";
    const docs=Object.entries(st.docs||{}).map(([id,d])=>({id,...d}))
      .filter(d=>(now-(d.createdAt||0))<36*3600*1000)      // chargements des dernières 36 h
      .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    if(!docs.length) return "";
    const rows=docs.map(d=>{ const stt=docStatus(s.code, d.id); const fresh=justLoaded[s.code]&&(now-justLoaded[s.code].at)<20000;
      return `<div class="rec ${stt.k==='recu'?'valid':(stt.k==='encours'?'draft':'')}" style="${fresh&&stt.k==='attente'?'box-shadow:0 0 0 2px #2e7d32':''}">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
          <div style="font-weight:800;font-size:13px">${esc(d.supplier||'?')} · ${esc(d.docNumber||'')}</div>
          <div style="display:flex;gap:6px;align-items:center">
            <span class="badge ${stt.cls}">${stt.label}</span>
            <button class="btn" title="Supprimer ce document chargé (doublon…)" style="background:#fdecea;color:#c62828;padding:2px 9px;font-size:14px;line-height:1.2;border-radius:8px" onclick="deleteDoc('${s.code}','${d.id}')">✖</button>
          </div></div>
        <div style="font-size:12px;color:#666;margin-top:2px">${esc(d.type||'BL')} · ${(d.lines||[]).length} ligne(s) · chargé ${esc(heure(d.createdAt))} ${esc(dateShort(d.createdAt))}</div>
      </div>`;
    }).join("");
    return `<div class="store-card"><h3>${esc(s.label)} <span class="badge info">${docs.length} chargé(s)</span></h3>${rows}</div>`;
  }).filter(Boolean).join("");
  const out = blocks
    ? `<div style="background:#eef6ef;border:1px solid #cfe6d5;border-radius:10px;padding:10px 12px;margin-bottom:14px">
         <div style="font-weight:800;color:#1a4d2e;margin-bottom:8px">✅ Chargements récents — confirmation par magasin</div>
         <div class="live-grid">${blocks}</div>
       </div>`
    : "";
  boxes.forEach(b=>{ b.innerHTML=out; });
}
// Détermine la clé utilisée pour le .txt G5 : EAN si présent, sinon on propose le code article.
function detectG5Key(parsed){
  const hasEan=(parsed.lines||[]).some(l=>l.ean&&String(l.ean).trim().length>=6);
  if(hasEan) return 'ean';
  const hasArticle=(parsed.lines||[]).some(l=>l.article);
  if(hasArticle){
    const ok=confirm("⚠️ Pas d'EAN sur ce document.\n\nUtiliser le CODE ARTICLE pour le .txt à charger sur G5 ?\n\n(OK = oui, utiliser le code article · Annuler = laisser tel quel)");
    return ok?'article':'ean';
  }
  return 'ean';
}
// Clé de ligne identique à l'app vendeur (pour retrouver la quantité réelle).
function lineKeyOf(l,idx){ const a=(l.article||"").toString().trim(); return a?("a_"+a.replace(/[.#$/\[\]]/g,"_")):("i_"+idx); }
// Construit le .txt G5.
// RÈGLE COLISAGE (décidée le 28/09/2026) :
//  - la quantité G5 est exprimée en COLIS ;
//  - par défaut on écrit la quantité THÉORIQUE (comme si tout avait été reçu) pour ÉVITER LES VIRGULES ;
//  - on n'ajuste QUE si l'écart tombe pile sur un nombre entier de colis (multiple du colisage) :
//      la quantité reste alors un entier de colis, donc pas de stock à virgule ;
//  - sinon (écart non multiple du colisage) on laisse la quantité théorique : l'écart reste
//      signalé EN ROUGE sur la console G5, l'opérateur fait l'ajustement de stock à la main.
//  - poids variable -> poids réellement saisi ; colisage 1 (ou absent) -> quantité réelle (déjà entière).
function g5QtyColis(l, st){
  st = st || {};
  const cdt = (l.cdt && l.cdt>0) ? l.cdt : 1;
  const theoColis = (l.qteCmd!=null) ? Number(l.qteCmd) : ((l.attendu!=null)? Number(l.attendu)/cdt : 0);
  const attenduPieces = (l.attendu!=null) ? Number(l.attendu) : theoColis*cdt;
  // pièces réellement en stock (apte vente) selon le pointage vendeur
  let reelPieces;
  if(st.status==='nonrecu') reelPieces=0;
  else if(st.status==='ecart') reelPieces=(st.aptevente!=null?Number(st.aptevente):(st.reel!=null?Number(st.reel):attenduPieces));
  else if(st.status==='surplus') reelPieces=(st.reel!=null?Number(st.reel):attenduPieces);
  else if(st.status==='conforme') reelPieces=(st.reel!=null?Number(st.reel):attenduPieces);
  else reelPieces=attenduPieces; // non pointé -> comme si tout reçu (théorique)
  const diffPieces = reelPieces - attenduPieces;
  let qtyColis = theoColis;
  // ajustement UNIQUEMENT si l'écart est un multiple entier du colisage (=> reste entier)
  if(cdt>0 && diffPieces % cdt === 0){ qtyColis = theoColis + (diffPieces/cdt); }
  if(qtyColis<0) qtyColis=0;
  return qtyColis;
}
 // VITAFRAIS (et uniquement Vitafrais) : on COMMANDE en unités, mais la réception G5 se fait en COLIS.
 // Le PCB (pièces/colis) vient du BL. On recalcule donc qteCmd = unités commandées / PCB.
 // Corrige aussi les réceptions déjà chargées avant la v2.0.1 (qteCmd stocké en unités).
 function isVitafraisDoc(doc, rec){ return /VITAFRAIS/i.test(String((doc&&doc.supplier)||"")+" "+String((rec&&rec.supplier)||"")); }
 function vitafraisColisLines(lines){
  const pcbByKey={};
  lines.forEach(l=>{ const c=Number(l.cdt)||0; if(c>1){ [l.ean,l.code,l.article].forEach(k=>{ if(k) pcbByKey[String(k)]=c; }); } });
  return lines.map(l=>{
    if(l.poidsVariable) return l;
    let cdt=Number(l.cdt)||0;
    if(cdt<=1){ cdt=pcbByKey[String(l.ean||"")]||pcbByKey[String(l.code||"")]||pcbByKey[String(l.article||"")]||0; }
    if(cdt<=1) return { ...l, pcbInconnu:true };
    const att=Number(l.attendu)||0;
    const qc = (att%cdt===0) ? att/cdt : Math.max(1,Math.round(att/cdt));
    return { ...l, cdt, qteCmd:qc, unit:"colis" };
  });
 }
 function buildG5Txt(rec, doc){
  const key=(doc&&doc.g5Key)||'ean';
  let active=((doc&&doc.lines)?doc.lines:[]).filter(l=>!l.nonLivre);
  if(isVitafraisDoc(doc,rec)) active=vitafraisColisLines(active);
  const out=[];
  const usedKeys=new Set();
  if(active.length){
    // Cas normal : on itère les lignes du document (commande/BL rapprochés)
    active.forEach((l,i)=>{
      const lk=lineKeyOf(l,i);
      if(usedKeys.has(lk)) return;   // ligne en double dans la commande (même article) : une seule fois dans le .txt
      usedKeys.add(lk);
      const st=(rec.lines||{})[lk]||{};
      let qty;
      if(l.poidsVariable){ qty=(st.poids!=null&&st.poids!=="")?st.poids:(l.qteCmd!=null?l.qteCmd:l.attendu); } // poids réel (kg)
      else { qty=g5QtyColis(l, st); }                                                  // quantité en colis (règle colisage)
      const code=l.code||(key==='article'?(l.article||l.ean||''):(l.ean||l.article||''));
      if(!code||qty==null||qty==="") return;
      out.push(code+"\t"+String(qty).replace(".",","));
    });
    // Produits AJOUTÉS hors BL (reçus en plus) : présents dans la réception mais pas dans le document.
    Object.entries(rec.lines||{}).forEach(([lk,s])=>{
      if(usedKeys.has(lk) || !s || s.nonLivre || !s.status) return;
      let qty;
      if(s.poids!=null&&s.poids!=="") qty=s.poids;
      else if(s.status==='nonrecu') qty=0;
      else qty=g5QtyColis(s, s); // pas de cdt => colisage 1 => quantité réelle entière
      const code=s.code||s.ean||s.article||'';
      if(!code||qty==null||qty==="") return;
      out.push(code+"\t"+String(qty).replace(".",","));
    });
  } else {
    // Secours : document non lié -> on lit les lignes stockées dans la réception elle-même
    Object.values(rec.lines||{}).forEach(s=>{
      if(s.nonLivre) return;
      let qty;
      if(s.poids!=null&&s.poids!=="") qty=s.poids;
      else if(s.status==='nonrecu') qty=0;
      else qty=g5QtyColis(s, s);
      const code=s.code||s.ean||s.article||'';
      if(!code||qty==null||qty==="") return;
      out.push(code+"\t"+String(qty).replace(".",","));
    });
  }
  return out.join("\r\n");
}

  
function downloadTxt(filename, content){
  const blob=new Blob([content],{type:"text/plain;charset=utf-8"});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function dateShort(ts){ if(!ts) return ""; return new Date(ts).toLocaleDateString("fr-FR"); }

/* ==================== CHARGEMENT BL + COMMANDE ==================== */
// La commande est la REFERENCE : elle fournit le code G5, la quantité commandée et le CDT.
// Le BL sert à identifier les articles réellement livrés et le n° de BL.
// Les deux fichiers sont rapprochés avant d'être envoyés dans Firebase.
const multiFiles={}; // code -> { orderFile, orderParsed, blFile, blParsed, deliveryDate, supplier }

function normKey(s){ return String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g,"").trim(); }
function lineCandidates(l){
  return [l.code,l.article,l.ref,l.ean,l.designation].map(normKey).filter(Boolean);
}
function mergeOrderAndBL(order, bl){
  if(!order || order.format!=="CMD") throw new Error("Le bon de commande doit être un fichier XLSX/XLS de commande.");
  if(!bl || bl.format==='CMD') throw new Error("Le BL doit être un CSV, TXT ou PDF (pas la commande).");
  const blLines=bl.lines||[];
  const used=new Set();
  const merged=[];
  let unmatched=0;

  (order.lines||[]).forEach((ol, oi)=>{
    const keys=lineCandidates(ol);
    let bi=-1;
    // 1. correspondance exacte sur code / référence fournisseur / EAN / article
    for(let i=0;i<blLines.length;i++){
      if(used.has(i)) continue;
      const blc=lineCandidates(blLines[i]);
      if(keys.slice(0,4).some(k=>k && blc.includes(k))){ bi=i; break; }
    }
    // 2. secours : désignation normalisée suffisamment proche
    if(bi<0){
      const kd=normKey(ol.designation);
      if(kd && kd.length>=8){
        for(let i=0;i<blLines.length;i++){
          if(used.has(i)) continue;
          const bd=normKey(blLines[i].designation);
          if(bd && (bd===kd || bd.includes(kd) || kd.includes(bd))){ bi=i; break; }
        }
      }
    }

    const blLine=bi>=0 ? blLines[bi] : null;
    if(bi>=0) used.add(bi); else unmatched++;

    // La commande reste la source de vérité pour code G5 et attendu.
    // Le CDT (colisage) vient de la commande si présent, SINON du BL (ex. BL Vitafrais : colonne PCB).
    const cdtEff = (ol.cdt!=null) ? ol.cdt : (blLine && blLine.cdt!=null ? blLine.cdt : null);
    // VITAFRAIS : commande en UNITÉS (pas de colisage dans le BC) -> réception G5 en COLIS (PCB du BL).
    const vitaColis = /VITAFRAIS/i.test(String(bl.supplier||"")+" "+String(order.supplier||"")) && ol.cdt==null && cdtEff>1 && !ol.poidsVariable;
    const vitaQteCmd = vitaColis ? (((Number(ol.attendu)||0)%cdtEff===0) ? (Number(ol.attendu)||0)/cdtEff : (blLine&&blLine.qteCmd!=null?blLine.qteCmd:Math.max(1,Math.round((Number(ol.attendu)||0)/cdtEff)))) : null;
    merged.push({
      article: blLine?.article || ol.ref || ol.article || ol.code || "",
      code: ol.code || blLine?.code || "",
      ean: blLine?.ean || ol.ean || (String(ol.code||"").match(/^\d{12,13}$/)?String(ol.code):"") || "",
      ref: ol.ref || blLine?.article || "",
      designation: ol.designation || blLine?.designation || "",
      marque: blLine?.marque || ol.marque || "",
      cdt: cdtEff,
      qteCmd: vitaColis ? vitaQteCmd : ((ol.qteCmd!=null) ? ol.qteCmd : (blLine && blLine.qteCmd!=null ? blLine.qteCmd : null)),
      unit: vitaColis ? "colis" : (ol.unit || (blLine&&blLine.unit) || (cdtEff?"colis":"piece")),
      attendu: Number(ol.attendu)||0,
      poidsVariable: !!(ol.poidsVariable || blLine?.poidsVariable),
      categorie: blLine?.categorie || ol.categorie || "Autres",
      label: blLine?.label || ol.label || "",
      nonLivre: false,
      commandMatched: bi>=0,
      blArticle: blLine?.article || "",
      blEan: blLine?.ean || ""
    });
  });

  // Articles présents sur le BL mais absents de la commande : on les conserve,
  // mais avec attendu=0 pour qu'ils soient visibles et signalés au pointage.
  blLines.forEach((blLine,i)=>{
    if(used.has(i)) return;
    merged.push({
      article: blLine.article || blLine.ean || "",
      code: blLine.article || blLine.ean || "",
      ean: blLine.ean || "",
      ref: blLine.article || "",
      designation: blLine.designation || "",
      marque: blLine.marque || "",
      cdt: null, qteCmd:0, unit:"piece", attendu:0,
      poidsVariable:!!blLine.poidsVariable, categorie:blLine.categorie||"Autres",
      label:blLine.label||"", nonLivre:false, commandMatched:false,
      blArticle:blLine.article||"", blEan:blLine.ean||"", horsCommande:true
    });
  });

  return {
    format:"BL+CMD",
    g5Key:"code",
    supplier:order.supplier || bl.supplier || "",
    docNumber:bl.docNumber || order.docNumber || "",
    commandNumber:order.docNumber || "",
    deliveryDate:order.deliveryDate || "",
    lines:merged,
    reconciliation:{ commandLines:(order.lines||[]).length, blLines:blLines.length, unmatchedCommand:unmatched, unmatchedBL:merged.filter(x=>x.horsCommande).length }
  };
}
function parseNote(p){
  if(p.format==='BL+CMD'){
    const cl=p.lines.filter(l=>l.cdt).length;
    const hors=p.lines.filter(l=>l.horsCommande).length;
    return `<div class="parse-note">🔗 <b>BL + commande rapprochés</b> · BL ${esc(p.docNumber||'—')} · commande ${esc(p.commandNumber||'—')} · ${p.lines.length} lignes${cl?' · '+cl+' conditionnements':''}${hors?' · ⚠️ '+hors+' BL hors commande':''}</div>`;
  }
  if(p.format==='CMD'){
    const pv=p.lines.filter(l=>l.poidsVariable).length, cl=p.lines.filter(l=>l.cdt).length;
    return `<div class="parse-note">📋 <b>Commande ${esc(p.supplier||'?')}</b> ${esc(p.docNumber||'')} · ${p.lines.length} lignes${cl?(' · '+cl+' en colis'):''}${pv?(' · '+pv+' poids variable'):''}</div>`;
  }
  const g5 = p.g5Key==='article' ? ' · clé G5 : <b>code article</b>' : (p.g5Key==='ean' ? ' · clé G5 : EAN' : '');
  return `<div class="parse-note">N° <b>${esc(p.docNumber||'—')}</b> · ${esc(p.format)} · ${p.lines.length} lignes${p.skipped?(' · '+p.skipped+' ignorée(s)'):''}${g5}</div>`;
}
/* ==================== CHARGEMENT « LA CENTRALE PDP » (dispatch + découpe) ====================
   La console est la plateforme de gestion : on charge ICI le dispatch et le fichier de
   découpe, puis on POUSSE vers le Firebase CENTRALE (dbCentrale) — nœuds "dispatch" et
   "decoupe" — que l'app « La Centrale PDP » (tactile, entrepôt) lit ensuite. */
function stripAccentsC(s){ return String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,""); }
function normColC(s){ return stripAccentsC(String(s==null?"":s)).toLowerCase().trim(); }
function parseColisageC(v){ if(v==null||v==="") return 0; var s=String(v).trim().toUpperCase(); var m=s.match(/(\d+)/); if(!m) return 0; var n=parseInt(m[1],10); return isNaN(n)?0:n; }
function fracNum(v){ if(v==null||v==="") return 0; var s=String(v).trim(); var m=s.match(/^(\d+)\s*\/\s*(\d+)$/); if(m) return parseInt(m[1],10)/parseInt(m[2],10); var n=parseFloat(s.replace(",",".")); return isNaN(n)?0:n; }
const G5_STORE_MAP_C={ "01":"rob","03":"tol","98":"pdp","05":"bic","02":"bar","04":"bor","06":"ces","07":"cha","09":"for","10":"lil","11":"nca","12":"ncc","13":"pad","14":"pdc","17":"rom","18":"stb" };
const NON_STORE_KW_C=new Set(["article","code article","code","ref","reference","ean","barcode","sku","designation","libelle","nom","produit","description","quantite","qte","qty","uvc","uc","cde","cde en uvc","commande en uvc","commande","cmd","cdt","pcb","colisage","conditionnement","recue","receptionnee","recu","reception","quantite receptionnee","quantites receptionnees","quantite cmd frs","quantite cmd","prix","tarif","poids","poids kg","kg","tva","pu","pu ht","pu ttc","ht","ttc","puht","putc","total","totale","totaux","totalite","montant","montant ht","montant tva","montant ttc","remise","taux","marge","coef","coeff","lot","dlc","ddm","fournisseur","frs","four","famille",""]);
function parseG5CellC(v){ if(v===""||v==null) return 0; var s=v.toString().trim(); var lastSep=s.lastIndexOf("|||"); var numStr=lastSep>=0?s.substring(lastSep+3).trim():s; var um=numStr.match(/^(\d+)\s*u/); if(um) return parseInt(um[1],10); var n=parseFloat(numStr); return isNaN(n)?0:Math.round(n); }
function parseDispatchExcel(workbook){
  const sheet=workbook.Sheets[workbook.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:""});
  const isSigle=(s)=>/^[a-z0-9]{2,6}$/.test(s)&&!NON_STORE_KW_C.has(s);
  const detectStoreColumn=(cellRaw,cellNorm)=>{ if(!cellNorm) return null; if(NON_STORE_KW_C.has(cellNorm)) return null;
    if(cellNorm.startsWith("magasin")){ const code=cellNorm.replace(/^magasin\s*/,"").trim(); const mapped=G5_STORE_MAP_C[code]; if(mapped){ const uc=mapped.toUpperCase(); return {code:uc,label:uc,needsNaming:false}; } return {code:"MAGASIN_"+code,label:"Magasin "+code,needsNaming:true,originalHeader:cellRaw}; }
    if(isSigle(cellNorm)){ const uc=cellNorm.toUpperCase(); return {code:uc,label:uc,needsNaming:false}; }
    const tokens=cellNorm.split(/[\s\-_()\/]+/).filter(Boolean); for(const t of tokens){ if(isSigle(t)){ const uc=t.toUpperCase(); return {code:uc,label:uc,needsNaming:false}; } } return null; };
  let headerIdx=-1,headers=null;
  for(let i=0;i<Math.min(rows.length,20);i++){ const row=rows[i].map(c=>normColC(c));
    if(row.some(c=>c.includes("designation")||c==="produit"||c==="libelle"||c==="nom"||c==="article"||c==="description")){ headerIdx=i; headers=rows[i]; break; } }
  if(headerIdx===-1){ for(let i=0;i<Math.min(rows.length,20);i++){ const row=rows[i].map(c=>normColC(c));
    const hasQty=row.some(c=>c==="quantite"||c==="qte"||c==="qty"||c==="uvc"||c==="cde en uvc"||c==="cde"||c.includes("commande")||detectStoreColumn(null,c)!==null);
    const hasText=row.some(c=>c.length>0&&c.length<50&&!/^\d+([.,]\d+)?$/.test(c)); if(hasQty&&hasText){ headerIdx=i; headers=rows[i]; break; } } }
  if(headerIdx===-1) throw new Error("En-têtes dispatch introuvables (désignation/quantité).");
  const colMap={}; let isG5=false; const articleAsCode=[]; const storeColumns=[];
  headers.forEach((h,idx)=>{ const n=normColC(h); if(!n) return;
    if(n.includes("designation")||n==="produit"||n==="libelle"||n==="nom"||n==="description"){ if(colMap.designation===undefined) colMap.designation=idx; }
    else if(n==="article"){ articleAsCode.push(idx); }
    else if(n==="code article"||n==="code"||n==="ref"||n==="reference"||n==="ean"||n==="ean13"||n==="gencod"||n==="gencode"||n==="code barre"||n==="code barres"||n==="barcode"){ if(colMap.article===undefined) colMap.article=idx; }
    else if(n==="colisage"||n==="conditionnement"||n==="cond"||n==="pcb"||n==="cdt"||n.includes("colisage")||n.includes("conditionnement")||n.includes("par colis")||n.includes("nb colis")){ if(colMap.colisage===undefined) colMap.colisage=idx; }
    else if(detectStoreColumn(null,n)===null&&(n.includes("cmd")||n==="commande")){ if(colMap.cmd===undefined) colMap.cmd=idx; }
    else if(n.includes("recept")||n.includes("recu")||n==="recu"){ if(colMap.recue===undefined) colMap.recue=idx; }
    else { const def=detectStoreColumn(h,n); if(def){ storeColumns.push({idx,def}); if(n.startsWith("magasin")) isG5=true; } } });
  if(colMap.designation===undefined&&articleAsCode.length>0) colMap.designation=articleAsCode[0];
  if(colMap.designation===undefined) throw new Error("Colonne désignation introuvable.");
  if(storeColumns.length===0) throw new Error("Aucune colonne magasin/quantité trouvée.");
  const products=[];
  for(let i=headerIdx+1;i<rows.length;i++){ const row=rows[i]; if(!row||row.every(c=>c===""||c==null)) continue;
    const designation=String(row[colMap.designation]||"").trim(); if(!designation) continue;
    const parse=isG5?parseG5CellC:(v)=>{ if(v===""||v==null) return 0; const s=v.toString().trim(); const m=s.match(/^(\d+)\s*u/); if(m) return parseInt(m[1],10); const n=parseFloat(s.replace(",",".")); return isNaN(n)?0:Math.round(n); };
    const stores={}; let total=0; for(const sc of storeColumns){ const q=parse(row[sc.idx]); stores[sc.def.code]=q; total+=q; }
    if(total===0) continue;
    const recue=colMap.recue!==undefined?parse(row[colMap.recue]):total;
    const cmd=colMap.cmd!==undefined?parse(row[colMap.cmd]):recue;
    const colisage=colMap.colisage!==undefined?parseColisageC(row[colMap.colisage]):0;
    products.push({ article:colMap.article!==undefined?String(row[colMap.article]||"").trim():"", designation, cmd, recue, stores, colisage }); }
  return { products, storeColumns: storeColumns.map(s=>s.def) };
}
function parseBdcColisageC(workbook){

// Découpe S37 (Excel). Cmd (commande Montreuil) = cible à découper ; DÉCOUPE = plan ; Envoi = confirmation.
function parseDecoupeExcelS37(workbook){
  const ws=workbook.Sheets[workbook.SheetNames[0]];

  if(h===-1) throw new Error("En-têtes découpe introuvables (DESIGNATION / DÉCOUPE / REF).");
  let iRef=-1,iCode=-1,iDes=-1,iDecoupe=-1,iCmd=-1,iEnvoi=-1,iFour=-1;
  header.forEach((c,idx)=>{ const n=N(c);
    if(iDes<0&&n.includes("designation")) iDes=idx;
    if(iRef<0&&n==="ref") iRef=idx;
    if(iCode<0&&(n.includes("code article")||n==="code")) iCode=idx;
    if(iDecoupe<0&&n.includes("decoupe")) iDecoupe=idx;
    if(iCmd<0&&(n==="cmd"||n.includes("cmd")||n.includes("commande"))) iCmd=idx;
    if(iEnvoi<0&&n.includes("envoi")) iEnvoi=idx;
    if(iFour<0&&n.includes("fournisseur")) iFour=idx; });
  if(iDes<0) throw new Error("Colonne DESIGNATION introuvable.");

  for(let i=h+1;i<rows.length;i++){ const row=rows[i]; if(!row) continue; const des=String(row[iDes]||"").trim(); if(!des) continue;
    const dl=stripAccentsC(des.toLowerCase()); if(dl.includes("stock initial")||dl.includes("stock pantin")||dl==="designation") continue;
    const ref=iRef>=0?String(row[iRef]||"").trim():""; const code=iCode>=0?String(row[iCode]||"").trim():"";
    const cmd=iCmd>=0?fracNum(row[iCmd]):0; const dec=iDecoupe>=0?fracNum(row[iDecoupe]):0; const envoi=iEnvoi>=0?fracNum(row[iEnvoi]):0;
    products.push({ article:ref||code, ref, code, designation:des, fournisseur:iFour>=0?String(row[iFour]||"").trim():"", commande:(cmd||dec||0), decoupePlan:dec, envoi }); }
  if(!products.length) throw new Error("Aucune ligne fromage trouvée.");
  return { products };
}
// BL fournisseur UGALAIT (Excel) : Code article | Désignation | Cdt | Qté colis | Qté pièces | Poids net…
function parseUgalaitBL(workbook){
  const ws=workbook.Sheets[workbook.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""}); const N=normColC;
  let h=-1,header=null;
  for(let i=0;i<Math.min(rows.length,30);i++){ const r=rows[i].map(N);
    if(r.some(c=>c.includes("designation")) && (r.some(c=>c.includes("code article")||c==="code") ) && r.some(c=>c.includes("piece")||c.includes("colis")||c.includes("qte")||c.includes("poids"))){ h=i; header=rows[i]; break; } }
  if(h===-1) throw new Error("En-têtes BL Ugalait introuvables.");
  let iCode=-1,iDes=-1,iPie=-1,iCol=-1,iPds=-1;
  header.forEach((c,idx)=>{ const n=N(c);
    if(iCode<0&&(n.includes("code article")||n==="code")) iCode=idx;
    if(iDes<0&&n.includes("designation")) iDes=idx;
    if(iPie<0&&(n.includes("piece"))) iPie=idx;
    if(iCol<0&&(n.includes("colis"))) iCol=idx;
    if(iPds<0&&(n.includes("poids"))) iPds=idx; });
  if(iDes<0) throw new Error("Colonne Désignation introuvable (BL Ugalait).");
  const num=(v)=>{ const n=parseFloat(String(v).replace(",",".").replace(/[^\d.]/g,"")); return isNaN(n)?0:n; };
  const products=[]; let docNumber="";
  for(let i=h+1;i<rows.length;i++){ const row=rows[i]; if(!row) continue;
    const des=String(row[iDes]||"").trim(); if(!des) continue;
    const dl=stripAccentsC(des.toLowerCase()); if(dl.includes("ne pas remplacer")||dl.includes("total")) continue;
    const code=iCode>=0?String(row[iCode]||"").trim():"";
    const pie=iPie>=0?num(row[iPie]):0, col=iCol>=0?num(row[iCol]):0, pds=iPds>=0?num(row[iPds]):0;
    const qte=pie||col||0;
    const poids=(pie>0&&pds>0)?Math.round(pds/pie*1000):0; // g/pièce si dispo
    products.push({ article:code, ref:code, code, designation:des, fournisseur:"UGALAIT", commande:qte, decoupePlan:0, envoi:0, poids:poids||0, poidsRecu:pds||0, rupture:qte===0 }); }
  if(!products.length) throw new Error("Aucune ligne article trouvée dans le BL.");
  const mBL=String(workbook.__name||"").match(/(\d{5,})/); if(mBL) docNumber=mBL[1];
  return { products, supplier:"UGALAIT", docNumber };
}
// Choisit automatiquement le bon parseur Excel (découpe S37 OU BL Ugalait).
function parseDecoupeAnyExcel(workbook){
  const ws=workbook.Sheets[workbook.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""}); const N=normColC;
  let isS37=false, isBL=false;
  for(let i=0;i<Math.min(rows.length,30);i++){ const r=rows[i].map(N);
    if(r.some(c=>c.includes("decoupe"))||r.some(c=>c==="ref")||r.some(c=>c.includes("cmd"))) isS37=true;
    if(r.some(c=>c.includes("code article"))&&(r.some(c=>c.includes("piece"))||r.some(c=>c.includes("poids")))) isBL=true; }
  if(isBL && !isS37) return parseUgalaitBL(workbook);

}
async function readDecoupePDFrows(buf){
  const pdf=await pdfjsLib.getDocument({data:buf}).promise; let rowLines=[];
  for(let p=1;p<=pdf.numPages;p++){ const page=await pdf.getPage(p); const tc=await page.getTextContent(); const rows={};
    for(const it of tc.items){ const y=Math.round(it.transform[5]); (rows[y]=rows[y]||[]).push([it.transform[4],it.str]); }
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{ const line=rows[y].sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(" ").replace(/\s+/g," ").trim(); if(line) rowLines.push(line); }); }
  return rowLines;
}
function parseDecoupeS37Rows(rowLines){

// BL fournisseur UGALAIT en PDF (v1.7.5). pdf.js sort chaque article sur TROIS lignes
// consécutives : (1) les quantités « Cdt Colis Pièces PoidsNet PU MtHT » — parfois
// préfixées de *BIO* ou PROMO, ou de la forme « Cdt RUPTURE 0,000 » ; (2) le code
// article seul (ex. 043646D) ; (3) la désignation seule (ex. BLEU BREBIS REGALIS).
function cleanUgalaitDes(s){
  return String(s||"").replace(/\*\s*BIO\s*\*/gi," ").replace(/\bPROMO\b/gi," ").replace(/\s{2,}/g," ").trim();
}
function parseUgalaitPDFrows(rowLines){
  const products=[]; let docNumber="";
  const isCode = (s)=>/^\d{5,7}[A-Za-z]?$/.test(String(s||"").trim());
  for(let i=0;i<rowLines.length;i++){
    const L=String(rowLines[i]||"").trim();
    const mBL=L.match(/BL\s*n[°ºo]?\s*:?\s*(\d{4,})/i); if(mBL&&!docNumber) docNumber=mBL[1];
    if(!isCode(L)) continue;                       // on s'ancre sur la ligne "code article"
    const code=L;
    const numbers=String(rowLines[i-1]||"");       // ligne AU-DESSUS = quantités
    let desig=String(rowLines[i+1]||"");           // ligne EN-DESSOUS = désignation
    if(isCode(desig) || /RUPTURE/i.test(desig) || /^[\d.,\s]+$/.test(desig)) desig=""; // garde-fou
    const nb=numbers.replace(/\*\s*BIO\s*\*/gi," ").replace(/\bPROMO\b/gi," ").trim();
    let pieces=0, poidsG=0, poidsKg=0, rupture=false;
    if(/RUPTURE/i.test(nb)){ rupture=true; }
    else {
      const nums=nb.match(/\d+(?:[.,]\d+)?/g)||[];  // [Cdt, Colis, Pièces, PoidsKg, PU, MtHT]
      if(nums.length>=3){
        pieces=parseInt(nums[2],10)||0;
        poidsKg=(nums.length>=4)?toNum(nums[3]):0;   // poids net TOTAL reçu (kg) de la ligne
        poidsG=(pieces>0&&poidsKg>0)?Math.round(poidsKg/pieces*1000):0; // g / pièce
      }
    }
    const designation=cleanUgalaitDes(desig) || ("Article "+code);
    products.push({ article:code, ref:code, code:code, designation,
      fournisseur:"UGALAIT", commande:pieces, decoupePlan:0, envoi:0, poids:poidsG||0, poidsRecu:poidsKg||0, rupture });
  }
  // Secours : ancien format 1-ligne (autre mise en page éventuelle).
  if(!products.length){
    for(const L of rowLines){
      const m=String(L).match(/^(\d{5,7}[A-Za-z]?)\s+(.+?)\s+(\d+)\s+(\d+)\s+(\d+)\s+([\d.,]+)/);
      if(m){ const pj=parseInt(m[5],10)||0, pk=toNum(m[6]);
        products.push({ article:m[1], ref:m[1], code:m[1], designation:cleanUgalaitDes(m[2]),
          fournisseur:"UGALAIT", commande:pj, decoupePlan:0, envoi:0,
          poids:(pj>0&&pk>0)?Math.round(pk/pj*1000):0, poidsRecu:pk||0, rupture:false }); }
    }
  }
  if(!products.length) throw new Error("PDF Ugalait : aucune ligne article reconnue.");
  // Dédoublonnage : le PDF contient souvent plusieurs exemplaires du même BL (1/3, 2/3, 3/3).
  const seen={}, uniq=[];
  for(const p of products){ const k=String(p.code||p.designation||""); if(k&&!seen[k]){ seen[k]=1; uniq.push(p); } }
  return { products:uniq, supplier:"UGALAIT", docNumber };
}

function kbgRefPoids(designation){
