// Parse l'export G5 vin : colonnes Article (code), Désignation, Fournisseur (ex "F029 / MELLOT").
function parseVinExportC(workbook){
  const ws=workbook.Sheets[workbook.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
  const N=(s)=>String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
  let h=-1,hd=null;
  for(let i=0;i<Math.min(rows.length,15);i++){ const r=rows[i].map(N);
    if(r.some(c=>c==="article"||c==="code article"||c==="code") && r.some(c=>c.includes("fournisseur"))){ h=i; hd=rows[i]; break; } }
  if(h===-1) throw new Error("En-têtes introuvables (Article + Fournisseur).");
  const col=(cands)=>{ for(const cnd of cands){ const i=hd.findIndex(x=>N(x)===cnd); if(i>=0) return i; } for(const cnd of cands){ const i=hd.findIndex(x=>N(x).includes(cnd)); if(i>=0) return i; } return -1; };
  const iCode=col(["article","code article","code","ean","gencod"]);
  const iDes=col(["designation","libelle","produit","nom"]);
  const iFour=col(["fournisseur","frs"]);
  if(iCode<0||iFour<0) throw new Error("Colonnes Article/Fournisseur manquantes.");
  const rowsOut=[]; const supMap={};
  for(let i=h+1;i<rows.length;i++){ const r=rows[i]; if(!r) continue;
    const code=String(r[iCode]||"").trim(); const des=iDes>=0?String(r[iDes]||"").trim():"";
    let four=String(r[iFour]||"").trim(); if(!code&&!des) continue; if(!four) continue;
    // Regroupe par NOM (partie après le "/"), en fusionnant les doublons F029 / K029.
    const parts=four.split("/"); const name=(parts.length>1?parts.slice(1).join("/"):four).trim();
    const key=N(name).replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"")||"frs";
    rowsOut.push({ code, designation:des, fournisseur:name, fkey:key });
    if(!supMap[key]) supMap[key]={ key, label:name, count:0 }; supMap[key].count++;
  }
  const suppliers=Object.values(supMap).sort((a,b)=>b.count-a.count);
  return { rows:rowsOut, suppliers };
}
async function cpdpVinFile(file){ if(!file) return; cpdp.vin.err=""; cpdp.vin.fileName=file.name||"export vin";
  try{ const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:"array"}); const p=parseVinExportC(wb);
    cpdp.vin.parsed=p; cpdp.vin.suppliers=p.suppliers; cpdp.vin.selected={}; cpdp.vin.sent=false; }
  catch(e){ cpdp.vin.parsed=null; cpdp.vin.err="Erreur : "+e.message; } renderCPDPCard(); }
function cpdpVinAll(v){ (cpdp.vin.suppliers||[]).forEach(s=>{ cpdp.vin.selected[s.key]=!!v; }); renderCPDPCard(); }
async function cpdpSendVin(){
  const V=cpdp.vin; if(!V.parsed){ return; }
  if(!dbCentrale){ V.err="Connexion centrale indisponible."; renderCPDPCard(); return; }
  const day=V.date|| (new Date()).toISOString().slice(0,10);
  const chosen=(V.suppliers||[]).filter(s=>V.selected[s.key]);
  if(!chosen.length){ V.err="Choisis au moins un fournisseur."; renderCPDPCard(); return; }
  try{
    for(const s of chosen){
      const ref=V.parsed.rows.filter(r=>r.fkey===s.key).map(r=>({ code:r.code, designation:r.designation }));
      const id="vincible_"+day.replace(/-/g,"")+"_"+s.key+"_"+Date.now().toString().slice(-5);
      await dbCentrale.ref("inventaire_vin/"+id+"/meta").set({
        label:"Ciblé — "+s.label, startedAt:Date.now(), dateKey:day, createdBy:ME_EMAIL,
        cible:true, fournisseur:s.label, ref:ref });
    }
    V.sent=true; V.err=""; renderCPDPCard();
    alert("✓ "+chosen.length+" inventaire(s) ciblé(s) envoyé(s) à l'app La Centrale pour le "+day+".");
    setTimeout(()=>{ cpdp.vin={ date:V.date, parsed:null, fileName:"", suppliers:[], selected:{}, sent:false, err:"" }; renderCPDPCard(); },1500);
  }catch(e){ V.err="Erreur d'envoi : "+e.message; renderCPDPCard(); }
}

"K134":"MAISADOUR","F085":"MAISON BIO SAIN","F124":"MAISON DELAMARRE","F129":"MAISON HAVAS","F071":"MARKAL","F029":"MELLOT","K029":"MELLOT","F126":"MILPAS","126":"MILPAS","K093":"MONGESTINE","F093":"MONGESTINE","K147":"MORTIER","F083":"MOULIN DES MOINES","K136":"MR MUESLI","F109":"NATESCIENCE","F008":"NUTRITION & SANTE","F088":"ON SEME TOUS","F018":"PATIBIO","F079":"PATRICK BOUMARD","PDP":"PDP","K137":"PEPIN LA BALLE","F002":"PHARMACIE DELPECH","F080":"PODER","F105":"POPOTE","028":"PORC BIO DU CENTRE","F123":"PRIBON TOLBIAC","F003":"PRIM BIO","F099":"PROBON","PROBON":"PROBON","F055":"PRONADIS","F100":"PROSAIN FAVRICHON","F019":"PURAL (CLIENT 30200)","F094":"RELAIS VERT","F107":"RICARDELLE DE LAUTREC","K107":"RICARDELLE DE LAUTREC","K046":"RIMBERT","F028":"ROCHEBLIN","K026":"SAFA KING SEE FOOD","F095":"SAINT CYRGUES","F043":"SAPORIT","F061":"SAS BLANC","F062":"SAS CHB - COCHONS DE MARZAN","K127":"SAVAGE ROASTERS","F127":"SAVAGE ROASTERS","F086":"SAVARY","K113":"SBV","KO04":"SBV","F113":"SBV","F020":"SENFAS","F023":"SICABA","F121":"SODIS UD","F009":"SOLE MIO","F044":"SOVINTEX","F042":"STURM","F115":"SUPERNATURAL","F133":"SYMBIOSE","K140":"SYMPLES","F021":"TEMACO","F070":"TERRE DE CHANVRE","F056":"TERRE DE MIEL","F125":"TERRE ET FOURCHETTE","F067":"UGALAIT","K138":"UMA","F068":"UNION FRUITIERES BIO COMTOISES","K141":"VAILLANT GRANDES VIGNES","F025":"VENDEUR FL","K142":"VIGNEAU CHEVREAU","K096":"VILLA NORIA","F096":"VILLA NORIA","K060":"VINCENT COUCHE","F060":"VINCENT COUCHE","F022":"VITAFRAIS","F064":"VITAGERMINE","F110":"VITAL+","F027":"VITAMONT","F048":"WALLO WASH"};
function pickingSupName(code){
  const c=String(code||"").trim().toUpperCase(); if(!c) return "";
  return PICKING_FOURN[c] || PICKING_FOURN[c.replace(/^([A-Z])O/,"$10")] || PICKING_FOURN[c.replace(/^([A-Z])0/,"$1O")] || c;
}
function pickingStoreFromText(t){
  const n=normColC(t);
  if(/montreuil|robespierre/.test(n)) return "ROB";
  if(/tolbiac/.test(n)) return "TOL";
  if(/bichat/.test(n)) return "BIC";
  return "";
}
function pickingNum(v){ if(v==null||v==="") return 0; const n=parseFloat(String(v).replace(/\s/g,"").replace(",",".")); return isNaN(n)?0:n; }
function parsePickingExcel(workbook){
  const sheet=workbook.Sheets[workbook.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:"",raw:true}); // raw : EAN sans notation 3.77E+12
  let orderNum="", orderDate="", store="";
  // En-tête : N° de commande, date, magasin.
  for(const r of rows){
    const cells=r.map(c=>String(c==null?"":c).trim());
    const c0=normColC(cells[0]);
    if(/commande.*centrale/.test(c0)){ const rest=cells.slice(1).filter(Boolean); if(!orderNum&&rest[0]) orderNum=rest[0]; if(!store) rest.forEach(x=>{ if(!store) store=pickingStoreFromText(x); }); }
    else if(c0==="le" && !orderDate){ const v=r.slice(1).find(x=>x!==""&&x!=null); orderDate=(typeof v==="number")?XLSX.SSF.format("dd/mm/yyyy",v):String(v||""); }
    else if(!store && /^pribon\s*-/.test(c0)){ store=pickingStoreFromText(cells[0]); }
  }
  // Colonnes (1re ligne d'en-tête « Code … Désignation … Qté … Fournisseur »).
  let hIdx=-1, col={};
  for(let i=0;i<Math.min(rows.length,40);i++){
    const n=rows[i].map(c=>normColC(c));
    if(n.some(c=>c==="designation"||c==="libelle") && n.some(c=>/^qte|^quantite/.test(c))){ hIdx=i;
      n.forEach((c,j)=>{ if(c==="code"||c==="code article"||c==="ean") col.code=(col.code===undefined?j:col.code);
        else if(c.startsWith("ref")) col.ref=j; else if(c==="designation"||c==="libelle") col.des=j;
        else if(c.startsWith("pu")) col.pu=j; else if(/^qte|^quantite/.test(c)) col.qty=j; else if(c.startsWith("fournisseur")||c==="frs") col.sup=j; });
      break; }
  }
  if(hIdx===-1||col.des===undefined||col.qty===undefined) throw new Error("Format non reconnu : colonnes Désignation / Qté introuvables.");
  const products=[], seen={};
  for(let i=hIdx+1;i<rows.length;i++){ const r=rows[i]; if(!r) continue;
    const des=String(r[col.des]||"").trim(); if(!des || normColC(des)==="designation") continue; // en-tête répété (saut de page)
    const qty=Math.round(pickingNum(r[col.qty])); if(qty<=0) continue;
    const rawE=col.code!==undefined?r[col.code]:""; const ean=(typeof rawE==="number"?String(Math.round(rawE)):String(rawE)).replace(/\s/g,"").replace(/\.0+$/,"");
    const supCode=String(col.sup!==undefined?r[col.sup]:"").trim().toUpperCase();
    let k=ean?("e_"+ean.replace(/[^0-9A-Za-z]/g,"")):("i_"+i); if(seen[k]) k=k+"_"+i; seen[k]=1;
    products.push({ k, ean, ref:String(col.ref!==undefined?r[col.ref]:"").trim(), designation:des, pu:pickingNum(col.pu!==undefined?r[col.pu]:0), qty, supCode, supName:pickingSupName(supCode) });
  }
  if(!products.length) throw new Error("Aucune ligne produit (Qté > 0) trouvée.");
  return { orderNum, orderDate, store, products };
}
async function cpdpPickingFile(file){ if(!file) return; const P=cpdp.picking; P.err=""; P.fileName=file.name||"picking";
  try{ const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:"array"}); P.parsed=parsePickingExcel(wb); P.sent=false;
    if(P.parsed.store) P.store=P.parsed.store; }
  catch(e){ P.parsed=null; P.err="Erreur : "+e.message; } renderCPDPCard(); }
async function cpdpSendPicking(){
  const P=cpdp.picking; if(!P.parsed) return;
  if(!P.store){ P.err="Choisis le magasin destinataire."; renderCPDPCard(); return; }
  if(!dbCentrale){ P.err="Connexion centrale indisponible."; renderCPDPCard(); return; }
  const st=PICKING_STORES.find(x=>x.code===P.store)||{code:P.store,label:P.store};
  const num=String(P.parsed.orderNum||"").replace(/[^a-zA-Z0-9]/g,"");
  const sid="pk_"+st.code.toLowerCase()+"_"+(num||Date.now());
  const ex=(centraleState.picking||{})[sid];
  if(ex&&ex.meta){ const x=pickingStatsC(ex);
    if(!confirm("Ce picking existe déjà ("+st.label+" · commande "+(P.parsed.orderNum||"")+" · "+x.done+"/"+x.total+" pointés"+(ex.closed?" · CLÔTURÉ":"")+").\n\nLe REMPLACER (le pointage existant sera effacé) ?")) return;
    try{ await dbCentrale.ref("picking/"+sid).remove(); }catch(e){} }
  const nbSup=new Set(P.parsed.products.map(p=>p.supName||p.supCode)).size;
  try{ await dbCentrale.ref("picking/"+sid+"/meta").set({ kind:"picking", orderNum:P.parsed.orderNum||"", orderDate:P.parsed.orderDate||"", storeCode:st.code, storeLabel:st.label,
      fileName:P.fileName||"", products:P.parsed.products, nbSup, startedAt:Date.now(), createdBy:ME_EMAIL });
    P.sent=true; P.err=""; renderCPDPCard();
    alert("✓ Picking « "+st.label+" » (commande "+(P.parsed.orderNum||"—")+", "+P.parsed.products.length+" produits, "+nbSup+" fournisseurs) envoyé à La Centrale PDP.");
    setTimeout(()=>{ cpdp.picking={ parsed:null, fileName:"", store:"", sent:false, err:"" }; renderCPDPCard(); },1500);
  }catch(e){ P.err="Erreur d'envoi : "+e.message; renderCPDPCard(); }
}
// Stats d'un picking (même logique que la tablette).
function pickingStatsC(p){
  const prods=(p&&p.meta&&p.meta.products)||[]; const st=(p&&p.state)||{};
  let done=0, ok=0, short=0, qty=0, picked=0; const ops={}; let first=0,last=0;
  prods.forEach(x=>{ const s=st[x.k]; qty+=Number(x.qty)||0;
    if(s&&s.done){ done++; const pq=Number(s.picked)||0; picked+=pq; if(pq>=(Number(x.qty)||0)) ok++; else short++;
      if(s.doneBy&&!s.auto) ops[s.doneBy]=1; if(s.doneAt&&!s.auto){ if(!first||s.doneAt<first) first=s.doneAt; if(s.doneAt>last) last=s.doneAt; } } });
  return { total:prods.length, done, ok, short, qty, picked, operators:Object.keys(ops), durationMs:(first&&last)?(last-first):0 };
}

function pickingExportLines(s){
  const m=s.meta||{}, st=s.state||{};
  return (m.products||[]).map(p=>{ const x=st[p.k]||{}; const picked=x.done?(Number(x.picked)||0):0;
    return { supplier:p.supName||p.supCode||"", supCode:p.supCode||"", ean:p.ean||"", designation:p.designation||"", qty:Number(p.qty)||0, picked,
      ecart:picked-(Number(p.qty)||0), done:!!x.done, by:x.doneBy||"", at:x.doneAt||0 }; })
    .sort((a,b)=>a.supplier.localeCompare(b.supplier,"fr")||a.designation.localeCompare(b.designation,"fr"));
}
function pickingFileBase(s){
  const m=s.meta||{}; const d=new Date((s.closed&&s.closed.at)||m.startedAt||Date.now());
  const yy=String(d.getFullYear()).slice(-2),mm=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");
  return yy+mm+dd+"_PICKING_"+(m.storeCode||"MAG")+"_"+String(m.orderNum||"").replace(/[^a-zA-Z0-9-]/g,"");
}
// Excel : mêmes colonnes que le récap (détail + mail), classé par fournisseur. Onglet « Infos » = en-tête du picking.
function dlPickingXlsx(sid){
  const s=(centraleState.picking||{})[sid]; if(!s||!s.meta) return; const m=s.meta; const x=pickingStatsC(s);
  const L=pickingExportLines(s);
  const rows=[["Fournisseur","Code fourn.","Code (EAN)","Désignation","Commandé","Mis palette","Écart","Statut","Préparé par","Validé le"]]
    .concat(L.map(l=>[l.supplier,l.supCode,l.ean,l.designation,l.qty,l.picked,l.ecart,
      !l.done?"Non pointé":(l.ecart<0?"Manque":(l.ecart>0?"Surplus":"OK")), l.by, l.at?new Date(l.at).toLocaleString("fr-FR"):""]));
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"]=[{wch:22},{wch:10},{wch:15},{wch:46},{wch:10},{wch:11},{wch:7},{wch:11},{wch:18},{wch:18}];
  ws["!autofilter"]={ref:"A1:J"+rows.length};
  const info=XLSX.utils.aoa_to_sheet([
    ["Picking", m.orderNum||""],["Date commande", m.orderDate||""],["Magasin", (m.storeCode||"")+" — "+(m.storeLabel||"")],
    ["Chargé le", m.startedAt?new Date(m.startedAt).toLocaleString("fr-FR"):""],["Chargé par", m.createdBy||""],
    ["Clôturé le", s.closed&&s.closed.at?new Date(s.closed.at).toLocaleString("fr-FR"):"en cours"],["Clôturé par", (s.closed&&s.closed.by)||""],
    ["Lignes", x.total],["OK", x.ok],["Manques", x.short],["Unités commandées", x.qty],["Unités mises palette", x.picked]]);
  info["!cols"]=[{wch:20},{wch:40}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Picking"); XLSX.utils.book_append_sheet(wb,info,"Infos");

async function cpdpSendDecoupe(){
  const C=cpdp.decoupe; if(!C.parsed) return; if(!dbCentrale){ C.err="Connexion centrale indisponible."; renderCPDPCard(); return; }
  const entLabel=C.entity==="KBG"?"Kelbongoo":"Robespierre"; const products=decoupeProductsForApp(C.parsed,C.entity);
  const blNum=(C.blNumber||C.parsed.docNumber||"").toString().trim();
  // N° de BL OBLIGATOIRE : c'est lui qui relie le BL du responsable à la découpe de l'opérateur.
  if(!blNum){ C.err="⚠️ N° de BL obligatoire — saisis-le avant d'envoyer (il sert à relier le BL à la découpe de l'entrepôt)."; renderCPDPCard(); try{ document.getElementById("cpdpBl").focus(); }catch(_){} return; }
  const supLabel=(C.parsed.supplier?(C.parsed.supplier+" → "):"")+entLabel+" · BL "+blNum;
  // Rapprochement découpe ↔ BL : clé bl_<entité>_<num> (même clé que l'opérateur sur la tablette).
  // Si une découpe de ce BL existe déjà sous un autre identifiant (BL saisi après coup, ancienne version), on la reprend.
  const blKey=blNum.replace(/[^a-zA-Z0-9]/g,"");
  let sid = "bl_"+C.entity.toLowerCase()+"_"+blKey;
  const allDec=centraleState.decoupe||{};
  if(!(allDec[sid]&&allDec[sid].meta)){
    const found=Object.entries(allDec).find(([k,s])=>s&&s.meta&&s.meta.startedAt&&String(s.meta.docNumber||"").replace(/[^a-zA-Z0-9]/g,"")===blKey&&String(s.meta.entity||"").toUpperCase()===C.entity);
    if(found) sid=found[0];
  }
  const existingMeta=(allDec[sid]&&allDec[sid].meta)||null;
  const alreadyStarted=!!(existingMeta&&existingMeta.startedAt);
  // FUSION : si l'opérateur a déjà ajouté des fromages (découpe libre), on garde ses ajouts et on
  // fusionne les fromages du BL par désignation normalisée (même clé que frKey côté app).
  // Le BL est prioritaire sur SES fromages (poids reçu, quantités) ; les extras de l'opérateur sont conservés.
  const frNK = (d)=>String(d==null?"":d).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");
  let mergedProducts = products;
  try{
    const exSnap = await dbCentrale.ref("decoupe/"+sid+"/meta/products").once("value");
    const existing = exSnap.val();
    if(Array.isArray(existing) && existing.length){
      const byKey={}, order=[];
      existing.forEach(p=>{ if(p&&p.designation){ const k=frNK(p.designation); if(!(k in byKey)) order.push(k); byKey[k]=p; } });
      products.forEach(p=>{ if(p&&p.designation){ const k=frNK(p.designation); if(!(k in byKey)) order.push(k); byKey[k]=Object.assign({}, byKey[k]||{}, p); } });
      mergedProducts = order.map(k=>byKey[k]);
    }
  }catch(_){}
  // Découpe déjà commencée : on GARDE sa date de départ et son opérateur (l'historique reste daté du jour de découpe),
  // on ajoute « chargé par le responsable » + les fromages du BL.
  const blFromages=products.map(p=>p&&p.designation).filter(Boolean);
  const patch={ supplier:supLabel, entity:C.entity, deliveryDate:C.deliveryDate||"", docNumber:blNum, products:mergedProducts,
                loadedBy:ME_EMAIL, loadedAt:Date.now(), source:"console", libre:false,
                blFromages, blFile:C.fileName||"", blSupplier:C.parsed.supplier||"", blClos:false };
  if(!alreadyStarted){ patch.startedAt=Date.now(); patch.createdBy=ME_EMAIL; }
  try{ await dbCentrale.ref("decoupe/"+sid+"/meta").update(patch);
    blLog(sid, existingMeta&&existingMeta.loadedBy?"rechargement":"chargement", { bl:blNum, entity:C.entity, file:C.fileName||"", n:blFromages.length, joined:alreadyStarted });
    C.sent=true; C.err=""; renderCPDPCard();
    alert("✓ BL "+entLabel+" n°"+blNum+" envoyé à l'app La Centrale PDP"+(C.deliveryDate?(" · réception prévue "+C.deliveryDate):"")+"."
      +(alreadyStarted?("\n\n🔗 Découpe déjà commencée par l'entrepôt ("+dateShort(existingMeta.startedAt)+") : BL rattaché, liste mise à jour ("+mergedProducts.length+" fromages). Les saisies déjà faites sont conservées."):""));
    setTimeout(()=>{ cpdp.decoupe={ entity:C.entity, deliveryDate:C.deliveryDate, parsed:null, fileName:"", blNumber:"", sent:false, err:"" }; renderCPDPCard(); },1500);
  }catch(e){ C.err="Erreur d'envoi : "+e.message; renderCPDPCard(); }
}

// Nom de fichier G5 : AAMMJJ_FOURNISSEUR_BL.txt (ex : 260814_BIODIS_1154370.txt)
function g5Filename(r){
  const d=new Date(r.validatedAt||r.createdAt||Date.now());
  const yy=String(d.getFullYear()).slice(-2), mm=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
  const sup=String(r.supplier||"FOURNISSEUR").toUpperCase().replace(/[^A-Z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "FOURNISSEUR";
  const bl=String(r.docNumber||"BL").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "BL";
  return yy+mm+dd+"_"+sup+"_"+bl+".txt";
}
function dlG5(code,id){
  const st=state[code]; const r=st.receptions[id]; const doc=st.docs[r.docId]||null;
  const txt=buildG5Txt(r,doc);
  if(!txt){ alert("Aucune ligne avec code (EAN / article) — impossible de générer le .txt."); return; }
  if(isVitafraisDoc(doc,r) && doc && doc.lines){
    const seen=new Set();
    const inc=vitafraisColisLines(doc.lines.filter(l=>!l.nonLivre)).filter((l,i)=>{ const lk=lineKeyOf(l,i); if(seen.has(lk)) return false; seen.add(lk); const s2=(r.lines||{})[lk]||{}; return l.pcbInconnu && s2.status && s2.status!=='nonrecu'; });
    if(inc.length) alert("⚠️ Vitafrais : PCB (pièces/colis) inconnu pour "+inc.length+" article(s) absent(s) du BL.\nIls sont dans le .txt en UNITÉS — à corriger en colis sur G5 :\n\n"+inc.map(l=>"• "+(l.designation||l.code)+" ("+l.attendu+" u.)").join("\n"));
  }
  downloadTxt(g5Filename(r), txt);
}

function queueNames(){
  const need=new Set();
  Object.values(state).forEach(st=>{
    Object.values(st.receptions||{}).forEach(r=>{ if(r.operatorCode&&!(r.operatorCode in names)) need.add(r.operatorCode); });
    Object.values(st.broadcasts||{}).forEach(b=>{ Object.keys(b.reads||{}).forEach(c=>{ if(!(c in names)) need.add(c); }); });
  });
  if(!need.size||pendingNames) return;
  pendingNames=true;
  fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action:"resolve-names",idToken:ID_TOKEN,codes:Array.from(need)})})
    .then(r=>r.json()).then(j=>{ if(j&&j.names) Object.assign(names,j.names); pendingNames=false; renderSuivi(); renderMsg(); })
    .catch(()=>{ pendingNames=false; });
}
function activeCount(doc){ if(!doc||!doc.lines) return 0; return doc.lines.filter(l=>!l.nonLivre).length; }
function pointed(recLines){ return Object.values(recLines||{}).filter(s=>s&&s.status).length; }
function since(ts){ if(!ts) return ""; let s=Math.max(0,Math.floor((Date.now()-ts)/1000));
  const h=Math.floor(s/3600); s%=3600; const m=Math.floor(s/60); s%=60;
  return (h?h+"h":"")+String(m).padStart(h?2:1,"0")+"m"+String(s).padStart(2,"0"); }
function heure(ts){ if(!ts) return ""; const d=new Date(ts); return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }
/* --- Suivi live : regroupé par DATE D'ENVOI (chargement du document au magasin) --- */
function tsFromFr(fr){ if(!fr) return 0; const m=String(fr).split("/"); if(m.length!==3) return 0; const t=new Date(+m[2],+m[1]-1,+m[0]).getTime(); return isNaN(t)?0:t; }
function dayKeyTs(ts){ const d=new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayLabel(ts){ if(!ts) return "Sans date d'envoi"; const d=new Date(ts); const kd=dayKeyTs(ts), kt=dayKeyTs(Date.now()), ky=dayKeyTs(Date.now()-86400000);
  if(kd===kt) return "Aujourd'hui — "+d.toLocaleDateString("fr-FR");
  if(kd===ky) return "Hier — "+d.toLocaleDateString("fr-FR");
  return d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}); }

// Suivi live : supprimer UN élément (popup de confirmation)
async function liveDelete(kind, a, b){

let liveDayItems={};
async function liveDeleteDay(k){
  const list=liveDayItems[k]||[]; if(!list.length) return;
  const n={doc:0,rec:0,dispatch:0,picking:0,decoupe:0}; list.forEach(x=>{ if(x.kind==="doc")n.doc++; else if(x.kind.startsWith("rec"))n.rec++; else n[x.kind]++; });
  const det=[n.doc?n.doc+" document(s) envoyé(s)":"", n.rec?n.rec+" réception(s)":"", n.dispatch?n.dispatch+" dispatch":"", n.picking?n.picking+" picking":"", n.decoupe?n.decoupe+" découpe(s)":""].filter(Boolean).join(" · ");
  if(!confirm("⚠️ SUPPRIMER TOUT le "+k.split("-").reverse().join("/")+" ?\n\n"+list.length+" élément(s) : "+det+"\n\nAction DÉFINITIVE (Firebase). Confirmer ?")) return;
  let err=0;
  for(const x of list){

      if(x.kind==="doc"){ await dbByStore[x.a].ref("documents/"+x.b).remove(); }

function renderSuivi(){

  const WINDOW=7*86400*1000, now=Date.now();
  const items=[]; let totalDraft=0;
  if(suiviType==='tous'||suiviType==='reception') readyStores().forEach(s=>{
    const st=state[s.code]; if(!st) return;
    const docs=st.docs||{}, recs=st.receptions||{};
    const recsByDoc={};
    Object.entries(recs).forEach(([id,r])=>{ if(r.docId){ (recsByDoc[r.docId]=recsByDoc[r.docId]||[]).push({id,...r}); } });
    // Documents chargés (envoyés) et leur état de réception
    Object.entries(docs).forEach(([id,d])=>{
      const sendTs=d.createdAt||tsFromFr(d.deliveryDate)||0;
      const rs=recsByDoc[id]||[];
      const hasValid=rs.some(r=>r.status==="validated");
      if(!rs.length){ items.push({type:"reception", store:s, sendTs, kind:"attente", doc:d, docId:id}); return; }
      rs.forEach(r=>{ const draft=r.status!=="validated";
        if(draft){ totalDraft++; items.push({type:"reception", store:s, sendTs, kind:"encours", doc:d, rec:r, dupValidated:hasValid}); }
        /* v1.9.10 : Suivi live = uniquement le LIVE → réceptions validées masquées (voir l'onglet Réception) */
      });
    });
    // Réceptions sans document rattaché (héritage / doc supprimé)
    Object.entries(recs).forEach(([id,r])=>{ if(r.docId&&docs[r.docId]) return;
      const draft=r.status!=="validated"; const sendTs=r.createdAt||r.validatedAt||0;
      if(draft){ totalDraft++; items.push({type:"reception", store:s, sendTs, kind:"encours", rec:{id,...r}, orphan:true}); }

    if(!s||!s.meta) return; const sess={id:sid, meta:s.meta, state:s.state||{}}; const stx=dispatchStats(sess); const sendTs=s.meta.startedAt||0;

/* Lecture du projet CENTRALE (app Dispatch palette). Vue PAR FOURNISSEUR :
   commande passée à la centrale vs ce qui a été réellement dispatché en magasins,
   avec les écarts + motifs (CASSE FOURNISSEUR / DLC / NON RECU / CASSE / AUTRE),

function cKeyOfLine(p,idx){ const a=(p.article||"").toString().trim(); return a?("a_"+a):("l_"+idx); }
function cEffQty(st,p,code){ if(st&&st.qtyStores&&st.qtyStores[code]!=null) return st.qtyStores[code]; return (p.stores&&p.stores[code])||0; }
function cSupKey(sup){ return String(sup||"FRS").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9_]/g,"_"); }
function centraleLines(sess){
  const products=(sess.meta&&sess.meta.products)||[];
  const stt=sess.state||{};
  const cols=(sess.meta&&sess.meta.storeColumns)||[];
  return products.map((p,idx)=>{
    const st=stt[cKeyOfLine(p,idx)]||{};
    const dispatched=cols.reduce((a,c)=>a+cEffQty(st,p,c.code),0);
    const commande=(p.recue!=null)?p.recue:Object.values(p.stores||{}).reduce((a,b)=>a+b,0);
    return { article:p.article||"", designation:p.designation, colisage:p.colisage||0, commande, dispatched, ecart:dispatched-commande, done:!!st.done, ecarts:st.ecarts||[] };
  });
}
function centraleSessions(){
  const out=[];
  Object.entries(centraleState.dispatch||{}).forEach(([sid,s])=>{ if(s&&s.meta&&s.meta.supplier) out.push(Object.assign({id:sid},s)); });
  out.sort((a,b)=>((b.meta.startedAt||0)-(a.meta.startedAt||0)));
  return out;
}
function centraleTxt(sess){
  const lines = centraleLines(sess);
  const out = [];
  lines.forEach(l=>{
    const code = String(l.article||"").trim();
    if(!code) return;                                   // pas de code => ligne ignorée (voir note EAN)
    const qty = (l.dispatched===0) ? 0 : l.commande;    // partiel = total ; 0 partout = 0
    out.push(code + "\t" + String(qty).replace(".",","));
  });
  return out.join("\r\n");
}
function dispatchStats(sess){
  const products=(sess.meta&&sess.meta.products)||[]; const stt=sess.state||{};
  let done=0; const ts=[]; const ops={};
  products.forEach((p,idx)=>{ const st=stt[cKeyOfLine(p,idx)]; if(st&&st.done){ done++; if(st.doneAt) ts.push(st.doneAt); if(st.doneBy) ops[st.doneBy]=(ops[st.doneBy]||0)+1; } });
  ts.sort((a,b)=>a-b);
  return { total:products.length, done, durationMs: ts.length?ts[ts.length-1]-ts[0]:0, operators:Object.keys(ops) };
}
function fmtDurMs(ms){ if(!ms) return "—"; const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60); if(h>0) return h+"h"+String(m%60).padStart(2,"0"); if(m>0) return m+" min"; return s+" s"; }
// Toutes les lignes en écart d'une session (écart quantité et/ou motif déclaré).
function sessionEcarts(sess){
  const lines=centraleLines(sess); const out=[];
  lines.forEach(l=>{
    if(l.ecarts&&l.ecarts.length){ l.ecarts.forEach(e=>out.push({ designation:l.designation, article:l.article, storeLabel:(e.storeLabel||e.store||""), reason:e.reason, reasonText:e.reasonText||"", planned:e.planned, real:e.real, fournisseur:!!e.fournisseur })); }
    else if(l.ecart!==0){ out.push({ designation:l.designation, article:l.article, storeLabel:"", reason:(l.ecart>0?"SURPLUS":"MANQUE"), reasonText:"", planned:l.commande, real:l.dispatched, fournisseur:false }); }
  });
  return out;
}

function markEcartsTraite(sid){ if(!dbCentrale) return; dbCentrale.ref("ecarts_suivi/"+sid).set({done:true,at:firebase.database.ServerValue.TIMESTAMP,by:ME_EMAIL}).catch(e=>alert("Erreur : "+e.message)); }

// Données poussées par l'app « La Centrale » (module Inventaire vin) :
//   inventaire_vin/<id> : { meta:{label,startedAt,dateKey,createdBy,operatorCode,closed}, lines:{<key>:{ean,designation,cartons,bottles,units}}, validated:{at,by} }
// La console liste les inventaires du jour, montre le détail et génère le .txt (EAN / quantité) pour PROGMAG.
let invVinDate = null; // null = aujourd'hui (défaut) ; "" = toutes ; "YYYY-MM-DD" = date précise

function invVinSummary(v){
  const L=Object.values((v&&v.lines)||{}); let u=0,r=0;
  L.forEach(l=>{ const un=(l.units!=null?l.units:((l.cartons||0)*6+(l.bottles||0))); if(un>0)r++; u+=un; });
  return { refs:r, units:u };
}
function invVinListAll(){
  const all=centraleState.inventaireVin||{};

    .sort((a,b)=>((b.meta.startedAt||0)-(a.meta.startedAt||0)));
}
function invVinLines(v){
  return Object.entries((v&&v.lines)||{}).map(([k,l])=>Object.assign({key:k},l))
    // Décodage GS1 : les anciens scans QR contiennent le code complet (01…+lot) → on ré-extrait l'EAN-13.
    .map(l=>Object.assign({},l,{ ean: extractEan(l.ean), code:(l.code||""), units:(l.units!=null?l.units:((l.cartons||0)*6+(l.bottles||0))) }))
    .filter(l=>l.ean||l.code)
    .sort((a,b)=>((a.createdAt||0)-(b.createdAt||0)));
}
// .txt réception PROGMAG : "Code;quantité" (séparateur ; ASCII, fin de ligne CRLF).
// Code = EAN scanné si présent, sinon code article (lignes ciblées). En inventaire ciblé,
// les vins mis explicitement à 0 (counted) sont aussi exportés (code;0).
function invVinTxt(v){
  const out=[];
  invVinLines(v).forEach(l=>{ const c=l.ean||l.code; if(!c) return; if(!(l.units>0||l.counted)) return; out.push(String(c)+";"+String(l.units||0)); });
  return out.join("\r\n");
}

const KBG_CHEESE_REF_IDS=new Set(["682f4a02e4861a0012d0c927","682f49de10e2040012239e9b","682f495f10e2040012239e51","682f49d110e2040012239e91"]);
const KBG_CHEESE_EXCL=/halloumi|a griller/;
function kbgOid(x){ return (x&&typeof x==="object")?String(x.$oid||""):String(x||""); }
function kbgParseProducerProducts(data){
  const arr=Array.isArray(data)?data:(data&&(data.producerproducts||data.products))||[];
  const items={}; let fromages=0;
  arr.forEach(p=>{
    if(!p||!KBG_CHEESE_REF_IDS.has(kbgOid(p.reference_id))) return; fromages++;
    if(p.active===false||p.archived) return;
    const name=String(p.product_name||p.name||"").trim(); if(!name||KBG_CHEESE_EXCL.test(norm(name))) return;
    const locs=Array.isArray(p.locales)?p.locales:[]; if(locs.length&&locs.indexOf("KBG")<0) return;
    const g=Math.round((Number(p.unit_weight)||0)*1000); if(!(g>0)) return;
    const k=_kbgKey(name); if(!k) return;
    items[k]={ name, g, min:Math.round((Number(p.unit_weight_min)||0)*1000)||g, max:Math.round((Number(p.unit_weight_max)||0)*1000)||g,
      display:String(p.unit_display||""), producer:String(p.producer_name||""), price:Number(p.consumer_price)||0, pid:kbgOid(p._id) };
  });
  return { items, n:Object.keys(items).length, fromages };
}

function decoupeProductKey(p, idx){ const d=norm((p&&p.designation)||"").replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,""); return d?("d_"+d):("l_"+idx); }

    let k=0,kg=0,rr=0,rg=0,rm=0,theo=0,rend=null;

    if(st.sticker){ const n=st.stickerCount||0; const g=(st.stickerWeight!=null&&st.stickerWeight!=="")?Number(st.stickerWeight):(w*n); if((st.magasin||"KBG")==="KBG"){k+=n;kg+=g;}else{rr+=n;rg+=g;} }

      if(recuKg>0&&w>0){ theo=Math.round(Math.max(0,Math.round((recuKg-kgM)*100)/100)/(w/1000)); rend=theo>0?Math.round(np/theo*100):null; } }

      lines.push({ designation:p.designation, kbgN:k, kbgTheo:theo, rend, kbgTarget:p.kbgTarget||0, robN:rr, kbgG:Math.round(kg), robG:Math.round(rg), robMeules:rm, robUnit:(st.rob&&st.rob.unit)||"meule", poidsRecu:recuKg, cutAt, cutDay:decDayOfC(cutAt)||sessDay,

// Stats live d'une découpe (clé par désignation, comme la tablette) — remplace dispatchStats qui lisait la mauvaise clé (toujours 0/x).
function decoupeStatsC(sess){
  const products=(sess.meta&&sess.meta.products)||[]; const stt=sess.state||{};
  let done=0,saisis=0,lastCutAt=0; const ops={};
  Object.values(stt).forEach(st=>{ if(!st||typeof st!=="object") return; if(st.at&&st.at>lastCutAt) lastCutAt=st.at;

    if(st.doneBy) ops[st.doneBy]=1; });
  products.forEach((p,idx)=>{ const st=stt[decoupeProductKey(p,idx)]; if(st&&st.done) done++; });

function _lotNorm(x){ return String(x==null?"":x).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").replace(/\b(aop|aoc|bio|fermier|igp|de|du|des|la|le|les|d|l)\b/g," ").replace(/\s+/g," ").trim(); }

  const wx=x.split(" ").filter(w=>w.length>2), wy=y.split(" ").filter(w=>w.length>2); if(!wx.length||!wy.length) return false;
  const common=wx.filter(w=>wy.includes(w)).length; return common>=Math.min(2,Math.min(wx.length,wy.length)); }
function lotsForCheese(designation, opts){

// Clé de jour ISO (yyyy-mm-dd) à partir d'un timestamp, et pour une session de découpe.
function isoDayKey(ts){ const d=new Date(ts||0); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function dayDecoupeAggC(sessions, dayKey){

    (a.lines||[]).filter(l=>!dayKey||(l.cutDay||decoupeDayKeyC(s))===dayKey).forEach(l=>{ const key=norm(l.designation||"")||"?";
      const isRob = routeRob!=null ? routeRob : (((l.kbgN||0)===0) && (((l.robN||0)>0) || ((l.robMeules||0)>0)));
      if(isRob){ const m=robMap[key]||(robMap[key]={designation:l.designation||"",robMeules:0,robN:0,robG:0,robUnit:l.robUnit||"meule"});
        m.robMeules+=(l.robMeules||0); m.robN+=(l.robN||0); m.robG+=(l.robG||0); robMeules+=(l.robMeules||0); robN+=(l.robN||0); robG+=(l.robG||0); }
      else { const m=kbgMap[key]||(kbgMap[key]={designation:l.designation||"",kbgN:0,kbgG:0,theo:0,montG:0});
        const th=(l.kbgTheo!=null?l.kbgTheo:(l.theo||0));
        m.kbgN+=(l.kbgN||0); m.kbgG+=(l.kbgG||0); m.theo+=th; m.montG+=(l.robG||0);

  const robLines=Object.values(robMap).sort((a,b)=>a.designation.localeCompare(b.designation,"fr"));

}

// Rattache une découpe libre (commencée sans BL) à un BL : saisies, fromages et étiquettes traça déplacés vers la découpe du BL.
async function blfMerge(fromSid, toSid){
  const src=(centraleState.decoupe||{})[fromSid], dst=(centraleState.decoupe||{})[toSid]; if(!src||!dst) return;
  const b=blfList().find(x=>x.sid===toSid);
  if(!confirm("Rattacher la découpe libre (n° "+((src.meta&&src.meta.docNumber)||"—")+", "+dateShort(src.meta&&src.meta.startedAt)+") au BL "+(b&&b.num)+" ?\n\nSes saisies et étiquettes sont déplacées sur ce BL. En cas de fromage saisi des deux côtés, la saisie du BL est gardée.")) return;
  const up={}; const dstState=dst.state||{};
  Object.entries(src.state||{}).forEach(([k,v])=>{ if(!dstState[k]) up["decoupe/"+toSid+"/state/"+k]=v; });
  const prods=[...((dst.meta&&dst.meta.products)||[])]; ((src.meta&&src.meta.products)||[]).forEach(p=>{ if(p&&p.designation&&!prods.some(x=>blfKey(x.designation)===blfKey(p.designation))) prods.push(p); });
  up["decoupe/"+toSid+"/meta/products"]=prods;
  Object.entries(src.tracabilite||{}).forEach(([k,v])=>{ up["decoupe/"+toSid+"/tracabilite/"+k]=v; });
  Object.entries(src.bl||{}).forEach(([k,v])=>{ up["decoupe/"+toSid+"/bl/"+k]=v; });
  if(src.meta&&src.meta.startedAt&&(!dst.meta.startedAt||src.meta.startedAt<dst.meta.startedAt)) up["decoupe/"+toSid+"/meta/startedAt"]=src.meta.startedAt;
  up["decoupe/"+fromSid]=null;
  try{ await dbCentrale.ref().update(up); blLog(toSid,"rattachement",{ bl:b&&b.num, detail:"découpe "+fromSid+" ("+Object.keys(src.state||{}).length+" saisie(s))" }); toastC("🔗 Découpe rattachée au BL "+(b&&b.num)); openBlf(toSid); }catch(e){ alert("Erreur : "+e.message); }
}

  const olderNote = (!dpDecoupeDate && olderCount>0) ? `<div class="muted" style="margin:6px 0 12px;font-size:12px">➕ ${olderCount} jour(s) de mois précédents masqués — utilise le filtre <b>Date</b> ci-dessus pour les afficher.</div>` : '';
  el.innerHTML=bar+`<p class="muted" style="margin-top:0">Historique découpe, <b>par journée</b> (aujourd'hui ouvert, les autres jours à déplier). Par défaut le <b>mois en cours</b> ; les mois précédents via le filtre Date.</p>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">

    </div>${olderNote}

function openDecoupeDetail(sid){
  const s=(centraleState.decoupe||{})[sid]; if(!s) return; const sess=Object.assign({id:sid},s); const a=decoupeAgg(sess); const isRob=a.entity==="ROB";
  const kg=a.robG>0?(Math.round(a.robG/1000*10)/10):0;
  const head=isRob
    ? `<tr><th>Fromage</th><th>Découpé</th><th>Morceaux</th><th>Poids approx.</th><th>Découpé le</th><th>Lot(s) rattaché(s)</th></tr>`
    : `<tr><th>Fromage</th><th>KBG pc</th><th>KBG poids</th><th>→ ROB pc</th><th>ROB poids</th><th>Découpé le</th><th>Lot(s) rattaché(s)</th></tr>`;

    return isRob
      ? `<tr><td>${esc(l.designation||'')}</td><td style="text-align:center">${l.robMeules||0} ${l.robUnit==='colis'?'colis':'meule(s)'}</td><td style="text-align:center">${l.robN||0}</td><td style="text-align:center">${lkg}</td><td style="text-align:center">${esc(dayFrC(l.cutDay))}${l.cutAt?('<div style="font-size:11px;color:#999">'+esc(heure(l.cutAt))+'</div>'):''}</td><td>${lots}</td></tr>`
      : `<tr><td>${esc(l.designation||'')}</td><td style="text-align:center">${l.kbgN||0}${l.kbgTarget>0?(' / '+l.kbgTarget):''}</td><td style="text-align:center">${Math.round(l.kbgG||0)} g</td><td style="text-align:center">${l.robN||0}</td><td style="text-align:center">${Math.round(l.robG||0)} g</td><td style="text-align:center">${esc(dayFrC(l.cutDay))}${l.cutAt?('<div style="font-size:11px;color:#999">'+esc(heure(l.cutAt))+'</div>'):''}</td><td>${lots}</td></tr>`;
  }).join("");
  const colspan=isRob?6:7;
  const summary=isRob
    ? `${a.robMeules} meule(s)/colis · ${a.robN} morceaux${kg>0?(' · ≈ '+kg+' kg'):''}`
    : `Rendement <b>${a.rend}%</b> · KBG ${a.kbgN} pc / ROB ${a.robN} pc`;
  const back=document.createElement("div"); back.className="modal-back";
  back.innerHTML=`<div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0;font-size:17px">Découpe ${isRob?'Montreuil':'Kelbongoo'} · ${esc(sess.meta.supplier||'')}</h2><button class="btn" style="background:#eef2f7" onclick="this.closest('.modal-back').remove()">Fermer</button></div>
    <div class="muted" style="margin:4px 0 10px">Créée le ${esc(dateShort(sess.meta.startedAt))} · ${esc(a.by||sess.meta.createdBy||'—')} · ${summary}</div>${decoupeInfoLine(sess)}
    <div style="display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap"><b style="font-size:13px">Trier par date de découpe :</b>
      <button class="btn" style="padding:6px 10px;font-size:12px;background:${decDetailSort==='desc'?'#8a5a00':'#eef2f7'};color:${decDetailSort==='desc'?'#fff':'#333'}" onclick="setDecDetailSort('${esc(sid)}','desc')">↓ plus récent d'abord</button>
      <button class="btn" style="padding:6px 10px;font-size:12px;background:${decDetailSort==='asc'?'#8a5a00':'#eef2f7'};color:${decDetailSort==='asc'?'#fff':'#333'}" onclick="setDecDetailSort('${esc(sid)}','asc')">↑ plus ancien d'abord</button></div>
    <div style="overflow:auto;max-height:60vh"><table><thead>${head}</thead><tbody>${rows||('<tr><td colspan="'+colspan+'" style="color:#999">Aucune découpe saisie.</td></tr>')}</tbody></table></div>
    <button class="btn btn-green btn-lg" style="margin-top:14px" onclick="dlDecoupeTxt('${esc(sid)}')">⬇️ Télécharger le .txt</button>
  </div>`;
  back.onclick=(e)=>{ if(e.target===back) back.remove(); };
  document.body.appendChild(back);
}
function dlDecoupeTxt(sid){
  const s=(centraleState.decoupe||{})[sid]; if(!s) return; const sess=Object.assign({id:sid},s); const a=decoupeAgg(sess); const isRob=a.entity==="ROB";
  const kg=a.robG>0?(Math.round(a.robG/1000*10)/10):0;
  let txt="LA CENTRALE PDP — Découpe fromage "+(isRob?"MONTREUIL (Robespierre)":"KELBONGOO")+"\n";
  txt+=(sess.meta.supplier||"")+"\n"+dateShort(sess.meta.startedAt)+" "+heure(sess.meta.startedAt)+"\n";
  if(sess.meta.docNumber) txt+="BL : "+sess.meta.docNumber+"\n";
  txt+="Opérateur : "+(a.by||sess.meta.createdBy||"-")+"\n";
  if(isRob){
    txt+="Total : "+a.robMeules+" meule(s)/colis · "+a.robN+" morceaux"+(kg>0?(" · ≈ "+kg+" kg"):"")+"\n";
    txt+="\nFromage\tMeules/colis\tMorceaux\tPoids approx (kg)\n";
    (a.lines||[]).forEach(l=>{ const lkg=(l.robG||0)>0?(Math.round((l.robG||0)/1000*10)/10):""; txt+=(l.designation||"")+"\t"+(l.robMeules||0)+" "+((l.robUnit==="colis")?"colis":"meule")+"\t"+(l.robN||0)+"\t"+lkg+"\n"; });
  } else {
    txt+="Rendement Kelbongoo : "+a.rend+"%\n";
    txt+="Total KBG : "+a.kbgN+" pc / "+a.kbgG+" g   -   Hors gabarit → ROB : "+a.robN+" pc / "+a.robG+" g\n";
    txt+="\nFromage\tKBG pc\tKBG g\tROB pc\tROB g\tDécoupé le\tLot(s)\n";
    (a.lines||[]).slice().sort((x,y)=>(x.cutAt||0)-(y.cutAt||0)).forEach(l=>{ const lots=lotsForCheese(l.designation,{bl:sess.meta.docNumber,entity:a.entity,day:l.cutDay}).map(e=>e.lot||"?").join(" / "); txt+=(l.designation||"")+"\t"+(l.kbgN||0)+"\t"+Math.round(l.kbgG||0)+"\t"+(l.robN||0)+"\t"+Math.round(l.robG||0)+"\t"+dayFrC(l.cutDay)+"\t"+lots+"\n"; });
  }
  const d=new Date(sess.meta.startedAt||Date.now());
  const yy=String(d.getFullYear()).slice(-2),mm=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");
  downloadTxt(yy+mm+dd+"_DECOUPE_"+(a.entity||sess.meta.entity||"")+".txt", txt);
}

<script>
/* =============================================================================

const ENLEVEMENT_URL = "https://script.google.com/macros/s/AKfycbypY1ue7nBesHFhObOan7KOZjGMB3nX5u9N7K-nNSMC2yKAWYfUc1dWRhpgtMmrRz4X/exec";
const KBG_FIREBASE_CONFIG = { apiKey:"AIzaSyDiOCgkDItazkaUfNC1kTjF9Z7K9rSqqow", authDomain:"distribkbg.firebaseapp.com", projectId:"distribkbg",
  storageBucket:"distribkbg.firebasestorage.app", messagingSenderId:"255791649801", appId:"1:255791649801:web:bcf2d080e524000f3194d8" };

const APP_URLS = { centrale:"https://pribon.github.io/centrale/", reception:"https://pribon.github.io/Bichat/" };

const SITE_COL = { ROB:"#E11D48", BIC:"#FF1F8E", TOL:"#0A84FF", PDP:"#7C3AED", BOR:"#FF6D00", STB:"#00B060", PDC:"#00A8B5", NCC:"#D946EF", LIL:"#9333EA", CES:"#16A34A", BAR:"#F43F5E", CHA:"#2563EB", NCA:"#0D9488", ROM:"#EA580C", FOR:"#B45309", PAD:"#DB2777", BEL:"#455a64" };
const SITE_NAME = { ROB:"Robespierre", BIC:"Bichat", TOL:"Tolbiac", PDP:"Porte de Pantin", BOR:"Borrego", STB:"Saint-Blaise", BEL:"Belleville", ENTREPOT:"Entrepôt" };
const STORE_SHORT = { ROBESPIERRE:"ROB", TOLBIAC:"TOL", BICHAT:"BIC", BELLEVILLE:"BEL" };
const ZONE_UI = { froid:{ t:"❄ Ch. froide", c:"pcold" }, sec:{ t:"▣ Entrepôt sec", c:"pdry" } };
const MOTIF_UI = { introuvable:"Palette introuvable", place:"Pas de place dans le camion", pas_prete:"Palette pas prête", autre:"Autre" };
const DAY = 86400000;

function isoDay(ts){ const d=new Date(ts||Date.now()); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function isToday(ts){ return !!ts && isoDay(ts)===isoDay(); }
function ago(ts){ if(!ts) return ""; const s=Math.max(0,Math.round((Date.now()-ts)/1000)); if(s<60) return "il y a "+s+" s"; const m=Math.round(s/60); if(m<60) return "il y a "+m+" min"; const h=Math.round(m/60); if(h<24) return "il y a "+h+" h"; return "il y a "+Math.round(h/24)+" j"; }
function hm(ts){ return ts?new Date(ts).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):""; }
function shortName(n){ const p=String(n||"").trim().split(/\s+/); return p.length>1 ? p[0]+" "+p[p.length-1].charAt(0).toUpperCase()+"." : (p[0]||"—"); }
function initials(n){ const p=String(n||"").trim().split(/\s+/); return ((p[0]||"?").charAt(0)+(p.length>1?p[p.length-1].charAt(0):"")).toUpperCase(); }
function storeChip(code){ const c=STORE_SHORT[code]||code||"?"; return `<span class="store"><i style="background:${SITE_COL[c]||"#777"}"></i>${esc(c)}</span>`; }
function zonePill(z){ const Z=ZONE_UI[z]; return Z?`<span class="pill ${Z.c}">${Z.t}</span>`:`<span class="pill pr">📍 non indiqué</span>`; }
function typeTag(t){ return t==="PICKING"?`<span class="tag" style="background:#e3edfa;color:var(--pick)">Picking</span>`:t==="DOLLY"?`<span class="tag" style="background:#fff1e6;color:var(--warn)">Dolly</span>`:`<span class="tag" style="background:#e5efe7;color:var(--disp)">Dispatch</span>`; }
function focusInside(id){ const el=document.getElementById(id), a=document.activeElement; return !!(el && a && el.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)); }
function arr(o){ return Array.isArray(o)?o:(o&&typeof o==="object"?Object.values(o):[]); }

/* ----------------------------------------------------------------- données */
function g5Todo(){ const out=[]; STORES.forEach(s=>{ if(!state[s.code]) return; recsOf(s.code, r=>r.status==="validated" && !r.g5Validated).forEach(r=>out.push(Object.assign({store:s.code},r))); }); return out; }
function recsInProgress(){ const out=[]; STORES.forEach(s=>{ const st=state[s.code]; if(!st) return; Object.entries(st.receptions||{}).forEach(([id,r])=>{ if(r && r.status!=="validated" && (Date.now()-(r.createdAt||r.updatedAt||0))<DAY) out.push(Object.assign({id,store:s.code},r)); }); }); return out; }
function avoirsTodo(){ const out=[]; STORES.forEach(s=>{ const st=state[s.code]; if(!st) return; Object.entries(st.receptions||{}).forEach(([id,r])=>{ if(recAvoirLines(r).length && recAvoirStatus(r)!=="termine") out.push(Object.assign({id,store:s.code},r)); }); }); return out; }
const isArchived=(x)=>!!(x && (x.archived || (x.meta && x.meta.archived)));
function dispatchToday(){ return centraleSessions().filter(s=>!isArchived(s) && isToday(s.meta.startedAt)).map(s=>Object.assign({st:dispatchStats(s)},s)); }
function pickingList(){ return Object.entries(centraleState.picking||{}).filter(([,p])=>p&&p.meta&&!isArchived(p)).map(([sid,p])=>Object.assign({id:sid,st:pickingStatsC(p)},p)); }
function enlList(){ return Object.entries(centraleState.enlevements||{}).map(([id,e])=>Object.assign({id},e)).filter(e=>e&&e.at).sort((a,b)=>(b.at||0)-(a.at||0)); }
function enlItems(e){ return arr(e.items); }
function enlPhoto(e, it){ const p=(e.photos||{})[String(it.key||"").replace(/[.#$\[\]\/]/g,"_")]; return p&&p.id?p:null; }
function enlPending(){ return enlList().filter(e=>e.status==="attente-23h59"); }
function enlSent(){ return enlList().filter(e=>e.status==="envoye"); }
function enlValidated(days){ return enlList().filter(e=>e.status==="valide" && (Date.now()-(e.validatedAt||e.at))<(days||10)*DAY); }
function refusedOpen(){
  const out=[];
  enlValidated(14).forEach(e=>{ Object.entries(e.refused||{}).forEach(([k,r])=>{ if(!r || r.relancedAt || r.closedAt) return;
    const it=enlItems(e).find(x=>String(x.key||"").replace(/[.#$\[\]\/]/g,"_")===k) || { key:k, code:r.code, type:"DISPATCH", n:1 };
    out.push({ e, k, r, it }); }); });
  return out.sort((a,b)=>(b.r.at||0)-(a.r.at||0));
}
function palCount(items){ return items.reduce((a,x)=>a+(x.kbg?0:(Number(x.n)||0)),0); }
function dolCount(e){ return enlItems(e).reduce((a,x)=>a+(Number(x.dollies)||0),0) + arr(e.lieux).reduce((a,L)=>a+(Number(L.dolly)||0),0); }
function ecartsOpen(){ return centraleSessions().filter(s=>!isArchived(s) && sessionEcarts(s).length && !ecartsTraite(s.id)); }
function noteToday(){ return (centraleState.rungisNotes||{})[isoDay()]||{}; }

/* Ménage : ce qui reste visible sur la tablette alors que c'est traité / abandonné */
function menageCandidates(){
  const out=[], now=Date.now();
  centraleSessions().forEach(s=>{ if(isArchived(s)) return; const st=dispatchStats(s); const age=now-(s.meta.startedAt||0);
    if(st.done<st.total && age>DAY) out.push({ kind:"dispatch", id:s.id, label:(s.meta.supplier||"?"), code:"", at:s.meta.startedAt, why: st.done? `Jamais terminé (${st.done}/${st.total} lignes)` : "Jamais commencé (0 ligne)", state:"ouvert" }); });
  pickingList().forEach(p=>{ const age=now-(p.meta.startedAt||0), m=p.meta;
    if(p.enlevement) return;
    if(!p.closed && age>2*DAY) out.push({ kind:"picking", id:p.id, label:"n° "+(m.orderNum||"—"), code:m.storeCode, at:m.startedAt, why: p.st.done?`Jamais clôturé (${p.st.done}/${p.st.total})`:"Jamais commencé", state:"ouvert" });
    else if(p.closed && age>2*DAY && age<14*DAY) out.push({ kind:"picking", id:p.id, label:"n° "+(m.orderNum||"—"), code:m.storeCode, at:(p.closed.at||m.startedAt), why:"Clôturé, jamais demandé à Rungis (déjà parti ?)", state:p.closed.partial?"clôture partielle":"clôturé" }); });
  return out.sort((a,b)=>(a.at||0)-(b.at||0));
}
function archivedList(){
  const out=[];
  Object.entries(centraleState.dispatch||{}).forEach(([id,s])=>{ if(s&&s.archived) out.push({ kind:"dispatch", id, label:(s.meta&&s.meta.supplier)||"?", at:s.archived.at, by:s.archived.by }); });
  Object.entries(centraleState.picking||{}).forEach(([id,p])=>{ if(p&&p.archived) out.push({ kind:"picking", id, label:"n° "+((p.meta&&p.meta.orderNum)||"—"), code:p.meta&&p.meta.storeCode, at:p.archived.at, by:p.archived.by }); });
  return out.filter(x=>(Date.now()-(x.at||0))<30*DAY).sort((a,b)=>(b.at||0)-(a.at||0));
}

/* ------------------------------------------------- compteurs du menu + rafraîchissement */

/* ===================================================================== PALETTES EPAL (v2.4.0)
   Firebase Centrale : epal/mvts/<id> = { type:"envoi"|"retour"|"ajust", code, n, day, at, by, src, bl, tour, note, cancelled }
   envoi = écrit par l'Apps Script enlèvement à la validation Rungis (palettes EPAL récupérées, par magasin)
   retour = chauffeur Rungis (appli Kelbongoo) · ajust = correction console (+ doit plus / − doit moins).
   Solde dû = envois + ajust(+) − retours − ajust(−) ; « depuis le » = plus ancienne palette non rendue. */
const EPAL_STORES=["ROB","TOL","BIC"], EPAL_START="2026-10-22";
const EPAL_TYPE={ envoi:["Envoi (BL)","pb"], retour:["Retour chauffeur","pg"], ajust:["Ajustement","po"] };
function epalBalance(code){
  const mv=centraleState.epal||{}; const deb=[]; let cred=0, sent=0, back=0, adj=0, last=null;
  Object.keys(mv).forEach(k=>{ const m=mv[k]; if(!m||m.cancelled||String(m.code||"").toUpperCase()!==code||String(m.day||"")<EPAL_START) return;
    const n=Math.round(Number(m.n)||0); if(!n) return;
    if(m.type==="envoi"){ sent+=n; deb.push({day:m.day,at:m.at||0,n}); }
    else if(m.type==="retour"){ back+=n; cred+=n; if(!last||(m.at||0)>last.at) last={at:m.at||0,day:m.day,n,by:m.by}; }
    else if(m.type==="ajust"){ adj+=n; if(n>0) deb.push({day:m.day,at:m.at||0,n}); else cred+=-n; } });
  deb.sort((a,b)=>a.day<b.day?-1:a.day>b.day?1:a.at-b.at);
  let rest=cred, since=""; for(const d of deb){ if(rest>=d.n){ rest-=d.n; continue; } since=d.day; break; }
  const due=sent+adj-back; return { sent, back, adj, due, since:due>0?since:"", last };
}
function epalDueTotal(){ return EPAL_STORES.reduce((a,c)=>a+Math.max(0,epalBalance(c).due),0); }
function epalItemCount(it){ if(!it||it.kbg||Number(it.dollies)>0) return 0; const n=Number(it.n)||0; if(!n) return 0;
  if(it.epalN!=null&&it.epalN!=="") return Math.max(0,Math.min(Number(it.epalN)||0,n)); return it.epal===false?0:n; }
function epalTag(it){ const n=Number(it.n)||0; if(!n||it.kbg||Number(it.dollies)>0) return ""; const e=epalItemCount(it);
  return e===n?` · 🟫 ${e} EPAL`:` · <b style="color:var(--dan)">⚠️ ${n-e} autre format</b>${e?` + ${e} EPAL`:""}`; }
function frIso(iso){ const p=String(iso||"").split("-"); return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:String(iso||""); }
let epalFilter="";
function epalHTML(){
  const mv=centraleState.epal||{};
  const cards=EPAL_STORES.map(c=>{ const b=epalBalance(c), due=Math.max(0,b.due), col=SITE_COL[c]||"#777";
    return `<div class="cx" style="padding:16px 18px;border-left:6px solid ${col};cursor:pointer;${epalFilter===c?"box-shadow:0 0 0 2px "+col:""}" onclick="epalFilter=epalFilter==='${c}'?'':'${c}';renderRungis()">
      <div style="display:flex;align-items:center;gap:8px">${storeChip(c)}<span class="t2">${esc(STORE_LONG_C[c]||c)}</span></div>
      <div style="font-size:38px;font-weight:800;line-height:1.1;margin-top:8px;color:${due?"var(--dan)":"#2e7d32"}">${due}</div><div style="font-size:13px;font-weight:650;color:var(--ink2)">palette${due>1?"s":""} EPAL à rendre</div>
      <div class="t2" style="margin-top:2px">${due?(b.since?`depuis le <b>${frIso(b.since)}</b>`:""):"rien à rendre 👌"}${b.due<0?` · ${-b.due} rendue(s) en avance`:""}</div>
      <div class="t2" style="margin-top:8px">Envoyées <b>${b.sent}</b> · rendues <b>${b.back}</b>${b.adj?` · ajust. <b>${b.adj>0?"+":""}${b.adj}</b>`:""}</div>
      <div class="t2">Dernier retour : ${b.last?`<b>${b.last.n}</b> le ${frIso(b.last.day)}${b.last.by?" · "+esc(b.last.by):""}`:"—"}</div></div>`; }).join("");
  const rows=Object.keys(mv).map(id=>({id,...mv[id]})).filter(m=>m&&m.code&&(!epalFilter||m.code===epalFilter)).sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,150);
  const tbl=rows.length?`<table class="tb"><tr><th>Date</th><th>Magasin</th><th>Mouvement</th><th style="text-align:right">Palettes</th><th>Par · détail</th><th></th></tr>${rows.map(m=>{ const T=EPAL_TYPE[m.type]||[m.type,"po"]; const n=Math.round(Number(m.n)||0); const sign=m.type==="retour"?-n:n;
    return `<tr ${m.cancelled?'style="opacity:.45;text-decoration:line-through"':""}><td>${frIso(m.day)}<div class="t2">${m.at?new Date(m.at).toLocaleDateString("fr-FR")+" "+hm(m.at):""}</div></td><td>${storeChip(m.code)}</td><td><span class="pill ${T[1]}">${T[0]}</span></td>
      <td style="text-align:right;font-weight:800;color:${sign>0?"var(--dan)":"#2e7d32"}">${sign>0?"+":""}${sign}</td><td><div class="t1" style="font-size:12.5px">${esc(m.by||"")}</div><div class="t2">${m.bl?esc(m.bl):""}${m.note?` « ${esc(m.note)} »`:""}${m.cancelled?` · annulé par ${esc(m.cancelled.by||"")}`:""}</div></td>
      <td style="text-align:right">${m.cancelled?`<button class="tbtn s" onclick="epalCancel('${esc(m.id)}',false)">Rétablir</button>`:`<button class="tbtn s" onclick="epalCancel('${esc(m.id)}',true)">Annuler</button>`}</td></tr>`; }).join("")}</table>`
    :`<div class="empty">Aucun mouvement${epalFilter?" pour "+epalFilter:""}. Les envois s'ajoutent à la validation Rungis, les retours quand le chauffeur valide « Retour palettes EPAL ».</div>`;
  return `<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px">${cards}</div>
    <div class="cx" style="overflow:hidden;margin-bottom:16px"><div class="cx-h"><h3>✍️ Saisie manuelle</h3><span class="sp"></span><span class="sub">retour oublié, inventaire, correction</span></div>
      <div style="padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <select id="epalCode">${EPAL_STORES.map(c=>`<option value="${c}">${c} · ${esc(STORE_LONG_C[c]||c)}</option>`).join("")}</select>
        <select id="epalType"><option value="retour">↩️ Retour récupéré (le magasin doit MOINS)</option><option value="plus">➕ Ajustement : le magasin doit PLUS</option><option value="moins">➖ Ajustement : le magasin doit MOINS</option></select>
        <input id="epalN" type="number" min="1" step="1" value="1" style="width:90px">
        <input id="epalDay" type="date" value="${isoDay()}">
        <input id="epalNote" placeholder="Note (facultatif)" style="flex:1;min-width:160px">
        <button class="tbtn s p" onclick="epalAddManual()">Enregistrer</button></div></div>
    <div class="cx" style="overflow:hidden"><div class="cx-h"><h3>Journal des palettes EPAL</h3><span class="sp"></span>${epalFilter?`<button class="tbtn s" onclick="epalFilter='';renderRungis()">Tous les magasins</button>`:`<span class="sub">clique sur un magasin pour filtrer</span>`}</div>${tbl}</div>`;
}
const STORE_LONG_C={ ROB:"Robespierre (Montreuil)", TOL:"Tolbiac", BIC:"Bichat" };
async function epalAddManual(){
  if(!dbCentrale) return; const g=id=>(document.getElementById(id)||{}).value||"";
  const code=g("epalCode"), kind=g("epalType"), n=Math.round(Number(g("epalN"))||0), day=g("epalDay")||isoDay(), note=g("epalNote").trim().slice(0,300);
  if(!EPAL_STORES.includes(code)||n<1){ alert("Indique un magasin et un nombre de palettes (≥ 1)."); return; }
  const type=kind==="retour"?"retour":"ajust", val=kind==="moins"?-n:n;
  const lbl=kind==="retour"?`${n} palette(s) EPAL rendue(s) par ${code}`:`${code} doit ${kind==="plus"?"+":"−"}${n} palette(s) EPAL`;
  if(!confirm(`Enregistrer : ${lbl} (le ${frIso(day)}) ?`)) return;
  try{ await dbCentrale.ref("epal/mvts").push({ type, code, n:val, day, at:Date.now(), by:RESP_NAMES[String(ME_EMAIL||"").toLowerCase()]||ME_EMAIL||"Console", src:"console", note:note||null }); toastC("🟫 Enregistré"); renderRungis(); }catch(e){ alert("Erreur : "+e.message); }
}

/* Relance : nouvelle demande (status attente-23h59, relance:true) avec les palettes refusées, puis envoi immédiat proposé. */
async function relancerRungis(refsKeys){
  if(!dbCentrale||!refsKeys||!refsKeys.length) return;
  const all=refusedOpen(); const chosen=all.filter(x=>refsKeys.indexOf(x.e.id+"|"+x.k)>=0); if(!chosen.length){ alert("Rien à relancer."); return; }
  if(!confirm(`Relancer Rungis pour ${chosen.length} palette(s) ?\n\n`+chosen.map(x=>`• ${x.it.code} — ${x.it.type==="PICKING"?"cde "+(x.it.ref||""):"dispatch"} (${MOTIF_UI[x.r.motif]||x.r.motif})`).join("\n"))) return;
  const id="enl_rel_"+Date.now(); const up={}; const items=[]; const photos={}; const lieux={};
  chosen.forEach(x=>{ const it=Object.assign({}, x.it, { relance:true, prevMotif:x.r.motif||"", note:[x.it.note, x.r.note?("Motif précédent : "+x.r.note):""].filter(Boolean).join(" — ") });
    const ph=enlPhoto(x.e, x.it); if(ph){ photos[x.k]=ph; it.photoId=ph.id; it.photoUrl=ph.url||""; }
    items.push(it); lieux[it.code]=lieux[it.code]||{ code:it.code, dolly:0, pal:0, dollies:0 }; lieux[it.code].pal+=Number(it.n)||0; lieux[it.code].dollies+=Number(it.dollies)||0;
    up[`enlevements/${x.e.id}/refused/${x.k}/relancedAt`]=Date.now(); up[`enlevements/${x.e.id}/refused/${x.k}/relanceId`]=id;
    if(it.sid) up[`picking/${it.sid}/enlevement`]={ id, at:Date.now(), by:"Console · "+ME_EMAIL, byKey:"console" }; });
  up[`enlevements/${id}`]={ at:Date.now(), by:"Console · "+ME_EMAIL, byKey:"console", mode:"R", relance:true, date:isoDay(), status:"attente-23h59", items, photos, lieux:Object.values(lieux),
    totPal:items.reduce((a,x)=>a+(Number(x.n)||0),0), totDol:items.reduce((a,x)=>a+(Number(x.dollies)||0),0) };
  try{ await dbCentrale.ref().update(up); }catch(e){ alert("Erreur : "+e.message); return; }
  if(confirm("Relance enregistrée ✅\n\nEnvoyer le mail à Rungis MAINTENANT ?\n(OK = maintenant · Annuler = avec le mail de 23h59)")) envoyerMailRungis(true);
  else toastC("🔁 Relance ajoutée au mail de 23h59");
}
async function envoyerMailRungis(relance){
  if(!relance && !confirm("Envoyer tout de suite à Rungis le mail des demandes en attente (au lieu de 23h59) ?")) return;
  try{
    const r=await fetch(ENLEVEMENT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"send-now", idToken:ID_TOKEN, relance:!!relance})});
    const j=await r.json();
    if(j&&j.ok) toastC(j.sent?`📨 Mail envoyé à Rungis (${j.sent} demande(s))`:"Rien à envoyer");
    else alert("Envoi refusé : "+((j&&j.error)||"erreur")+(j&&/autoris/.test(j.error||"")?"\n\nReconnecte-toi à la console (la connexion Google dure 1 h).":""));
  }catch(e){ alert("Erreur d'envoi : "+e.message+"\n\nLe script « Enlèvement Rungis » est-il bien en v7 ?"); }
}
function toastC(msg){ let t=document.getElementById("toastC"); if(!t){ t=document.createElement("div"); t.id="toastC"; t.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f1d1a;color:#fff;padding:10px 16px;border-radius:10px;font:600 13px Inter,sans-serif;z-index:500;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:opacity .3s"; document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity="1"; clearTimeout(t._h); t._h=setTimeout(()=>{ t.style.opacity="0"; }, 3200); }

  const url=APP_URLS[appSel]+(appSel==="centrale"&&appApercu?"?apercu=1":"");
  if(force || appBuiltFor!==url){ document.getElementById("appFrame").src=url; appBuiltFor=url; }
  document.getElementById("appCtl").innerHTML=(appSel==="centrale"
      ? `<span class="seg"><button class="${appApercu?"on":""}" onclick="appApercu=true;renderAppView(true)">Aperçu (confirmation)</button><button class="${appApercu?"":"on"}" onclick="appApercu=false;renderAppView(true)">Normal</button></span>`
      : `<span class="t2">⚠️ Actions réelles · admin : bascule de magasin dans l'appli</span>`)
    +` <a class="tbtn s" href="${esc(url)}" target="_blank" rel="noopener">Ouvrir dans un onglet ↗</a>`;
  const cand=menageCandidates(), arch=archivedList(); const nSel=cand.filter(c=>menageSel[c.kind+":"+c.id]).length;
  document.getElementById("appRight").innerHTML=`
    <div class="cx" style="overflow:hidden"><div class="cx-h"><h3>🧹 Ménage — restes encore visibles sur la tablette</h3>${cand.length?`<span class="pill pr">${cand.length}</span>`:""}<span class="sp"></span>${cand.length?`<button class="tbtn s" onclick="menageSelAll()">Tout cocher</button> <button class="tbtn s d" ${nSel?"":"disabled"} onclick="archiveSelected()">Retirer la sélection (${nSel})</button>`:""}</div>
      ${cand.length?`<table class="tb"><tr><th style="width:34px"></th><th>Élément</th><th>Lieu</th><th>Dernière action</th><th>Pourquoi encore là</th><th></th></tr>${cand.map(c=>{ const k=c.kind+":"+c.id; return `<tr><td><input type="checkbox" ${menageSel[k]?"checked":""} onchange="menageSel['${esc(k)}']=this.checked;renderAppView()"></td><td>${typeTag(c.kind==="picking"?"PICKING":"DISPATCH")} <b>${esc(c.label)}</b></td><td>${c.code?storeChip(c.code):'<span class="t2">PDP</span>'}</td><td>${new Date(c.at||0).toLocaleDateString("fr-FR")} · ${esc(c.state)}</td><td class="t2">${esc(c.why)}</td><td style="text-align:right"><button class="tbtn s" onclick="archiveItems([['${c.kind}','${esc(c.id)}']])">Retirer</button></td></tr>`; }).join("")}</table>`:`<div class="empty">Rien à nettoyer, la tablette est propre ✨</div>`}
      <div style="padding:10px 16px;font-size:12px;color:var(--mute);border-top:1px solid var(--line)">Retirer = masquer de la tablette et archiver (récupérable 30 jours ci-dessous). Rien n'est supprimé définitivement.</div></div>
    ${arch.length?`<div class="cx" style="overflow:hidden"><div class="cx-h"><h3>Archivés (30 jours)</h3><span class="sp"></span><span class="sub">${arch.length}</span></div><table class="tb">${arch.slice(0,15).map(a=>`<tr><td>${typeTag(a.kind==="picking"?"PICKING":"DISPATCH")} <b>${esc(a.label)}</b></td><td>${a.code?storeChip(a.code):""}</td><td class="t2">retiré ${new Date(a.at||0).toLocaleDateString("fr-FR")} · ${esc(a.by||"")}</td><td style="text-align:right"><button class="tbtn s" onclick="restoreItem('${a.kind}','${esc(a.id)}')">Restaurer</button></td></tr>`).join("")}</table></div>`:""}
    <div class="cx" style="overflow:hidden"><div class="cx-h"><h3>Versions en ligne</h3><span class="sp"></span><button class="tbtn s" onclick="loadVersions()">Vérifier</button></div>
      <table class="tb"><tr><th>Appli</th><th>En ligne</th><th>Adresse</th></tr>
      ${[["La Centrale PDP","centrale",APP_URLS.centrale],["Réception magasins","reception",APP_URLS.reception],["Console","console",location.origin+location.pathname]].map(([n,k,u])=>`<tr><td><b>${n}</b></td><td>${esc(appVersions[k]||"…")}${k==="console"&&appVersions.console&&appVersions.console!=="?"&&appVersions.console!==APP_VERSION?` <span class="pill po">cette page : ${APP_VERSION}</span>`:""}</td><td class="t2">${esc(u.replace("https://",""))}</td></tr>`).join("")}</table></div>`;
}
function menageSelAll(){ menageCandidates().forEach(c=>{ menageSel[c.kind+":"+c.id]=true; }); renderAppView(); }
function archiveSelected(){ archiveItems(menageCandidates().filter(c=>menageSel[c.kind+":"+c.id]).map(c=>[c.kind,c.id])); }
async function archiveItems(list){
  if(!dbCentrale||!list.length) return;
  if(!confirm(`Retirer ${list.length} élément(s) de la tablette ?\n\nIls sont archivés (récupérables 30 jours), rien n'est supprimé.`)) return;
  const up={}; list.forEach(([k,id])=>{ up[(k==="picking"?"picking/":"dispatch/")+id+"/archived"]={ at:Date.now(), by:ME_EMAIL }; menageSel[k+":"+id]=false; });
  try{ await dbCentrale.ref().update(up); toastC(`🧹 ${list.length} élément(s) retiré(s) de la tablette`); }catch(e){ alert("Erreur : "+e.message); }
}
async function restoreItem(k,id){ try{ await dbCentrale.ref((k==="picking"?"picking/":"dispatch/")+id+"/archived").remove(); toastC("↩️ Restauré sur la tablette"); }catch(e){ alert("Erreur : "+e.message); } }

/* ===================================================================== SUIVI LIVE (Kelbongoo + Pribon) */
let liveView="kbg", kbgApp=null, kbgUser=null, kbgState="idle", kbgErr="", kbgPres={}, kbgUnsub=null, kbFeed=[], __kbPrev={};
const ROLE_UI={ prep:["Prépa","background:#fdf4dd;color:#b88a1a","#b88a1a"], distrib:["Distrib","background:var(--info-s);color:var(--info)","#2c4a8c"], pdp:["Chauffeur PDP","background:#f3ecfd;color:#7C3AED","#7C3AED"], master:["Master","background:#f0e8fa;color:#6e4a9c","#6e4a9c"] };
function renderLive(){
  const head=document.getElementById("suiviHead"), kb=document.getElementById("suiviKbg"), old=document.getElementById("tab-suivi-old"); if(!head) return;
  head.innerHTML=`<div class="page-h"><div><h1>Suivi live</h1><div class="sub">${liveView==="kbg"?"Qui est sur quoi chez Kelbongoo, en ce moment.":"Réceptions magasins, dispatch, picking et découpe PDP en cours."}</div></div><span class="sp"></span>
    <span class="seg"><button class="${liveView==="kbg"?"on":""}" onclick="liveView='kbg';renderLive()">Kelbongoo</button><button class="${liveView==="pribon"?"on":""}" onclick="liveView='pribon';renderLive()">Pribon &amp; PDP</button></span></div>`;
  kb.classList.toggle("hidden", liveView!=="kbg"); old.classList.toggle("hidden", liveView!=="pribon");
  if(liveView==="kbg"){ kbgInit(); renderKbgLive(); } else renderSuivi();
}
function kbgInit(){
  if(kbgApp || typeof firebase==="undefined" || !firebase.auth) { if(!firebase.auth) kbgState="nosdk"; return; }
  try{
    kbgApp=firebase.initializeApp(KBG_FIREBASE_CONFIG, "KBG");
    kbgApp.auth().onAuthStateChanged(async u=>{ kbgUser=u;
      if(!u){ kbgState="out"; renderKbgLive(); return; }
      try{ const t=await u.getIdTokenResult(); if(t.claims.admin!==true){ kbgState="noadmin"; renderKbgLive(); return; } }catch(e){}
      kbgSubscribe(); });
  }catch(e){ kbgState="err"; kbgErr=e.message; }
}
async function kbgConnect(){
  try{ kbgState="connecting"; renderKbgLive();
    const prov=new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({ prompt:"select_account" });
    await kbgApp.auth().signInWithPopup(prov);
    try{ await kbgApp.functions("europe-west1").httpsCallable("kbgClaimAdmin")({}); }catch(e){ console.warn("kbgClaimAdmin", e); }
    const t=await kbgApp.auth().currentUser.getIdTokenResult(true);
    if(t.claims.admin!==true){ kbgState="noadmin"; renderKbgLive(); return; }
    kbgSubscribe();
  }catch(e){ kbgState="err"; kbgErr=(e&&e.message)||String(e); renderKbgLive(); }
}
function kbgSubscribe(){
  if(kbgUnsub) return; kbgState="live";
  kbgUnsub=kbgApp.firestore().collection("kb_presence").onSnapshot(snap=>{
    const o={}; snap.forEach(d=>{ o[d.id]=d.data(); });
    Object.entries(o).forEach(([id,p])=>{ if(id.charAt(0)==="~"||!p||!p.name) return; const prev=__kbPrev[id];
      if(prev && p.task && p.task!==prev.task && (Date.now()-(p.taskAt||p.at||0))<10*60000) kbFeed.unshift({ at:p.taskAt||Date.now(), t:`<b>${esc(shortName(p.name))}</b> ${p.role==="distrib"?"· "+esc(p.site||""):""} → ${esc(p.task)}` });
      else if(prev && p.task===prev.task && Number(p.done)>Number(prev.done) && Number(p.total)>0 && Number(p.done)===Number(p.total)) kbFeed.unshift({ at:Date.now(), t:`<b>${esc(shortName(p.name))}</b> a terminé ${esc(p.task)} (${p.done}/${p.total})` });
      __kbPrev[id]={ task:p.task, done:p.done }; });
    kbFeed=kbFeed.slice(0,40); kbgPres=o;
    if(ACTIVE_TAB==="suivi"&&liveView==="kbg") renderKbgLive();
    if(ACTIVE_TAB==="home") renderHome();
  }, err=>{ kbgState="err"; kbgErr=(err&&err.code==="permission-denied")?"Accès refusé par les règles Firestore (collection kb_presence) — voir le changelog 2.0.":err.message; kbgUnsub=null; renderKbgLive(); });
}
function renderKbgLive(){
  const el=document.getElementById("suiviKbg"); if(!el || el.classList.contains("hidden")) return;
  if(kbgState!=="live"){
    const msg={ idle:"Connexion…", out:"La console doit se connecter à Kelbongoo avec ton compte Google master (une seule fois sur ce PC).", connecting:"Connexion à Kelbongoo…", noadmin:"Ce compte Google n'a pas les droits master Kelbongoo.", nosdk:"Module Kelbongoo indisponible (recharge la page).", err:"Erreur : "+kbgErr }[kbgState]||"";
    el.innerHTML=`<div class="cx" style="padding:28px;text-align:center;max-width:560px;margin:30px auto"><div style="font-size:34px">🥕</div><h3 style="margin:8px 0 6px;font-size:17px">Live Kelbongoo</h3><p class="muted">${esc(msg)}</p>
      ${["out","noadmin","err"].includes(kbgState)?`<button class="tbtn p" onclick="kbgConnect()">Connecter Kelbongoo (Google)</button>`:""}</div>`;
    return;
  }
  const now=Date.now(); const day=isoDay();
  const people=Object.entries(kbgPres).filter(([id,p])=>id.charAt(0)!=="~"&&p&&p.name&&(now-(p.at||0))<14*3600000&&p.role!=="master")
    .map(([id,p])=>Object.assign({id, on:(now-(p.at||0))<180000},p)).sort((a,b)=>(b.on-a.on)||((b.at||0)-(a.at||0)));
  const online=people.filter(p=>p.on), byRole=(r)=>online.filter(p=>p.role===r).length;
  const aggs=Object.entries(kbgPres).filter(([id])=>id.indexOf("~prep_")===0).map(([,v])=>v).sort((a,b)=>String(b.day).localeCompare(String(a.day)));
  const ag=aggs.find(a=>a.day>day) || aggs[0] || null;
  const dist=online.filter(p=>p.role==="distrib"); const dDone=dist.reduce((a,p)=>a+(Number(p.done)||0),0), dTot=dist.reduce((a,p)=>a+(Number(p.total)||0),0);
  const drv=people.filter(p=>p.role==="pdp"&&isToday(p.at)); const rDone=drv.reduce((a,p)=>a+(Number(p.done)||0),0), rTot=drv.reduce((a,p)=>a+(Number(p.total)||0),0);
  const pct=(d,t)=>t?Math.round(d/t*100):0;
  const card=(p)=>{ const R=ROLE_UI[p.role]||["?","background:#eee;color:#555","#888"]; const fresh=p.taskAt&&(now-p.taskAt)<6*60000;
    const task=!p.on?`Hors ligne`:(fresh&&p.task?`<b>${esc(p.task)}</b>${Number(p.total)?` · <b>${p.done||0} / ${p.total}</b> ${esc(p.unit||"")}`:""}`:`<span class="t2">écran : ${esc(p.page||"—")}</span>`);
    const sub=!p.on?`dernière action : ${esc(p.task||p.page||"—")} · ${hm(p.taskAt||p.at)}`:[p.miss?`${p.miss} manquant(s)`:"", (p.with&&p.with.length)?"avec "+p.with.map(shortName).join(", "):""].filter(Boolean).join(" · ");
    const site=p.site&&p.site!=="ENTREPOT"?storeChip(p.site):"";
    return `<div class="pc" style="${p.on?"":"opacity:.55"}"><div class="pav" style="background:${p.on?R[2]:"#8b8680"}">${esc(initials(p.name))}<span class="pdot" style="background:${p.on?"#22a33a":"#b9b4ab"}"></span></div>
      <div style="flex:1;min-width:0"><div style="display:flex;gap:7px;align-items:center"><span class="t1">${esc(shortName(p.name))}</span><span class="tag" style="${R[1]}">${R[0]}</span></div>
      <div style="font-size:13px;margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">${site}<span>${task}</span></div>${sub?`<div class="t2" style="margin-top:2px">${sub}</div>`:""}</div><span class="t2" style="white-space:nowrap">${ago(p.at)}</span></div>`; };
  const sites=ag?Object.entries(ag.sites||{}).sort((a,b)=>a[0].localeCompare(b[0])):[];
  el.innerHTML=`<div class="kpis">
      ${kpi("Équipe en ligne", online.length, `/ ${people.length} aujourd'hui`, `${byRole("prep")} prépa · ${byRole("distrib")} distrib · ${byRole("pdp")} chauffeur`, people.length?`<i style="width:${pct(online.length,people.length)}%;background:#22a33a"></i>`:"", "")}
      ${kpi("Prépa"+(ag&&ag.day?" · "+new Date(ag.day+"T12:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric"}):""), ag?pct(ag.d,ag.t)+" %":"—", ag?`${ag.d} / ${ag.t} produits`:"", ag?(ag.closed?`clôturée${ag.closedBy?" par "+esc(shortName(ag.closedBy)):""}`:`mis à jour ${ago(ag.at)}`):"pas encore de données", ag?`<i style="width:${pct(ag.d,ag.t)}%;background:#b88a1a"></i>`:"", "")}
      ${kpi("Distribution · en cours", dDone, dTot?`/ ${dTot} retraits`:"", dist.length?dist.map(p=>esc(p.site||"?")).join(", ")+" ouvert(s)":"aucun point ouvert", dTot?`<i style="width:${pct(dDone,dTot)}%;background:var(--info)"></i>`:"", "")}
      ${kpi("Ruptures prépa", ag?`<span style="color:var(--dan)">${ag.ruptures||0}</span>`:"—", "produit(s)", ag?`${ag.rupturesTotales||0} totale(s) · ${(ag.ruptures||0)-(ag.rupturesTotales||0)} partielle(s)`:"", "", "")}
      ${kpi("Retours PDP", rDone, rTot?`/ ${rTot} récupérés`:"", drv.length?(drv.some(p=>p.on)?"chauffeur en tournée":"chauffeur hors ligne"):"pas de tournée aujourd'hui", rTot?`<i style="width:${pct(rDone,rTot)}%;background:#7C3AED"></i>`:"", "")}
    </div>
    <div class="grid2">
      <div class="cx" style="overflow:hidden"><div class="cx-h"><span class="ldot"></span><h3>Qui est sur quoi</h3><span class="sp"></span><span class="sub">mis à jour toutes les 60 s</span></div>${people.length?people.map(card).join(""):`<div class="empty">Personne n'est connecté pour l'instant.<br><span class="t2">Les applis doivent être en V9.95 ou plus.</span></div>`}</div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="cx"><div class="cx-h"><h3>Avancement prépa par lieu</h3></div><div style="padding:6px 0">${sites.length?sites.map(([c,v])=>`<div class="srow"><span class="store" style="width:150px"><i style="background:${SITE_COL[c]||"#777"}"></i>${esc(c)} <span class="t2" style="font-weight:500">${esc(SITE_NAME[c]||"")}</span></span><div class="sbar"><i style="width:${pct(v.done,v.total)}%;background:${SITE_COL[c]||"#777"}"></i></div><b style="width:44px;text-align:right;font-size:13px">${pct(v.done,v.total)} %</b></div>`).join(""):`<div class="empty">Pas de prépa en cours.</div>`}</div></div>
        <div class="cx feed" style="overflow:hidden"><div class="cx-h"><h3>Fil Kelbongoo</h3><span class="sp"></span><span class="sub">depuis l'ouverture de la console</span></div>${kbFeed.length?kbFeed.slice(0,12).map(f=>`<div class="row"><time>${hm(f.at)}</time><div class="t1" style="flex:1">${f.t}</div></div>`).join(""):`<div class="empty">Les changements de tâche apparaîtront ici.</div>`}</div>
      </div>
    </div>`;
}
function consoleLogout(){ if(!confirm("Se déconnecter de la console ?")) return; try{ google.accounts.id.disableAutoSelect(); }catch(e){} location.reload(); }

</script>
