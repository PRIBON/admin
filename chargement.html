<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4f5f7;color:#1a1a1a;font-size:15px}

  .parse-note{font-size:12px;color:#555;background:#f7f9f7;border-radius:6px;padding:6px 8px}

  .card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);padding:20px;max-width:640px}
  .dot{width:7px;height:7px;border-radius:50%;background:#e53935;display:inline-block;animation:blink 1.2s infinite}

<script>
let ID_TOKEN=null;
let ME_EMAIL="";
const dbByStore={};      // code -> firebase database
const names={};          // operatorCode -> "Prénom Nom"
const state={};          // code -> { receptions, docs, broadcasts }
let pendingNames=false;
let msgStore=null;       // magasin sélectionné dans l'onglet Messages
let avoirView="magasin", avoirStatut="", avoirDate=""; // onglet Suivi des avoirs
let dbCentrale=null;                       // Firebase du projet CENTRALE (app Dispatch)
const centraleState={ dispatch:{}, reception:{}, decoupe:{}, ecartsSuivi:{}, broadcasts:{}, tracabilite:{}, inventaireVin:{}, kbgPoids:{} };
let centraleView="ecarts";                 // onglet Dispatch & Découpe : ecarts | histo | decoupe
let dpDecoupeDate="", dpDecoupeSearch="";  // filtres de l'historique découpe
let dpHistoDate="", dpHistoSearch="";      // filtres de l'historique dispatch
let recView="todo";                        // onglet Réception : todo | archives
let suiviType="tous";                      // filtre Suivi live : tous | reception | dispatch | decoupe
let FOURNS=[];           // répertoire fournisseurs (nom + email litiges)
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function norm(s){ return (s||"").toString().normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim(); }
function toNum(s){ if(s==null) return 0; const n=parseFloat(String(s).replace(/\s/g,"").replace(",",".")); return isNaN(n)?0:n; }
// Extraction EAN depuis un code scanné, y compris QR/DataMatrix GS1 (AI (01) + GTIN-14 + lot/série).
// Ex. 0103463310025489986733 -> 3463310025489 ; un EAN classique est renvoyé tel quel.
function extractEan(raw){
  let s=String(raw==null?"":raw).replace(/\D/g,"");
  if(s.indexOf("01")===0){
    if(s.length>=16){ let g=s.substr(2,14); return (g.length===14&&g[0]==="0")?g.slice(1):g; }
    if(s.length===15) return s.substr(2);
  }
  return s;
}
/* --- écarts / avoirs (v1.2) --- */
const MOTIF_LABELS={ mauvaise_qte:"Mauvaise quantité", casse_fournisseur:"Casse fournisseur", auto_conso:"Auto-consommation", casse_salarie:"Casse (salarié)", delotage:"Délotage", perime_perte:"Périmé / perte" };
function motifLabel(k){ return MOTIF_LABELS[k]||k||"écart"; }
function recLineArr(r){ return Object.values((r&&r.lines)||{}); }
function recEcartLines(r){ return recLineArr(r).filter(s=>s && (s.status==='ecart'||s.status==='nonrecu')); }
function recAvoirLines(r){ return recLineArr(r).filter(s=>s && s.avoir===true); }

/* ============================ VERSION / MAJ ============================ */
function isNewer(a,b){
  const pa=String(a).split(".").map(n=>parseInt(n,10)||0), pb=String(b).split(".").map(n=>parseInt(n,10)||0);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){ const x=pa[i]||0,y=pb[i]||0; if(y>x)return true; if(y<x)return false; }
  return false;
}
function reloadToLatest(latest){ try{ const u=new URL(location.href); u.searchParams.set("v",latest||String(Date.now())); location.replace(u.toString()); }catch(e){ location.reload(); } }
function showUpdateBar(latest){
  if(document.getElementById("updbar")) return;
  const d=document.createElement("div"); d.className="update-bar"; d.id="updbar";
  d.innerHTML='<span>Nouvelle version '+esc(latest)+' disponible</span>';
  const b=document.createElement("button"); b.textContent="Mettre à jour"; b.onclick=()=>reloadToLatest(latest);
  d.appendChild(b); document.body.appendChild(d);
}
function checkVersion(){
  fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"get-version"})})
    .then(r=>r.json()).then(j=>{ if(j&&j.version&&isNewer(APP_VERSION,j.version)) showUpdateBar(j.version); }).catch(()=>{});
}

/* ============================ AUTH ============================ */
function onCredential(resp){
  ID_TOKEN=resp.credential;
  fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action:"verify-responsable",idToken:ID_TOKEN})})
    .then(r=>r.json()).then(j=>{
      if(j&&j.allowed){ start(j.email); }
      else document.getElementById("gateErr").textContent="Accès refusé : "+((j&&j.email)||"")+" n'est pas autorisé.";
    }).catch(e=>document.getElementById("gateErr").textContent="Erreur : "+e.message);
}
window.onload=function(){
  if(OAUTH_CLIENT_ID.indexOf("__")!==-1){ document.getElementById("gateErr").textContent="Renseigne OAUTH_CLIENT_ID et APPS_SCRIPT_URL en haut du fichier."; return; }
  document.querySelector(".header .sub").textContent="Suivi & chargement BL + commande · tous les magasins · v"+APP_VERSION;
  checkVersion(); setInterval(checkVersion, 10*60*1000);
  const t=setInterval(()=>{ if(window.google&&google.accounts&&google.accounts.id){ clearInterval(t);
    google.accounts.id.initialize({client_id:OAUTH_CLIENT_ID,callback:onCredential});
    google.accounts.id.renderButton(document.getElementById("gbtn"),{theme:"filled_blue",size:"large",text:"signin_with"});
  }},150);
};

const readyStores=()=>STORES.filter(s=>s.firebaseConfig&&s.firebaseConfig.databaseURL);

function start(email){
  ME_EMAIL=email;
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("whoami").textContent=email;
  // Init une app Firebase par magasin configuré
  readyStores().forEach(s=>{
    try{
      const appF=firebase.initializeApp(s.firebaseConfig, s.code);
      dbByStore[s.code]=firebase.database(appF);
      state[s.code]={receptions:{},docs:{},broadcasts:{}};
    }catch(e){ console.error("Firebase "+s.code, e); }
  });
  // Connexion au projet CENTRALE (app Dispatch palette) — lecture des commandes dispatchées.
  try{
    const appC=firebase.initializeApp(CENTRALE_FIREBASE_CONFIG,"CENTRALE");
    dbCentrale=firebase.database(appC);
    dbCentrale.ref("dispatch").on("value",snap=>{ centraleState.dispatch=snap.val()||{}; renderCentrale(); renderSuivi(); });
    dbCentrale.ref("decoupe").on("value",snap=>{ centraleState.decoupe=snap.val()||{}; renderCentrale(); renderSuivi(); });
    dbCentrale.ref("tracabilite").on("value",snap=>{ centraleState.tracabilite=snap.val()||{}; renderCentrale(); });
    dbCentrale.ref("centrale_reception").on("value",snap=>{ centraleState.reception=snap.val()||{}; renderCentrale(); });
    dbCentrale.ref("ecarts_suivi").on("value",snap=>{ centraleState.ecartsSuivi=snap.val()||{}; renderCentrale(); });
    dbCentrale.ref("inventaire_vin").on("value",snap=>{ centraleState.inventaireVin=snap.val()||{}; renderInventaire(); });
    dbCentrale.ref("config/kbg_poids").on("value",snap=>{ centraleState.kbgPoids=snap.val()||{}; renderKbgPoids(); });
    dbCentrale.ref("broadcasts").on("value",snap=>{ centraleState.broadcasts=snap.val()||{}; renderMsg(); });
  }catch(e){ console.error("Firebase CENTRALE", e); }
  // Onglets
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
  renderMulti(); renderMsg();
  apiRP("get-fournisseurs").then(j=>{ if(j&&j.fournisseurs) FOURNS=j.fournisseurs; }).catch(()=>{});
  // Écouteurs live : réceptions + documents + messages de chaque magasin
  readyStores().forEach(s=>{ const db=dbByStore[s.code]; if(!db) return;
    db.ref("receptions").on("value",snap=>{ state[s.code].receptions=snap.val()||{}; queueNames(); renderSuivi(); renderG5(); renderAvoirs(); renderLoadStatus(); });
    db.ref("documents").on("value",snap=>{ state[s.code].docs=snap.val()||{}; renderSuivi(); renderG5(); renderLoadStatus(); });
    db.ref("broadcasts").on("value",snap=>{ state[s.code].broadcasts=snap.val()||{}; queueNames(); renderMsg(); });
  });
  renderG5();
  setInterval(renderSuivi,1000);
}
function switchTab(t){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));
  ["multi","g5","centrale","inventaire","avoirs","suivi","msg","fourn"].forEach(x=>document.getElementById("tab-"+x).classList.toggle("hidden",x!==t));
  if(t==="avoirs") renderAvoirs();
  if(t==="centrale") renderCentrale();
  if(t==="inventaire") renderInventaire();
  if(t==="fourn") renderFournisseurs();
}
/* Rafraîchit l'affichage de l'onglet courant SANS recharger la page (donc sans se reconnecter).
   Les données Firebase sont déjà en direct ; ce bouton force un nouveau rendu si besoin. */
function refreshActive(btn){
  const active=document.querySelector(".tab.active");
  const t=active?active.dataset.tab:"multi";
  try{
    if(t==="multi") renderMulti();
    else if(t==="g5") renderG5();
    else if(t==="centrale") renderCentrale();
    else if(t==="inventaire") renderInventaire();
    else if(t==="avoirs") renderAvoirs();
    else if(t==="suivi") renderSuivi();
    else if(t==="msg") renderMsg();
    else if(t==="fourn") renderFournisseurs();
    renderLoadStatus && renderLoadStatus();
  }catch(e){ console.error("refreshActive", e); }
  if(btn){ const old=btn.textContent; btn.textContent="✓ Actualisé"; setTimeout(()=>{ btn.textContent=old; }, 1200); }
}
/* Appel Apps Script authentifié (idToken responsable). */
async function apiRP(action, extra){
  const r=await fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(Object.assign({action, idToken:ID_TOKEN}, extra||{}))});
  return await r.json();
}

/* ============================ PARSEURS ============================ */
function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return {docNumber:"",supplier:"",lines:[]};
  const head=lines[0].split(";").map(h=>norm(h));
  const col=(names)=>{ for(const n of names){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
  const iType=col(["type de piece"]),iDoc=col(["numero piece"]),iEan=col(["ean"]),iRef=col(["reference"]),
        iDes=col(["designation"]),iQte=col(["qte","qte "]),iMar=col(["marque"]),iComm=col(["commentaire"]),
        iFam=col(["famille"]),iRay=col(["rayon"]);
  const out=[]; let docNumber="";
  for(let r=1;r<lines.length;r++){
    const c=lines[r].split(";"); if(c.length<3) continue;
    const type=(iType>=0?c[iType]:"").trim(), article=(iRef>=0?c[iRef]:"").trim(), des=(iDes>=0?c[iDes]:"").trim();
    if(!article&&!des) continue;
    const nonLivre=/non\s*livr/i.test(type);
    if(iDoc>=0&&c[iDoc]&&!docNumber&&!nonLivre) docNumber=c[iDoc].trim();
    const fam=(iFam>=0?c[iFam]:"").trim(), ray=(iRay>=0?c[iRay]:"").trim();
    out.push({ article, ean:(iEan>=0?c[iEan]:"").trim().replace(/^0+(?=\d)/,""), designation:des,
      marque:(iMar>=0?c[iMar]:"").trim(), attendu:toNum(iQte>=0?c[iQte]:0),
      categorie:(fam||ray||"Autres"), comment:(iComm>=0?(c[iComm]||"").trim():""), nonLivre });
  }
  return { docNumber, supplier:"", lines:out };
}
function parseTXT(text){
  const rows=text.split(/\r?\n/); const out=[]; let docNumber=""; let skipped=0;
  const dateRe=/^\d{2}\/\d{2}\/\d{4}$/;
  for(const raw of rows){
    if(!raw.trim()) continue;
    const c=raw.split("\t");
    if(c.length<9||!dateRe.test((c[2]||"").trim())){ skipped++; continue; }
    const article=(c[4]||"").trim(), des=(c[5]||"").trim(), qte=toNum(c[8]);
    if(!article||!des){ skipped++; continue; }
    if(c[3]) docNumber=(c[3]||"").trim();
    out.push({ article, ean:"", designation:des, marque:"", attendu:qte, categorie:"Autres", label:(c[6]||"").trim() });
  }
  return { docNumber, supplier:"", lines:out, skipped };
}
function parsePDFLines(rowLines){
  const out=[]; let supplier=""; let docNumber="";
  const lineRe=/^(\d{2,7})\s+(.*\S)\s+(\d{8,13})\s+(\d+)\s+[\d.,]+\s+[\d.,]+\s*$/;
  for(const L of rowLines){
    if(!supplier&&/VITAFRAIS/i.test(L)) supplier="VITAFRAIS";
    const mBL=L.match(/n[°º]\s*BL\s*:?\s*(\d+)/i); if(mBL) docNumber=mBL[1];
    if(/^(Palette|Colis \d|Poids|Total|Distribution|Page|Commande|BIO :|DEM :)/i.test(L)) continue;
    const m=L.match(lineRe); if(!m) continue;
    let des=m[2].replace(/\s+\d+\s+\d+\s*$/,"").replace(/\s+\d+\s*$/,""); // retire colis + PCB (ou l'un des deux)
    des=des.replace(/\s*(BIO|DEM)\s*$/i,"").trim();                        // retire le label de fin (même collé : "150gBIO")
    out.push({ article:m[1], ean:m[3].replace(/^0+(?=\d)/,""), designation:des, marque:"", attendu:parseInt(m[4],10), categorie:"Autres" });
  }
  return { docNumber, supplier, lines:out };
}
// --- Parseur PDF Biodis (mise en page différente de Vitafrais) ---
function cleanDesBiodis(s){ return String(s||"").replace(/\s+(Non\s+Bio|Bio|Conv(?:ersion)?|Cosmebio|Ecocert)\s*$/i,"").trim(); }
function parseBiodisPDF(rowLines){
  const out=[]; let supplier="BIODIS", docNumber=""; let stopped=false;
  const reU  = /^(\d{3,7})\s+(.+?)\s+(\d{13})\s+\d+\s+(\d+)\s+U\s+[\d.,]+\s+[\d.,]+\s+\d+\s*$/;
  const reKG = /^(\d{3,7})\s+(.+?)\s+(\d{13})\s+\d+\s+([\d.,]+)\s*KG\s+[\d.,]+\s+[\d.,]+\s+\d+\s*$/;
  const reND = /^(\d{3,7})\s+(.+?)\s+(Non livr[ée]|Produit sur commande|Rupture fournisseur)\s+(\d+)\s+U\s*$/i;
  const isItemNum=(s)=>reU.test(s)||reKG.test(s);
  const isMeta=(s)=>/^(Prix\b|DLC\b|DDM\b|Contribution\b|Lot\b|Sous-total\b|Commande n\b|SASU\b|NAF\b|No AGREMENT|www\.|http|BIO :|CONV\b|COSMEBIO|FR-BIO|Page \d|Poids\b|Date\b|Certification\b|Marque\b|Cat\.|TPF\b|TVA\b|Bon de Livraison|PRIBON|T[ée]l\.|Fax\b|e_mail|Site WEB|EAN\b|PRIX\b|Montant\b|Colis\b|UNITAIRE|H\.T\.|Scannez|Espace Pro|C'est Biodis|Vous pouvez|pr[ée]command|commerciales|Merci|ne pourrons|PARTICIPATION|prix indicatif|-{3,})/i.test(s) || /^[\d.,]+$/.test(String(s).trim());
  for(let i=0;i<rowLines.length;i++){
    const L=rowLines[i];
    const doc=L.match(/(\d{2}\/\d{2}\/\d{4})\s+(\d{6,8})\s/); if(doc && !docNumber) docNumber=doc[2];
    if(/Produits en arr[eê]t long|R[ée]f[ée]rence D[ée]s/i.test(L)){ stopped=true; continue; }
    if(stopped) continue;
    let m;
    if((m=L.match(reND))){ out.push({ article:m[1], ean:"", designation:cleanDesBiodis(m[2]), marque:"", attendu:parseInt(m[4],10), categorie:"Autres", nonLivre:true, comment:m[3] }); continue; }
    let art=null, ean="", att=0;
    if((m=L.match(reU)))  { art=m[1]; ean=m[3]; att=parseInt(m[4],10); }
    else if((m=L.match(reKG))){ art=m[1]; ean=m[3]; att=toNum(m[4]); }
    if(art){
      let des=[];
      for(let j=i+1;j<rowLines.length && des.length<3;j++){
        const N=rowLines[j];
        if(isItemNum(N)||reND.test(N)||isMeta(N)) break;
        des.push(N);
      }
      out.push({ article:art, ean:ean.replace(/^0+(?=\d)/,""), designation:cleanDesBiodis(des.join(" ")), marque:"", attendu:att, categorie:"Autres" });
    }
  }
  return { docNumber, supplier, lines: out };
}
function pickPdfParser(rowLines){
  const j=rowLines.join("\n");
  if(/BIODIS/i.test(j)) return parseBiodisPDF(rowLines);
  return parsePDFLines(rowLines); // Vitafrais (par défaut)
}
async function readPDF(buf){
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let rowLines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p); const tc=await page.getTextContent();
    const rows={};
    for(const it of tc.items){ const y=Math.round(it.transform[5]); (rows[y]=rows[y]||[]).push([it.transform[4],it.str]); }
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{
      const line=rows[y].sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(" ").replace(/\s+/g," ").trim();
      if(line) rowLines.push(line);
    });
  }
  return pickPdfParser(rowLines);
}

// Code fournisseur G5 -> nom lisible (complète au besoin).
const FOURN_MAP={ "K113":"SBV", "K005":"BODIN" };
async function parseOrderXlsx(file){
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""});
  // --- Format AGIDRA (export commande depuis leur site) : REF / Désignation produit / Code EAN / Colisage / Qté(colis) ---
  {
    const NA=(s)=>String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
    let ah=-1;
    for(let i=0;i<Math.min(rows.length,10);i++){ const r=(rows[i]||[]).map(NA);
      if(r.some(x=>x==="REF") && r.some(x=>x.includes("COLISAGE")) && r.some(x=>x.includes("DESIGNATION"))){ ah=i; break; } }
    if(ah>=0){
      const head=rows[ah].map(x=>String(x).trim());
      const acol=(names)=>{ for(const nm of names){ const i=head.findIndex(x=>NA(x)===NA(nm)||NA(x).includes(NA(nm))); if(i>=0) return i; } return -1; };
      const iRef=acol(["REF"]), iDes=acol(["DESIGNATION"]), iEan=acol(["CODE EAN","EAN"]),
            iCol=acol(["COLISAGE"]), iQte=acol(["QTE","QUANTITE"]);
      const lines=[];
      for(let i=ah+1;i<rows.length;i++){
        const r=rows[i]||[];
        const ref=String(iRef>=0?r[iRef]:"").trim(), des=String(iDes>=0?r[iDes]:"").trim();
        if(!ref||!des) continue;
        const cdt=toNum(iCol>=0?r[iCol]:0)||null, qte=toNum(iQte>=0?r[iQte]:0);
        lines.push({ article:ref, code:ref, ean:String(iEan>=0?r[iEan]:"").trim().replace(/^0+(?=\d)/,""),
          ref, designation:des, cdt, qteCmd:qte, unit:cdt?"colis":"piece",
          attendu: cdt?Math.round(qte*cdt):qte, poidsVariable:false, categorie:"Autres" });
      }
      if(!lines.length) throw new Error("Commande Agidra lue mais aucune ligne article trouvee.");
      const mCmd=String(file.name||"").match(/commande[_-]?(\d{5,})/i);
      return { format:"CMD", g5Key:"code", supplier:"AGIDRA", docNumber: mCmd?mCmd[1]:"", deliveryDate:"", lines };
    }
  }
  // --- Format commande "simple" (export interne : Code(EAN) / Réf fournisseur / Désignation / Qté finale) ---
  // Détecté par : Code + Désignation + une colonne Qté* + une Réf, ET absence de colonne CDT
  // (la colonne CDT est la signature de l'export G5 standard, traité plus bas).
  {
    const NS=(s)=>String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
    let sh=-1;
    for(let i=0;i<Math.min(rows.length,12);i++){ const r=(rows[i]||[]).map(NS);
      const hasCode=r.some(x=>x==="CODE"), hasDes=r.some(x=>x.includes("DESIGNATION")),
            hasQte=r.some(x=>x.startsWith("QTE")), hasRef=r.some(x=>x.includes("REF")),
            hasCDT=r.some(x=>x==="CDT");
      if(hasCode&&hasDes&&hasQte&&hasRef&&!hasCDT){ sh=i; break; } }
    if(sh>=0){
      const head=rows[sh].map(x=>String(x).trim());
      const find=(pred)=>head.findIndex(x=>pred(NS(x)));
      const iCode=find(x=>x==="CODE"), iRef=find(x=>x.includes("REF")),
            iDes=find(x=>x.includes("DESIGNATION")), iQte=find(x=>x.startsWith("QTE"));
      const lines=[];
      for(let i=sh+1;i<rows.length;i++){
        const r=rows[i]||[];
        const codeCell=String(iCode>=0?(r[iCode]??""):"").trim();
        const ref=String(iRef>=0?(r[iRef]??""):"").trim();
        const des=String(iDes>=0?(r[iDes]??""):"").trim();
        if(!des||(!codeCell&&!ref)) continue;
        const qte=toNum(iQte>=0?r[iQte]:0);
        const isEan=/^\d{12,13}$/.test(codeCell);
        lines.push({ article:codeCell||ref, code:codeCell||ref,
          ean:isEan?codeCell.replace(/^0+(?=\d)/,""):"", ref,
          designation:des, cdt:null, qteCmd:qte, unit:"piece",
          attendu:qte, poidsVariable:false, categorie:"Autres" });
      }
      if(!lines.length) throw new Error("Commande lue mais aucune ligne article trouvée (format simple).");
      const mCmd=String(file.name||"").match(/(\d{6,})/);
      return { format:"CMD", g5Key:"code", supplier:"", docNumber: mCmd?mCmd[1]:"", deliveryDate:"", lines };
    }
  }
  const N=(s)=>String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
  let h=-1;
  for(let i=0;i<rows.length;i++){ const r=(rows[i]||[]).map(N);
    if(r.includes("CODE") && r.some(c=>c.startsWith("DESIGNATION"))){ h=i; break; } }
  if(h<0) throw new Error("Export de commande non reconnu (en-tête Code/Désignation introuvable).");
  const head=rows[h].map(x=>String(x).trim());
  const col=(names)=>{ for(const n of names){ const i=head.findIndex(c=>N(c)===N(n)); if(i>=0) return i; } return -1; };
  const iCode=col(["Code"]), iRef=col(["Ref Fourn.","Ref Fourn"]), iDes=col(["Désignation","Designation"]),
        iCdt=col(["CDT"]), iQte=col(["Qté","Qte"]), iFourn=col(["Fournisseur"]);
  let dateLiv="", cmd="", supplier="";
  rows.forEach(r=>{ const j=(r||[]).map(x=>String(x));
    const li=j.findIndex(x=>/^\s*Le\s*$/i.test(x)); if(li>=0 && /\d{2}\/\d{2}\/\d{4}/.test(j[li+1]||"")) dateLiv=j[li+1].trim();
    const ci=j.findIndex(x=>/Commande à la Centrale N°/i.test(x)); if(ci>=0 && j[ci+1]) cmd=String(j[ci+1]).trim();
    const fi=j.findIndex(x=>/Adresse de Livraison/i.test(x)); if(fi>=0 && j[fi+1]) supplier=j[fi+1].trim();
    j.forEach(x=>{ if(!cmd && /^\d{2}-\d-[A-Za-z0-9]+$/.test(String(x).trim())) cmd=String(x).trim(); });
  });
  const lines=[]; let fournCode="";
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]||[]; const code=String(r[iCode]||"").trim(); const des=String(r[iDes]||"").trim();
    if(!/^(NC-|\d)/i.test(code) || !des) continue;              // ignore pied de page / 2e en-tête
    const cdtRaw=iCdt>=0?String(r[iCdt]||"").trim():"";
    const cdt=cdtRaw?toNum(cdtRaw.replace(/^C/i,"")):null;      // "C6" -> 6 (pièces par colis)
    const qte=toNum(r[iQte]);
    if(iFourn>=0 && r[iFourn] && !fournCode) fournCode=String(r[iFourn]).trim();
    const isPV=/000000$/.test(code)||/^2\d{11,12}$/.test(code)||/\bENV\b/i.test(des);
    const isEan=/^\d{12,13}$/.test(code);
    lines.push({ article:code, code, ean:isEan?code.replace(/^0+(?=\d)/,""):"", ref:String(iRef>=0?r[iRef]||"":"").trim(),
      designation:des, cdt, qteCmd:qte, unit:cdt?"colis":"piece",
      attendu: cdt?Math.round(qte*cdt):qte, poidsVariable:isPV, categorie:"Autres" });
  }
  if(!supplier && fournCode) supplier=FOURN_MAP[fournCode]||fournCode;
  if(!lines.length) throw new Error("Commande lue mais aucune ligne article trouvée.");
  return { format:"CMD", g5Key:"code", supplier, docNumber:cmd||"", deliveryDate:dateLiv, lines };
}

async function parseAnyFile(file){
  const name=(file.name||"").toLowerCase();
  if(name.endsWith(".xlsx")||name.endsWith(".xls")) return await parseOrderXlsx(file);
  if(name.endsWith(".pdf")){ const buf=await file.arrayBuffer(); return { ...(await readPDF(buf)), format:"PDF" }; }
  const buf=await file.arrayBuffer();
  let text; try{ text=new TextDecoder("windows-1252").decode(buf); }catch(e){ text=new TextDecoder("utf-8").decode(buf); }
  const first=text.split(/\r?\n/).slice(0,5).join("\n");
  if(name.endsWith(".csv")||first.includes(";")){
    if(!first.includes(";")&&first.includes("\t")) return { ...parseTXT(text), format:"TXT" };
    return { ...parseCSV(text), format:"CSV" };
  }
  return { ...parseTXT(text), format:"TXT" };
}

// Détermine la clé utilisée pour le .txt G5 : EAN si présent, sinon on propose le code article.
function detectG5Key(parsed){
  const hasEan=(parsed.lines||[]).some(l=>l.ean&&String(l.ean).trim().length>=6);
  if(hasEan) return 'ean';
  const hasArticle=(parsed.lines||[]).some(l=>l.article);
  if(hasArticle){
    const ok=confirm("⚠️ Pas d'EAN sur ce document.\n\nUtiliser le CODE ARTICLE pour le .txt à charger sur G5 ?\n\n(OK = oui, utiliser le code article · Annuler = laisser tel quel)");
    return ok?'article':'ean';
  }

// Clé de ligne identique à l'app vendeur (pour retrouver la quantité réelle).
function lineKeyOf(l,idx){ const a=(l.article||"").toString().trim(); return a?("a_"+a.replace(/[.#$/\[\]]/g,"_")):("i_"+idx); }
// Construit le .txt G5.
// - code = colonne "Code" de la commande (l.code) si présent, sinon EAN/article (ancien mode).
// - quantité exprimée dans l'unité de la commande :
//     colis (l.cdt) -> pièces_reçues / cdt ; poids variable -> poids saisi ; sinon pièces.

  
 function buildG5Txt(rec, doc){
  const key=(doc&&doc.g5Key)||'ean';
  const active=((doc&&doc.lines)?doc.lines:[]).filter(l=>!l.nonLivre);
  const out=[];
  if(active.length){
    // Cas normal : on itère les lignes du document (commande/BL rapprochés)
    active.forEach((l,i)=>{
      const st=(rec.lines||{})[lineKeyOf(l,i)]||{};
      let qty;
      if(st.status==='nonrecu'){ qty=0; }                                              // pas reçu -> 0
      else if(l.poidsVariable){ qty=(st.poids!=null&&st.poids!=="")?st.poids:(l.qteCmd!=null?l.qteCmd:l.attendu); } // poids réel
      else { qty=(l.qteCmd!=null?l.qteCmd:l.attendu); }                                // quantité NORMALE
      const code=l.code||(key==='article'?(l.article||l.ean||''):(l.ean||l.article||''));
      if(!code||qty==null||qty==="") return;
      out.push(code+"\t"+String(qty).replace(".",","));
    });
  } else {
    // Secours : document non lié -> on lit les lignes stockées dans la réception elle-même
    Object.values(rec.lines||{}).forEach(s=>{
      if(s.nonLivre) return;
      let qty;
      if(s.status==='nonrecu'){ qty=0; }
      else if(s.poids!=null&&s.poids!==""){ qty=s.poids; }
      else { qty=(s.attendu!=null?s.attendu:null); }
      const code=s.code||s.ean||s.article||'';
      if(!code||qty==null||qty==="") return;
      out.push(code+"\t"+String(qty).replace(".",","));
    });
  }
  return out.join("\r\n");
}

      if(keys.slice(0,4).some(k=>k && blc.includes(k))){ bi=i; break; }
    }

      const kd=normKey(ol.designation);
      if(kd && kd.length>=8){
        for(let i=0;i<blLines.length;i++){
          if(used.has(i)) continue;
          const bd=normKey(blLines[i].designation);
          if(bd && (bd===kd || bd.includes(kd) || kd.includes(bd))){ bi=i; break; }
        }

      marque: blLine?.marque || ol.marque || "",

      qteCmd: ol.qteCmd != null ? ol.qteCmd : null,
      unit: ol.unit || (ol.cdt?"colis":"piece"),
      attendu: Number(ol.attendu)||0,
      poidsVariable: !!(ol.poidsVariable || blLine?.poidsVariable),
      categorie: blLine?.categorie || ol.categorie || "Autres",
      label: blLine?.label || ol.label || "",

      commandMatched: bi>=0,
      blArticle: blLine?.article || "",

  });

  // Articles présents sur le BL mais absents de la commande : on les conserve,
  // mais avec attendu=0 pour qu'ils soient visibles et signalés au pointage.
  blLines.forEach((blLine,i)=>{
    if(used.has(i)) return;

      article: blLine.article || blLine.ean || "",
      code: blLine.article || blLine.ean || "",
      ean: blLine.ean || "",
      ref: blLine.article || "",
      designation: blLine.designation || "",
      marque: blLine.marque || "",
      cdt: null, qteCmd:0, unit:"piece", attendu:0,
      poidsVariable:!!blLine.poidsVariable, categorie:blLine.categorie||"Autres",
      label:blLine.label||"", nonLivre:false, commandMatched:false,

  });

    format:"BL+CMD",
    g5Key:"code",
    supplier:order.supplier || bl.supplier || "",
    docNumber:bl.docNumber || order.docNumber || "",
    commandNumber:order.docNumber || "",
    deliveryDate:order.deliveryDate || "",
    lines:merged,
    reconciliation:{ commandLines:(order.lines||[]).length, blLines:blLines.length, unmatchedCommand:unmatched, unmatchedBL:merged.filter(x=>x.horsCommande).length }
  };
}

  if(headerIdx===-1){ for(let i=0;i<Math.min(rows.length,20);i++){ const row=rows[i].map(c=>normColC(c));
    const hasQty=row.some(c=>c==="quantite"||c==="qte"||c==="qty"||c==="uvc"||c==="cde en uvc"||c==="cde"||c.includes("commande")||detectStoreColumn(null,c)!==null);
    const hasText=row.some(c=>c.length>0&&c.length<50&&!/^\d+([.,]\d+)?$/.test(c)); if(hasQty&&hasText){ headerIdx=i; headers=rows[i]; break; } } }

    else if(n==="article"){ articleAsCode.push(idx); }

    const parse=isG5?parseG5CellC:(v)=>{ if(v===""||v==null) return 0; const s=v.toString().trim(); const m=s.match(/^(\d+)\s*u/); if(m) return parseInt(m[1],10); const n=parseFloat(s.replace(",",".")); return isNaN(n)?0:Math.round(n); };

    const cmd=colMap.cmd!==undefined?parse(row[colMap.cmd]):recue;
    const colisage=colMap.colisage!==undefined?parseColisageC(row[colMap.colisage]):0;
    products.push({ article:colMap.article!==undefined?String(row[colMap.article]||"").trim():"", designation, cmd, recue, stores, colisage }); }
  return { products, storeColumns: storeColumns.map(s=>s.def) };
}
function parseBdcColisageC(workbook){
  const sheet=workbook.Sheets[workbook.SheetNames[0]];

  let hi=-1,hd=null;
  for(let i=0;i<Math.min(rows.length,25);i++){ const r=rows[i].map(c=>normColC(c)); if(r.some(c=>c.includes("colisage")||c.includes("conditionnement")||c==="pcb"||c==="cdt"||c.includes("par colis"))){ hi=i; hd=rows[i]; break; } }
  if(hi===-1) return {byArticle:{},byName:{},count:0};
  let a=-1,d=-1,c=-1;

    if(c<0&&(n.includes("colisage")||n.includes("conditionnement")||n==="pcb"||n==="cdt"||n.includes("par colis"))) c=idx;

// Découpe S37 (Excel). Cmd (commande Montreuil) = cible à découper ; DÉCOUPE = plan ; Envoi = confirmation.
function parseDecoupeExcelS37(workbook){

// BL fournisseur UGALAIT (Excel) : Code article | Désignation | Cdt | Qté colis | Qté pièces | Poids net…

  const num=(v)=>{ const n=parseFloat(String(v).replace(",",".").replace(/[^\d.]/g,"")); return isNaN(n)?0:n; };

    const pie=iPie>=0?num(row[iPie]):0, col=iCol>=0?num(row[iCol]):0, pds=iPds>=0?num(row[iPds]):0;

// Choisit automatiquement le bon parseur Excel (découpe S37 OU BL Ugalait).
function parseDecoupeAnyExcel(workbook){

  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""}); const N=normColC;

  if(!products.length){
    for(const L of rowLines){
      const m=String(L).match(/^(\d{5,7}[A-Za-z]?)\s+(.+?)\s+(\d+)\s+(\d+)\s+(\d+)\s+([\d.,]+)/);
      if(m){ const pj=parseInt(m[5],10)||0, pk=toNum(m[6]);
        products.push({ article:m[1], ref:m[1], code:m[1], designation:cleanUgalaitDes(m[2]),
          fournisseur:"UGALAIT", commande:pj, decoupePlan:0, envoi:0,
          poids:(pj>0&&pk>0)?Math.round(pk/pj*1000):0, poidsRecu:pk||0, rupture:false }); }
    }
  }
  if(!products.length) throw new Error("PDF Ugalait : aucune ligne article reconnue.");
  // Dédoublonnage : le PDF contient souvent plusieurs exemplaires du même BL (1/3, 2/3, 3/3).
  const seen={}, uniq=[];
  for(const p of products){ const k=String(p.code||p.designation||""); if(k&&!seen[k]){ seen[k]=1; uniq.push(p); } }
  return { products:uniq, supplier:"UGALAIT", docNumber };
}
/* Référence des fromages Kelbongoo vendus À LA PIÈCE (poids cible g) — liste Henry, seule source.
   Fourchettes (Petit Perche 81–99, Selles sur Cher 180–220) → médian + tol ±10 %. */
const FROMAGE_KBG_REF=[["Abondance Fermier AOP",200],["Bethmale Grand Cru",200],["Bleu d'Auvergne Fermier AOP",200],["Bleu du Vercors-Sassenage AOP",200],["Brie de Meaux AOP 1/2 affiné",200],["Brie de Nangis",200],["Brousse de Brebis",450],["Camembert fermier AOP",250],["Chaource AOP",250],["Charolais AOP",250],["Coeur Neufchâtel Bio AOP",200],["Couronne Lochoise",170],["Délice des Deux Sèvres",150],["Epoisses Fermier AOP",250],["Fer à Cheval Cendré",100],["Fleur du Maquis",170],["Gratte Paille",350],["Hervé à la bière AOP",200],["L'Ami du Chambertin",200],["La Pelta",230],["Laguiole Grand Aubrac",200],["Langres AOP",200],["Le Gour Noir Fermier Bio",210],["Le Petit Perche Fumé",90],["Mimolette Extra Vieille 18 mois",200],["Morbier millésime 100J AOP",200],["Mothais Sur Feuille AOC",200],["Munster Fermier AOP",170],["Ossau Iraty AOP",200],["Perail des Cabasses",150],["Roquefort AOP",200],["Saint-Nectaire Fermier AOP",200],["Sainte Maure Fermier AOP",250],["Selles sur Cher Fermier AOP",200],["Tomme de Savoie Fermière IGP",200],["Comté AOP 18 mois",200]];
const _KBG_STOP=new Set(["aop","aoc","igp","fermier","fermiere","bio","de","du","des","la","le","les","sur","d","grand","cru","a","au","1","2"]);
function _kbgKey(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w&&!_KBG_STOP.has(w)).join(" "); }
const _KBGREF=FROMAGE_KBG_REF.map(r=>{ const k=_kbgKey(r[0]); return { poids:r[1], key:k, toks:k.split(" ").filter(Boolean) }; });
function kbgRefPoids(designation){
  const k=_kbgKey(designation); if(!k) return 0; const kt=k.split(" ").filter(Boolean);
  let hit=_KBGREF.find(r=>r.key===k); if(hit) return hit.poids;
  hit=_KBGREF.find(r=>r.key&&(k.indexOf(r.key)>=0||r.key.indexOf(k)>=0)); if(hit) return hit.poids;
  let best=null,bs=0; _KBGREF.forEach(r=>{ const n=r.toks.filter(t=>kt.indexOf(t)>=0).length; if(n>bs){bs=n;best=r;} });
  return (best&&(bs>=2||bs===kt.length))?best.poids:0;
}

function decoupeProductsForApp(parsed, entity){
  return (parsed.products||[]).map(p=>{ const rp=(entity==="KBG")?kbgRefPoids(p.designation):0;
    return { article:p.article||"", designation:p.designation, fournisseur:p.fournisseur||"",
      robCmd: entity==="ROB"?p.commande:0, kbgTarget: entity==="KBG"?Math.round(p.commande):0,
      poids: rp>0?rp:((p.poids&&p.poids>0)?p.poids:200), tol:10, envoiPrevu:p.envoi||0,

// Parse l'export G5 vin : colonnes Article (code), Désignation, Fournisseur (ex "F029 / MELLOT").
function parseVinExportC(workbook){
  const ws=workbook.Sheets[workbook.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
  const N=(s)=>String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
  let h=-1,hd=null;
  for(let i=0;i<Math.min(rows.length,15);i++){ const r=rows[i].map(N);
    if(r.some(c=>c==="article"||c==="code article"||c==="code") && r.some(c=>c.includes("fournisseur"))){ h=i; hd=rows[i]; break; } }
  if(h===-1) throw new Error("En-têtes introuvables (Article + Fournisseur).");
  const col=(cands)=>{ for(const cnd of cands){ const i=hd.findIndex(x=>N(x)===cnd); if(i>=0) return i; } for(const cnd of cands){ const i=hd.findIndex(x=>N(x).includes(cnd)); if(i>=0) return i; } return -1; };
  const iCode=col(["article","code article","code","ean","gencod"]);
  const iDes=col(["designation","libelle","produit","nom"]);
  const iFour=col(["fournisseur","frs"]);
  if(iCode<0||iFour<0) throw new Error("Colonnes Article/Fournisseur manquantes.");
  const rowsOut=[]; const supMap={};
  for(let i=h+1;i<rows.length;i++){ const r=rows[i]; if(!r) continue;
    const code=String(r[iCode]||"").trim(); const des=iDes>=0?String(r[iDes]||"").trim():"";
    let four=String(r[iFour]||"").trim(); if(!code&&!des) continue; if(!four) continue;
    // Regroupe par NOM (partie après le "/"), en fusionnant les doublons F029 / K029.
    const parts=four.split("/"); const name=(parts.length>1?parts.slice(1).join("/"):four).trim();
    const key=N(name).replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"")||"frs";
    rowsOut.push({ code, designation:des, fournisseur:name, fkey:key });
    if(!supMap[key]) supMap[key]={ key, label:name, count:0 }; supMap[key].count++;
  }
  const suppliers=Object.values(supMap).sort((a,b)=>b.count-a.count);
  return { rows:rowsOut, suppliers };
}

async function cpdpSendDecoupe(){
  const C=cpdp.decoupe; if(!C.parsed) return; if(!dbCentrale){ C.err="Connexion centrale indisponible."; renderCPDPCard(); return; }
  const entLabel=C.entity==="KBG"?"Kelbongoo":"Robespierre"; const products=decoupeProductsForApp(C.parsed,C.entity);
  const supLabel=(C.parsed.supplier?(C.parsed.supplier+" → "):"")+entLabel;
  const blNum=(C.blNumber||C.parsed.docNumber||"").toString().trim();
  // Rapprochement découpe libre ↔ BL : si un n° BL est présent, on clé la session sur bl_<entité>_<num>
  // (même clé que l'opérateur en découpe du jour) et on .update pour ne pas écraser sa découpe déjà en cours.
  const sid = blNum ? ("bl_"+C.entity.toLowerCase()+"_"+blNum.replace(/[^a-zA-Z0-9]/g,"")) : ("decoupe_"+C.entity.toLowerCase()+"_"+Date.now());
  // FUSION : si l'opérateur a déjà ajouté des fromages (découpe libre), on garde ses ajouts et on
  // fusionne les fromages du BL par désignation normalisée (même clé que frKey côté app).
  // Le BL est prioritaire sur SES fromages (poids reçu, quantités) ; les extras de l'opérateur sont conservés.
  const frNK = (d)=>String(d==null?"":d).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");
  let mergedProducts = products;
  try{
    const exSnap = await dbCentrale.ref("decoupe/"+sid+"/meta/products").once("value");
    const existing = exSnap.val();
    if(Array.isArray(existing) && existing.length){
      const byKey={}, order=[];
      existing.forEach(p=>{ if(p&&p.designation){ const k=frNK(p.designation); if(!(k in byKey)) order.push(k); byKey[k]=p; } });
      products.forEach(p=>{ if(p&&p.designation){ const k=frNK(p.designation); if(!(k in byKey)) order.push(k); byKey[k]=Object.assign({}, byKey[k]||{}, p); } });
      mergedProducts = order.map(k=>byKey[k]);
    }
  }catch(_){}
  try{ await dbCentrale.ref("decoupe/"+sid+"/meta").update({ supplier:supLabel, entity:C.entity, deliveryDate:C.deliveryDate||"", docNumber:blNum, startedAt:Date.now(), products:mergedProducts, createdBy:ME_EMAIL });
    C.sent=true; C.err=""; renderCPDPCard(); alert("✓ BL "+entLabel+(blNum?(" n°"+blNum):"")+" envoyé à l'app La Centrale PDP"+(C.deliveryDate?(" · réception prévue "+C.deliveryDate):"")+".");
    setTimeout(()=>{ cpdp.decoupe={ entity:C.entity, deliveryDate:C.deliveryDate, parsed:null, fileName:"", blNumber:"", sent:false, err:"" }; renderCPDPCard(); },1500);
  }catch(e){ C.err="Erreur d'envoi : "+e.message; renderCPDPCard(); }
}

// Nom de fichier G5 : AAMMJJ_FOURNISSEUR_BL.txt (ex : 260814_BIODIS_1154370.txt)
function g5Filename(r){
  const d=new Date(r.validatedAt||r.createdAt||Date.now());
  const yy=String(d.getFullYear()).slice(-2), mm=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
  const sup=String(r.supplier||"FOURNISSEUR").toUpperCase().replace(/[^A-Z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "FOURNISSEUR";
  const bl=String(r.docNumber||"BL").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "BL";
  return yy+mm+dd+"_"+sup+"_"+bl+".txt";
}
function dlG5(code,id){
  const st=state[code]; const r=st.receptions[id]; const doc=st.docs[r.docId]||null;

  if(!txt){ alert("Aucune ligne avec code (EAN / article) — impossible de générer le .txt."); return; }
  downloadTxt(g5Filename(r), txt);
}

async function sendBroadcast(){

function queueNames(){
  const need=new Set();
  Object.values(state).forEach(st=>{
    Object.values(st.receptions||{}).forEach(r=>{ if(r.operatorCode&&!(r.operatorCode in names)) need.add(r.operatorCode); });
    Object.values(st.broadcasts||{}).forEach(b=>{ Object.keys(b.reads||{}).forEach(c=>{ if(!(c in names)) need.add(c); }); });
  });
  if(!need.size||pendingNames) return;
  pendingNames=true;
  fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action:"resolve-names",idToken:ID_TOKEN,codes:Array.from(need)})})
    .then(r=>r.json()).then(j=>{ if(j&&j.names) Object.assign(names,j.names); pendingNames=false; renderSuivi(); renderMsg(); })
    .catch(()=>{ pendingNames=false; });
}
function activeCount(doc){ if(!doc||!doc.lines) return 0; return doc.lines.filter(l=>!l.nonLivre).length; }
function pointed(recLines){ return Object.values(recLines||{}).filter(s=>s&&s.status).length; }
function since(ts){ if(!ts) return ""; let s=Math.max(0,Math.floor((Date.now()-ts)/1000));
  const h=Math.floor(s/3600); s%=3600; const m=Math.floor(s/60); s%=60;
  return (h?h+"h":"")+String(m).padStart(h?2:1,"0")+"m"+String(s).padStart(2,"0"); }
function heure(ts){ if(!ts) return ""; const d=new Date(ts); return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }
/* --- Suivi live : regroupé par DATE D'ENVOI (chargement du document au magasin) --- */
function tsFromFr(fr){ if(!fr) return 0; const m=String(fr).split("/"); if(m.length!==3) return 0; const t=new Date(+m[2],+m[1]-1,+m[0]).getTime(); return isNaN(t)?0:t; }
function dayKeyTs(ts){ const d=new Date(ts); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayLabel(ts){ if(!ts) return "Sans date d'envoi"; const d=new Date(ts); const kd=dayKeyTs(ts), kt=dayKeyTs(Date.now()), ky=dayKeyTs(Date.now()-86400000);
  if(kd===kt) return "Aujourd'hui — "+d.toLocaleDateString("fr-FR");
  if(kd===ky) return "Hier — "+d.toLocaleDateString("fr-FR");
  return d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}); }
// Supprimer / fermer une réception (ex : brouillon abandonné, repris par quelqu'un d'autre).
async function deleteReception(code,id){
  const db=dbByStore[code]; if(!db) return;
  if(!confirm("Fermer / supprimer cette réception en cours ?\n\nÀ utiliser si elle a été abandonnée (par ex. reprise puis terminée par quelqu'un d'autre).\nElle disparaîtra du Suivi live. Action définitive.")) return;
  try{ await db.ref("receptions/"+id).remove(); }catch(e){ alert("Erreur : "+e.message); }
}
function renderSuivi(){
  const el=document.getElementById("tab-suivi"); if(!el) return;
  const WINDOW=7*86400*1000, now=Date.now();
  const items=[]; let totalDraft=0;
  if(suiviType==='tous'||suiviType==='reception') readyStores().forEach(s=>{
    const st=state[s.code]; if(!st) return;
    const docs=st.docs||{}, recs=st.receptions||{};
    const recsByDoc={};
    Object.entries(recs).forEach(([id,r])=>{ if(r.docId){ (recsByDoc[r.docId]=recsByDoc[r.docId]||[]).push({id,...r}); } });
    // Documents chargés (envoyés) et leur état de réception
    Object.entries(docs).forEach(([id,d])=>{
      const sendTs=d.createdAt||tsFromFr(d.deliveryDate)||0;
      const rs=recsByDoc[id]||[];
      const hasValid=rs.some(r=>r.status==="validated");
      if(!rs.length){ items.push({type:"reception", store:s, sendTs, kind:"attente", doc:d}); return; }
      rs.forEach(r=>{ const draft=r.status!=="validated";
        if(draft){ totalDraft++; items.push({type:"reception", store:s, sendTs, kind:"encours", doc:d, rec:r, dupValidated:hasValid}); }
        else if((now-sendTs)<WINDOW || !sendTs){ items.push({type:"reception", store:s, sendTs, kind:"valid", doc:d, rec:r}); }
      });
    });
    // Réceptions sans document rattaché (héritage / doc supprimé)
    Object.entries(recs).forEach(([id,r])=>{ if(r.docId&&docs[r.docId]) return;
      const draft=r.status!=="validated"; const sendTs=r.createdAt||r.validatedAt||0;
      if(draft){ totalDraft++; items.push({type:"reception", store:s, sendTs, kind:"encours", rec:{id,...r}, orphan:true}); }
      else if((now-sendTs)<WINDOW){ items.push({type:"reception", store:s, sendTs, kind:"valid", rec:{id,...r}, orphan:true}); }
    });
  });
  // Sessions CENTRALE (dispatch + découpe) en live
  if(suiviType==='tous'||suiviType==='dispatch') Object.entries(centraleState.dispatch||{}).forEach(([sid,s])=>{
    if(!s||!s.meta) return; const sess={id:sid, meta:s.meta, state:s.state||{}}; const stx=dispatchStats(sess); const sendTs=s.meta.startedAt||0;
    if((now-sendTs)<WINDOW || stx.done<stx.total){ if(stx.done<stx.total) totalDraft++; items.push({type:"dispatch", sess, stats:stx, sendTs, kind: stx.done<stx.total?"encours":"valid"}); } });
  if(suiviType==='tous'||suiviType==='decoupe') Object.entries(centraleState.decoupe||{}).forEach(([sid,s])=>{
    if(!s||!s.meta) return; const sess={id:sid, meta:s.meta, state:s.state||{}}; const stx=dispatchStats(sess); const sendTs=s.meta.startedAt||0;
    if((now-sendTs)<WINDOW || stx.done<stx.total){ if(stx.done<stx.total) totalDraft++; items.push({type:"decoupe", sess, stats:stx, sendTs, kind: stx.done<stx.total?"encours":"valid"}); } });
  // Regroupement par date d'envoi
  const byDay={};
  items.forEach(it=>{ const k=it.sendTs?dayKeyTs(it.sendTs):"0"; (byDay[k]=byDay[k]||{ts:it.sendTs||0, list:[]}); byDay[k].list.push(it); });
  const dayKeys=Object.keys(byDay).sort((a,b)=>(byDay[b].ts||0)-(byDay[a].ts||0));

  const card=(it)=>{
    if(it.type==="dispatch"||it.type==="decoupe"){
      const s=it.sess, stx=it.stats, draft=it.kind==="encours";
      const icon=it.type==="dispatch"?"🚚":"🧀", lab=it.type==="dispatch"?"Dispatch palette":"Découpe fromage";
      const pct=stx.total?Math.round(stx.done/stx.total*100):0;
      const clickable=it.type==="decoupe"?` style="cursor:pointer" onclick="openDecoupeDetail('${esc(s.id)}')" title="Voir le détail de cette découpe"`:"";
      return `<div class="rec ${draft?'draft':'valid'}"${clickable}>
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:start">
          <div><div style="font-weight:800;font-size:14px">${icon} ${esc(s.meta.supplier||lab)}</div>
          <div style="font-size:12px;color:#1a4d2e;font-weight:700">${lab} · 👤 ${esc(s.meta.createdBy||'—')}${stx.operators.length?(' · '+esc(stx.operators.join(', '))):''}</div></div>
          <span class="badge ${draft?'warn':'ok'}">${draft?'🟡 En cours':'✅ Terminé'}</span></div>
        <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
        <div style="font-size:12px;color:#666;margin-top:4px">${stx.done}/${stx.total} (${pct}%) · démarré ${esc(heure(it.sendTs))}${it.type==="decoupe"?' · 👁 cliquer pour le détail':''}</div></div>`;
    }
    const s=it.store||{}; const storeLabel=s.label||"";
    if(it.kind==="attente"){ const d=it.doc;

/* ==================== ONGLET COMMANDE À LA CENTRALE ==================== */
/* Lecture du projet CENTRALE (app Dispatch palette). Vue PAR FOURNISSEUR :
   commande passée à la centrale vs ce qui a été réellement dispatché en magasins,
   avec les écarts + motifs (CASSE FOURNISSEUR / DLC / NON RECU / CASSE / AUTRE),
   export .txt pour G5, et validation de la réception centrale. */
function cKeyOfLine(p,idx){ const a=(p.article||"").toString().trim(); return a?("a_"+a):("l_"+idx); }
function cEffQty(st,p,code){ if(st&&st.qtyStores&&st.qtyStores[code]!=null) return st.qtyStores[code]; return (p.stores&&p.stores[code])||0; }
function cSupKey(sup){ return String(sup||"FRS").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9_]/g,"_"); }
function centraleLines(sess){
  const products=(sess.meta&&sess.meta.products)||[];
  const stt=sess.state||{};
  const cols=(sess.meta&&sess.meta.storeColumns)||[];
  return products.map((p,idx)=>{
    const st=stt[cKeyOfLine(p,idx)]||{};
    const dispatched=cols.reduce((a,c)=>a+cEffQty(st,p,c.code),0);
    const commande=(p.recue!=null)?p.recue:Object.values(p.stores||{}).reduce((a,b)=>a+b,0);
    return { article:p.article||"", designation:p.designation, colisage:p.colisage||0, commande, dispatched, ecart:dispatched-commande, done:!!st.done, ecarts:st.ecarts||[] };
  });
}
function centraleSessions(){
  const out=[];
  Object.entries(centraleState.dispatch||{}).forEach(([sid,s])=>{ if(s&&s.meta&&s.meta.supplier) out.push(Object.assign({id:sid},s)); });
  out.sort((a,b)=>((b.meta.startedAt||0)-(a.meta.startedAt||0)));
  return out;
}
function centraleTxt(sess){
  const lines = centraleLines(sess);
  const out = [];
  lines.forEach(l=>{
    const code = String(l.article||"").trim();
    if(!code) return;                                   // pas de code => ligne ignorée (voir note EAN)
    const qty = (l.dispatched===0) ? 0 : l.commande;    // partiel = total ; 0 partout = 0
    out.push(code + "\t" + String(qty).replace(".",","));
  });
  return out.join("\r\n");
}
function dispatchStats(sess){
  const products=(sess.meta&&sess.meta.products)||[]; const stt=sess.state||{};
  let done=0; const ts=[]; const ops={};
  products.forEach((p,idx)=>{ const st=stt[cKeyOfLine(p,idx)]; if(st&&st.done){ done++; if(st.doneAt) ts.push(st.doneAt); if(st.doneBy) ops[st.doneBy]=(ops[st.doneBy]||0)+1; } });
  ts.sort((a,b)=>a-b);
  return { total:products.length, done, durationMs: ts.length?ts[ts.length-1]-ts[0]:0, operators:Object.keys(ops) };
}
function fmtDurMs(ms){ if(!ms) return "—"; const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60); if(h>0) return h+"h"+String(m%60).padStart(2,"0"); if(m>0) return m+" min"; return s+" s"; }
// Toutes les lignes en écart d'une session (écart quantité et/ou motif déclaré).
function sessionEcarts(sess){
  const lines=centraleLines(sess); const out=[];
  lines.forEach(l=>{
    if(l.ecarts&&l.ecarts.length){ l.ecarts.forEach(e=>out.push({ designation:l.designation, article:l.article, storeLabel:(e.storeLabel||e.store||""), reason:e.reason, reasonText:e.reasonText||"", planned:e.planned, real:e.real, fournisseur:!!e.fournisseur })); }
    else if(l.ecart!==0){ out.push({ designation:l.designation, article:l.article, storeLabel:"", reason:(l.ecart>0?"SURPLUS":"MANQUE"), reasonText:"", planned:l.commande, real:l.dispatched, fournisseur:false }); }
  });
  return out;
}
function ecartsTraite(sid){ return !!(centraleState.ecartsSuivi&&centraleState.ecartsSuivi[sid]&&centraleState.ecartsSuivi[sid].done); }
function markEcartsTraite(sid){ if(!dbCentrale) return; dbCentrale.ref("ecarts_suivi/"+sid).set({done:true,at:firebase.database.ServerValue.TIMESTAMP,by:ME_EMAIL}).catch(e=>alert("Erreur : "+e.message)); }
function unmarkEcartsTraite(sid){ if(!dbCentrale) return; dbCentrale.ref("ecarts_suivi/"+sid).remove().catch(e=>alert("Erreur : "+e.message)); }

/* ==================== INVENTAIRE VIN (console) ==================== */
// Données poussées par l'app « La Centrale » (module Inventaire vin) :
//   inventaire_vin/<id> : { meta:{label,startedAt,dateKey,createdBy,operatorCode,closed}, lines:{<key>:{ean,designation,cartons,bottles,units}}, validated:{at,by} }
// La console liste les inventaires du jour, montre le détail et génère le .txt (EAN / quantité) pour PROGMAG.
let invVinDate = null; // null = aujourd'hui (défaut) ; "" = toutes ; "YYYY-MM-DD" = date précise

function invVinSummary(v){
  const L=Object.values((v&&v.lines)||{}); let u=0,r=0;
  L.forEach(l=>{ const un=(l.units!=null?l.units:((l.cartons||0)*6+(l.bottles||0))); if(un>0)r++; u+=un; });
  return { refs:r, units:u };
}
function invVinListAll(){
  const all=centraleState.inventaireVin||{};
  return Object.entries(all).map(([id,v])=>Object.assign({id},v)).filter(v=>v.meta)
    .sort((a,b)=>((b.meta.startedAt||0)-(a.meta.startedAt||0)));
}
function invVinLines(v){
  return Object.entries((v&&v.lines)||{}).map(([k,l])=>Object.assign({key:k},l))
    // Décodage GS1 : les anciens scans QR contiennent le code complet (01…+lot) → on ré-extrait l'EAN-13.
    .map(l=>Object.assign({},l,{ ean: extractEan(l.ean), code:(l.code||""), units:(l.units!=null?l.units:((l.cartons||0)*6+(l.bottles||0))) }))
    .filter(l=>l.ean||l.code)
    .sort((a,b)=>((a.createdAt||0)-(b.createdAt||0)));
}
// .txt réception PROGMAG : "Code;quantité" (séparateur ; ASCII, fin de ligne CRLF).
// Code = EAN scanné si présent, sinon code article (lignes ciblées). En inventaire ciblé,
// les vins mis explicitement à 0 (counted) sont aussi exportés (code;0).
function invVinTxt(v){
  const out=[];
  invVinLines(v).forEach(l=>{ const c=l.ean||l.code; if(!c) return; if(!(l.units>0||l.counted)) return; out.push(String(c)+";"+String(l.units||0)); });
  return out.join("\r\n");
}

function kbgPoidsEffective(){

}

/* ===== Historique DÉCOUPE FROMAGE ===================================== */
// Doit refléter frKey() de l'app (clé par DÉSIGNATION normalisée), sinon le repli lit un état vide
// quand le récap n'est pas encore écrit (les fromages n'apparaissaient pas).
function decoupeProductKey(p, idx){ const d=norm((p&&p.designation)||"").replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,""); return d?("d_"+d):("l_"+idx); }
// Agrège une session de découpe : quantités KBG/ROB, poids, rendement, détail par fromage.
function decoupeAgg(sess){
  const ent=((sess.recap&&sess.recap.entity)||sess.meta.entity||"").toUpperCase();
  const r=sess.recap;
  if(r && (r.kbgN!=null||r.robN!=null||r.robMeules!=null)){
    const t=(r.kbgG||0)+(r.robG||0);
    return { entity:ent, kbgN:r.kbgN||0, kbgG:r.kbgG||0, robN:r.robN||0, robG:r.robG||0, robMeules:r.robMeules||0,
      rend:(r.rendement!=null?r.rendement:(t>0?Math.round((r.kbgG||0)/t*100):0)),
      rendPortions:(r.rendementPortions!=null?r.rendementPortions:null), kbgTheo:r.kbgTheo||0,
      lines:(r.lines||[]), by:r.by||sess.meta.createdBy||"", updatedAt:r.updatedAt||0,
      done:(r.done!=null?r.done:0), total:(sess.meta.products||[]).length, hasData:((r.kbgN||0)+(r.robN||0)+(r.robMeules||0))>0 };
  }
  const products=(sess.meta&&sess.meta.products)||[]; const stt=sess.state||{};
  let kbgN=0,kbgG=0,robN=0,robG=0,robMeules=0,done=0; const lines=[];
  products.forEach((p,idx)=>{ const st=stt[decoupeProductKey(p,idx)]||{};
    let k=0,kg=0,rr=0,rg=0,rm=0; const pieces=st.pieces||[];
    pieces.forEach(pc=>{ if(pc.dest==="KBG"){k++;kg+=(pc.w||0);}else{rr++;rg+=(pc.w||0);} });
    if(st.sticker){ const n=st.stickerCount||0; const w=(st.stickerWeight!=null&&st.stickerWeight!=="")?Number(st.stickerWeight):((p.poids||200)*n); if((st.magasin||"KBG")==="KBG"){k+=n;kg+=w;}else{rr+=n;rg+=w;} }
    if(st.rob){ const m=Number(st.rob.meules)||0, mc=Number(st.rob.morceaux)||0; const pu=(st.rob.poidsUnit!=null&&st.rob.poidsUnit!=="")?Number(st.rob.poidsUnit):(Number(p.poidsUnit)||0); rm+=m; rr+=mc; rg+=m*pu*1000; }
    if(st.done) done++;
    if(k+rr+rm>0) lines.push({ designation:p.designation, kbgN:k, kbgTarget:p.kbgTarget||0, robN:rr, kbgG:Math.round(kg), robG:Math.round(rg), robMeules:rm, robUnit:(st.rob&&st.rob.unit)||"meule" });
    kbgN+=k;kbgG+=kg;robN+=rr;robG+=rg;robMeules+=rm;
  });
  const t=kbgG+robG; const rend=t>0?Math.round(kbgG/t*100):0;
  return { entity:ent, kbgN,kbgG:Math.round(kbgG),robN,robG:Math.round(robG),robMeules,rend,rendPortions:null,kbgTheo:0,lines,by:sess.meta.createdBy||"",updatedAt:0,done,total:products.length,hasData:(kbgN+robN+robMeules)>0 };
}
function decoupeSessions(){
  const out=[];
  Object.entries(centraleState.decoupe||{}).forEach(([sid,s])=>{ if(s&&s.meta&&s.meta.startedAt) out.push(Object.assign({id:sid},s)); });

/* ===== Traçabilité fromage — correction du lieu par l'admin ===== */
// Toutes les étiquettes de traçabilité (decoupe/<sid>/tracabilite + tracabilite/<jour>).
function tracaAllEntries(){
  const out=[];
  Object.entries(centraleState.decoupe||{}).forEach(([sid,s])=>{
    const t=(s&&s.tracabilite)||{};
    Object.entries(t).forEach(([id,e])=>{ if(e&&typeof e==="object") out.push(Object.assign({ ref:"decoupe/"+sid+"/tracabilite/"+id, id }, e)); });
  });
  Object.entries(centraleState.tracabilite||{}).forEach(([dk,grp])=>{
    if(grp&&typeof grp==="object") Object.entries(grp).forEach(([id,e])=>{ if(e&&typeof e==="object") out.push(Object.assign({ ref:"tracabilite/"+dk+"/"+id, id }, e)); });
  });
  out.sort((a,b)=>(b.at||0)-(a.at||0));
  return out;
}
function frDateShort_(iso){ const p=String(iso||"").split("-"); return p.length===3?(p[2]+"/"+p[1]+"/"+p[0]):String(iso||""); }

  if(e.at){ return new Date(e.at).toLocaleDateString("fr-FR"); }

}

  if(!list.length){ alert("Aucune étiquette à synchroniser."); return; }
  const entries=list.map(e=>({ lot:e.lot||"", nom:e.nom||"", bl:e.bl||"", dlc:e.dlc||"", dlcWrite:e.dlcWrite||"", decoupeDate:jourFromEntry(e), magasin:e.magasin||"", photoUrl:e.photoUrl||"" }));
  if(btn){ btn.disabled=true; btn.textContent="Synchronisation…"; }
  try{
    const r=await fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"rebuild-traca-lots",idToken:ID_TOKEN,entries})});
    const j=await r.json();
    if(j&&j.ok) alert("✓ Tableau lots resynchronisé ("+j.lots+" lot(s)).");
    else alert("Erreur : "+((j&&j.error)||"réponse inattendue")+"\\n\\n(Le case rebuild-traca-lots est-il ajouté et l'Apps Script redéployé ?)");
  }catch(e){ alert("Erreur réseau : "+e.message); }
  if(btn){ btn.disabled=false; btn.textContent="⟳ Resynchroniser le tableau lots"; }
}

// Clé de jour ISO (yyyy-mm-dd) à partir d'un timestamp, et pour une session de découpe.
function isoDayKey(ts){ const d=new Date(ts||0); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function decoupeDayKeyC(s){ return isoDayKey((s&&s.meta&&s.meta.startedAt)||0); }
// Agrégat CONSOLIDÉ d'une journée : fusionne toutes les sessions du jour (KBG + ROB) par fromage.
function dayDecoupeAggC(sessions){
  const kbgMap={}, robMap={}; let kbgN=0,kbgG=0,kbgTheo=0,kbgMontG=0,robMeules=0,robN=0,robG=0;
  (sessions||[]).forEach(s=>{ const a=decoupeAgg(s); const ent=(a.entity||"").toUpperCase();
    const routeRob = ent==="ROB" ? true : (ent==="KBG" ? false : null);
    (a.lines||[]).forEach(l=>{ const key=norm(l.designation||"")||"?";
      const isRob = routeRob!=null ? routeRob : (((l.kbgN||0)===0) && (((l.robN||0)>0) || ((l.robMeules||0)>0)));
      if(isRob){ const m=robMap[key]||(robMap[key]={designation:l.designation||"",robMeules:0,robN:0,robG:0,robUnit:l.robUnit||"meule"});
        m.robMeules+=(l.robMeules||0); m.robN+=(l.robN||0); m.robG+=(l.robG||0); robMeules+=(l.robMeules||0); robN+=(l.robN||0); robG+=(l.robG||0); }
      else { const m=kbgMap[key]||(kbgMap[key]={designation:l.designation||"",kbgN:0,kbgG:0,theo:0,montG:0});
        const th=(l.kbgTheo!=null?l.kbgTheo:(l.theo||0));
        m.kbgN+=(l.kbgN||0); m.kbgG+=(l.kbgG||0); m.theo+=th; m.montG+=(l.robG||0);
        kbgN+=(l.kbgN||0); kbgG+=(l.kbgG||0); kbgTheo+=th; kbgMontG+=(l.robG||0); }
    });
  });
  const kbgLines=Object.values(kbgMap).map(m=>({ ...m, rend:(m.theo>0?Math.round(m.kbgN/m.theo*100):null) })).sort((a,b)=>a.designation.localeCompare(b.designation,"fr"));
  const robLines=Object.values(robMap).sort((a,b)=>a.designation.localeCompare(b.designation,"fr"));
  return { kbgLines, robLines, kbgN, kbgG, kbgTheo, kbgMontG, robMeules, robN, robG,
           rendPortions:(kbgTheo>0?Math.round(kbgN/kbgTheo*100):null), hasKbg:kbgLines.length>0, hasRob:robLines.length>0 };
}
function decoupeSessionsOfDay(dayKey){ return decoupeSessions().filter(s=>decoupeDayKeyC(s)===dayKey); }
// Détail consolidé d'une journée : chaque fromage (KBG et ROB) de toutes les sessions du jour.
function openDecoupeDayDetail(dayKey){
  const sess=decoupeSessionsOfDay(dayKey); if(!sess.length) return; const ag=dayDecoupeAggC(sess);
  const kg=ag.robG>0?(Math.round(ag.robG/1000*10)/10):0;
  let body="";
  if(ag.hasKbg){
    body+=`<h3 style="margin:12px 0 6px;font-size:15px;color:#1565c0">🔵 Kelbongoo — ${ag.kbgN} portions${ag.kbgTheo>0?(' / '+ag.kbgTheo+' théo.'):''}${ag.rendPortions!=null?(' · rendement '+ag.rendPortions+'%'):''}</h3>`;
    body+=`<div style="overflow:auto"><table><thead><tr><th>Fromage</th><th>Portions</th><th>Théo.</th><th>Rend.</th><th>Hors gabarit → Montreuil</th></tr></thead><tbody>`;
    body+=ag.kbgLines.map(l=>`<tr><td>${esc(l.designation)}</td><td style="text-align:center">${l.kbgN}</td><td style="text-align:center">${l.theo||"—"}</td><td style="text-align:center">${l.rend!=null?(l.rend+"%"):"—"}</td><td style="text-align:center">${l.montG>0?(Math.round(l.montG/1000*10)/10+" kg"):"—"}</td></tr>`).join("");
    body+=`</tbody></table></div>`;
  }
  if(ag.hasRob){
    body+=`<h3 style="margin:14px 0 6px;font-size:15px;color:#6a1b9a">🟣 Montreuil (Robespierre) — ${ag.robMeules} meule(s)/colis · ${ag.robN} morceaux${kg>0?(" · ≈ "+kg+" kg"):""}</h3>`;
    body+=`<div style="overflow:auto"><table><thead><tr><th>Fromage</th><th>Meules/colis</th><th>Morceaux</th><th>Poids approx.</th></tr></thead><tbody>`;
    body+=ag.robLines.map(l=>`<tr><td>${esc(l.designation)}</td><td style="text-align:center">${l.robMeules} ${l.robUnit==="colis"?"colis":"meule(s)"}</td><td style="text-align:center">${l.robN}</td><td style="text-align:center">${l.robG>0?(Math.round(l.robG/1000*10)/10+" kg"):"—"}</td></tr>`).join("");
    body+=`</tbody></table></div>`;
  }
  if(!ag.hasKbg && !ag.hasRob) body='<div class="muted">Aucune découpe saisie ce jour.</div>';
  const sentBy=sess.map(s=>s.recap&&s.recap.daySentAt?(s.recap.daySentBy||""):null).filter(Boolean)[0];
  const back=document.createElement("div"); back.className="modal-back";
  back.innerHTML=`<div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0;font-size:17px">Découpe du ${esc(dateShort(sess[0].meta.startedAt))}</h2><button class="btn" style="background:#eef2f7" onclick="this.closest('.modal-back').remove()">Fermer</button></div>
    <div class="muted" style="margin:4px 0 10px">${sess.length} découpe(s) ce jour · ${sentBy?("récap envoyé par "+esc(sentBy)):"récap pas encore envoyé"}</div>
    ${body}
    <button class="btn btn-green btn-lg" style="margin-top:14px" onclick="dlDecoupeDayTxt('${dayKey}')">⬇️ Télécharger le .txt du jour</button>
  </div>`;
  back.onclick=(e)=>{ if(e.target===back) back.remove(); };
  document.body.appendChild(back);
}
function dlDecoupeDayTxt(dayKey){
  const sess=decoupeSessionsOfDay(dayKey); if(!sess.length) return; const ag=dayDecoupeAggC(sess);
  const kg=ag.robG>0?(Math.round(ag.robG/1000*10)/10):0;
  let txt="LA CENTRALE PDP — Récap découpe du jour "+dateShort(sess[0].meta.startedAt)+"\n"+sess.length+" découpe(s)\n";
  if(ag.hasKbg){
    txt+="\n== KELBONGOO =="+"\nRendement : "+(ag.rendPortions!=null?ag.rendPortions+"%":"—")+" · "+ag.kbgN+" portions"+(ag.kbgTheo>0?(" / "+ag.kbgTheo+" théo."):"")+"\n";
    txt+="Fromage\tPortions\tThéo\tRend\tHors gabarit (kg)\n";
    ag.kbgLines.forEach(l=>{ txt+=(l.designation||"")+"\t"+l.kbgN+"\t"+(l.theo||"")+"\t"+(l.rend!=null?l.rend+"%":"")+"\t"+(l.montG>0?Math.round(l.montG/1000*10)/10:"")+"\n"; });
  }
  if(ag.hasRob){
    txt+="\n== MONTREUIL (Robespierre) =="+"\n"+ag.robMeules+" meule(s)/colis · "+ag.robN+" morceaux"+(kg>0?(" · ≈ "+kg+" kg"):"")+"\n";
    txt+="Fromage\tMeules/colis\tMorceaux\tPoids approx (kg)\n";
    ag.robLines.forEach(l=>{ txt+=(l.designation||"")+"\t"+l.robMeules+" "+(l.robUnit==="colis"?"colis":"meule")+"\t"+l.robN+"\t"+(l.robG>0?Math.round(l.robG/1000*10)/10:"")+"\n"; });
  }
  const d=new Date(sess[0].meta.startedAt||Date.now());
  const yy=String(d.getFullYear()).slice(-2),mm=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");
  downloadTxt(yy+mm+dd+"_DECOUPE_JOUR.txt", txt);
}

function renderDecoupeHisto(el, bar){
  let list=decoupeSessions();
  if(dpDecoupeSearch){ const q=norm(dpDecoupeSearch); list=list.filter(s=>norm(s.meta.supplier).includes(q)||norm(s.meta.createdBy).includes(q)||norm(s.meta.docNumber||"").includes(q)); }
  if(dpDecoupeDate){ list=list.filter(s=>{ const d=new Date(s.meta.startedAt||0); const iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); return iso===dpDecoupeDate; }); }
  const card=(s)=>{ const a=decoupeAgg(s); const isRob=a.entity==="ROB"; const kg=a.robG>0?(Math.round(a.robG/1000*10)/10):0;
    const rShown=(a.rendPortions!=null?a.rendPortions:a.rend); const rendOk=rShown>=85;
    const metrics = isRob
      ? `<span class="badge" style="background:#f3e5f5;color:#6a1b9a">Robespierre <b>${a.robMeules}</b> meule(s)/colis · <b>${a.robN}</b> morceaux${kg>0?(' · ≈ '+kg+' kg'):''}</span>`
      : `<span class="badge" style="background:#e3f2fd;color:#1565c0">Kelbongoo <b>${a.kbgN}</b> portions${a.kbgTheo>0?(' / '+a.kbgTheo+' théo.'):''}</span>
         <span class="badge" style="background:#f3e5f5;color:#6a1b9a">→ Montreuil <b>${kg}</b> kg</span>
         <span style="font-weight:800;color:${rendOk?'#2e7d32':'#e65100'}">Rendement ${rShown}%</span>`;
    return `<div class="rec valid" style="border-color:#e0c48a">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
        <div style="font-weight:800;font-size:15px">🧀 ${esc(s.meta.supplier||'Découpe')} <span class="badge" style="background:${isRob?'#f3e5f5':'#e3f2fd'};color:${isRob?'#6a1b9a':'#1565c0'}">${isRob?'Montreuil':'Kelbongoo'}</span></div>
        <div style="font-size:12px;color:#999">${esc(dateShort(s.meta.startedAt))} ${esc(heure(s.meta.startedAt))}</div></div>
      <div style="font-size:12px;color:#666;margin:2px 0 6px">👤 ${esc(a.by||s.meta.createdBy||'—')}${s.meta.docNumber?(' · BL '+esc(s.meta.docNumber)):''}${s.meta.deliveryDate?(' · récep. prévue '+esc(s.meta.deliveryDate)):''}</div>
      <div style="display:flex;gap:14px;font-size:13px;flex-wrap:wrap;align-items:center">
        ${metrics}
        <span style="color:#888">${a.done}/${a.total} fromages</span>
      </div>
      ${a.hasData?'':'<div style="font-size:12px;color:#c62828;margin-top:6px">Aucune découpe saisie pour l\'instant.</div>'}
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn btn-primary" style="padding:8px 12px;font-size:13px" onclick="openDecoupeDetail('${esc(s.id)}')">👁 Détail par fromage</button>
        <button class="btn" style="background:#eef2f7;padding:8px 12px;font-size:13px" onclick="dlDecoupeTxt('${esc(s.id)}')">⬇️ .txt</button>
        <button class="btn" style="background:#fdecea;color:#c62828;padding:8px 12px;font-size:13px" onclick="deleteDecoupeSession('${esc(s.id)}','${esc((s.meta.supplier||'Découpe').replace(/'/g,''))}')">🗑 Supprimer</button>
      </div></div>`; };
  // Regroupement par JOURNÉE. Aujourd'hui déplié, les autres jours repliés. Par défaut : mois en cours ;
  // les mois précédents se consultent via le filtre Date (calendrier).
  const todayIso=isoDayKey(Date.now()); const curMonth=todayIso.slice(0,7);
  const groups={}; list.forEach(s=>{ const k=decoupeDayKeyC(s); (groups[k]=groups[k]||[]).push(s); });
  const allDays=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  const shownDays = dpDecoupeDate ? allDays.filter(k=>k===dpDecoupeDate) : allDays.filter(k=>k.slice(0,7)===curMonth);
  const olderCount = allDays.length - shownDays.length;
  const dayBlock=(k)=>{ const sess=groups[k]; const ag=dayDecoupeAggC(sess);
    const rShown=(ag.rendPortions!=null?ag.rendPortions:0); const rendOk=rShown>=85;
    const kg=ag.robG>0?(Math.round(ag.robG/1000*10)/10):0;
    const sum=[];
    if(ag.hasKbg) sum.push(`<span class="badge" style="background:#e3f2fd;color:#1565c0">Kelbongoo <b>${ag.kbgN}</b> portions${ag.kbgTheo>0?(' / '+ag.kbgTheo+' théo.'):''}</span>`+(ag.rendPortions!=null?(' <span style="font-weight:800;color:'+(rendOk?'#2e7d32':'#e65100')+'">Rendement '+rShown+'%</span>'):''));
    if(ag.hasRob) sum.push(`<span class="badge" style="background:#f3e5f5;color:#6a1b9a">Montreuil <b>${ag.robMeules}</b> meule(s)/colis · <b>${ag.robN}</b> morceaux${kg>0?(' · ≈ '+kg+' kg'):''}</span>`);
    const sentBadge = sess.some(s=>s.recap&&s.recap.daySentAt) ? '<span class="badge ok">✓ récap envoyé</span>' : '<span class="badge warn">récap non envoyé</span>';
    const open = (k===todayIso)?' open':'';
    return `<details${open} style="margin:10px 0;border:1px solid #e0c48a;border-radius:10px;padding:8px 12px;background:#fffdf7">
        <summary style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
          <span style="font-size:15px;font-weight:900;color:#8a5a00">📅 ${esc(dateShort(sess[0].meta.startedAt))} <span style="font-size:12px;color:#777;font-weight:600">· ${sess.length} découpe(s)</span></span>
          ${sentBadge}
        </summary>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0">${sum.join(" ")||'<span class="muted" style="font-size:12px">Aucune découpe saisie.</span>'}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
          <button class="btn btn-primary" style="padding:8px 12px;font-size:13px" onclick="openDecoupeDayDetail('${k}')">👁 Détail de la journée (tous les fromages)</button>
          <button class="btn" style="background:#eef2f7;padding:8px 12px;font-size:13px" onclick="dlDecoupeDayTxt('${k}')">⬇️ .txt du jour</button>
        </div>
        <div class="live-grid">${sess.map(card).join("")}</div>
      </details>`; };
  const olderNote = (!dpDecoupeDate && olderCount>0) ? `<div class="muted" style="margin:6px 0 12px;font-size:12px">➕ ${olderCount} jour(s) de mois précédents masqués — utilise le filtre <b>Date</b> ci-dessus pour les afficher.</div>` : '';
  el.innerHTML=bar+`<p class="muted" style="margin-top:0">Historique découpe, <b>par journée</b> (aujourd'hui ouvert, les autres jours à déplier). Par défaut le <b>mois en cours</b> ; les mois précédents via le filtre Date.</p>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
      <input placeholder="🔎 fournisseur, opérateur, n° BL…" style="flex:1;min-width:180px" value="${esc(dpDecoupeSearch)}" oninput="dpDecoupeSearch=this.value;renderCentrale()"/>
      <span><b>Date :</b></span><input type="date" value="${esc(dpDecoupeDate)}" onchange="dpDecoupeDate=this.value;renderCentrale()"/>
      <button class="btn" style="background:#eef2f7;color:#333;padding:8px 12px;font-size:13px" onclick="dpDecoupeDate='';dpDecoupeSearch='';renderCentrale()">✕</button>
    </div>${olderNote}
    ${shownDays.length?shownDays.map(dayBlock).join(""):'<div class="muted">Aucune découpe '+(dpDecoupeDate?'à cette date':'ce mois-ci')+'.</div>'}`;
}
function openDecoupeDetail(sid){
  const s=(centraleState.decoupe||{})[sid]; if(!s) return; const sess=Object.assign({id:sid},s); const a=decoupeAgg(sess); const isRob=a.entity==="ROB";
  const kg=a.robG>0?(Math.round(a.robG/1000*10)/10):0;
  const head=isRob
    ? `<tr><th>Fromage</th><th>Découpé</th><th>Morceaux</th><th>Poids approx.</th></tr>`
    : `<tr><th>Fromage</th><th>KBG pc</th><th>KBG poids</th><th>→ ROB pc</th><th>ROB poids</th></tr>`;
  const rows=(a.lines||[]).map(l=>{ const lkg=(l.robG||0)>0?(Math.round((l.robG||0)/1000*10)/10+' kg'):'—';
    return isRob
      ? `<tr><td>${esc(l.designation||'')}</td><td style="text-align:center">${l.robMeules||0} ${l.robUnit==='colis'?'colis':'meule(s)'}</td><td style="text-align:center">${l.robN||0}</td><td style="text-align:center">${lkg}</td></tr>`
      : `<tr><td>${esc(l.designation||'')}</td><td style="text-align:center">${l.kbgN||0}${l.kbgTarget>0?(' / '+l.kbgTarget):''}</td><td style="text-align:center">${Math.round(l.kbgG||0)} g</td><td style="text-align:center">${l.robN||0}</td><td style="text-align:center">${Math.round(l.robG||0)} g</td></tr>`;
  }).join("");
  const colspan=isRob?4:5;
  const summary=isRob
    ? `${a.robMeules} meule(s)/colis · ${a.robN} morceaux${kg>0?(' · ≈ '+kg+' kg'):''}`
    : `Rendement <b>${a.rend}%</b> · KBG ${a.kbgN} pc / ROB ${a.robN} pc`;
  const back=document.createElement("div"); back.className="modal-back";
  back.innerHTML=`<div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0;font-size:17px">Découpe ${isRob?'Montreuil':'Kelbongoo'} · ${esc(sess.meta.supplier||'')}</h2><button class="btn" style="background:#eef2f7" onclick="this.closest('.modal-back').remove()">Fermer</button></div>
    <div class="muted" style="margin:4px 0 10px">${esc(dateShort(sess.meta.startedAt))} · ${esc(a.by||sess.meta.createdBy||'—')} · ${summary}</div>
    <div style="overflow:auto;max-height:60vh"><table><thead>${head}</thead><tbody>${rows||('<tr><td colspan="'+colspan+'" style="color:#999">Aucune découpe saisie.</td></tr>')}</tbody></table></div>
    <button class="btn btn-green btn-lg" style="margin-top:14px" onclick="dlDecoupeTxt('${esc(sid)}')">⬇️ Télécharger le .txt</button>
  </div>`;
  back.onclick=(e)=>{ if(e.target===back) back.remove(); };
  document.body.appendChild(back);
}
function dlDecoupeTxt(sid){
  const s=(centraleState.decoupe||{})[sid]; if(!s) return; const sess=Object.assign({id:sid},s); const a=decoupeAgg(sess); const isRob=a.entity==="ROB";
  const kg=a.robG>0?(Math.round(a.robG/1000*10)/10):0;
  let txt="LA CENTRALE PDP — Découpe fromage "+(isRob?"MONTREUIL (Robespierre)":"KELBONGOO")+"\n";
  txt+=(sess.meta.supplier||"")+"\n"+dateShort(sess.meta.startedAt)+" "+heure(sess.meta.startedAt)+"\n";
  if(sess.meta.docNumber) txt+="BL : "+sess.meta.docNumber+"\n";
  txt+="Opérateur : "+(a.by||sess.meta.createdBy||"-")+"\n";
  if(isRob){
    txt+="Total : "+a.robMeules+" meule(s)/colis · "+a.robN+" morceaux"+(kg>0?(" · ≈ "+kg+" kg"):"")+"\n";
    txt+="\nFromage\tMeules/colis\tMorceaux\tPoids approx (kg)\n";
    (a.lines||[]).forEach(l=>{ const lkg=(l.robG||0)>0?(Math.round((l.robG||0)/1000*10)/10):""; txt+=(l.designation||"")+"\t"+(l.robMeules||0)+" "+((l.robUnit==="colis")?"colis":"meule")+"\t"+(l.robN||0)+"\t"+lkg+"\n"; });
  } else {
    txt+="Rendement Kelbongoo : "+a.rend+"%\n";
    txt+="Total KBG : "+a.kbgN+" pc / "+a.kbgG+" g   -   Hors gabarit → ROB : "+a.robN+" pc / "+a.robG+" g\n";
    txt+="\nFromage\tKBG pc\tKBG g\tROB pc\tROB g\n";
    (a.lines||[]).forEach(l=>{ txt+=(l.designation||"")+"\t"+(l.kbgN||0)+"\t"+Math.round(l.kbgG||0)+"\t"+(l.robN||0)+"\t"+Math.round(l.robG||0)+"\n"; });

  const d=new Date(sess.meta.startedAt||Date.now());
  const yy=String(d.getFullYear()).slice(-2),mm=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");
  downloadTxt(yy+mm+dd+"_DECOUPE_"+(a.entity||sess.meta.entity||"")+".txt", txt);
}
