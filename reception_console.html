<head>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4f5f7;color:#1a1a1a;font-size:15px}
  .header{background:#1a4d2e;color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center}
  .header h1{margin:0;font-size:19px}
  .header .sub{font-size:12px;opacity:.85}
  .wrap{max-width:1280px;margin:0 auto;padding:18px 22px 60px}
  #gate{max-width:440px;margin:60px auto;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.08);padding:26px;text-align:center}
  .muted{color:#888;font-size:13px;line-height:1.5}
  .err{color:#d32f2f;font-size:13px;margin-top:8px}
  .ok{color:#2e7d32;font-size:13px;margin-top:6px}
  .hidden{display:none}
  /* Tabs */
  .tabs{display:flex;gap:6px;border-bottom:2px solid #e6e8ec;margin-bottom:18px;flex-wrap:wrap}
  .tab{padding:12px 20px;background:none;border:none;font-size:15px;font-weight:700;color:#777;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
  .tab.active{color:#1a4d2e;border-bottom-color:#1a4d2e}
  /* Boutons */
  button.btn{padding:12px 18px;font-size:15px;font-weight:700;border:none;border-radius:8px;cursor:pointer}
  .btn-primary{background:#1a4d2e;color:#fff}
  .btn-primary:disabled{background:#aaa;cursor:default}
  .btn-green{background:#2e7d32;color:#fff}
  .btn-lg{padding:16px 24px;font-size:16px}
  input,select,textarea{font-family:inherit;font-size:15px;padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;background:#fff}
  input:focus,select:focus,textarea:focus{outline:none;border-color:#1a4d2e}
  label{font-size:12px;font-weight:700;color:#555;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
  /* Grille magasins */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .store-card{background:#fff;border:1.5px solid #e6e8ec;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .store-card h3{margin:0;font-size:16px;color:#1a4d2e;display:flex;justify-content:space-between;align-items:center}
  .store-card.nocfg{opacity:.55}
  .drop{border:2px dashed #1a4d2e;border-radius:10px;padding:16px;text-align:center;background:#f4f9f5;cursor:pointer;font-size:14px}
  .drop:hover{background:#e9f2ec}
  .drop.has{border-style:solid;background:#e8f5e9}
  .field{margin-bottom:4px}
  .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
  .badge.ok{background:#e8f5e9;color:#2e7d32}
  .badge.warn{background:#fff3e0;color:#e65100}
  .badge.info{background:#eef2f7;color:#555}
  .parse-note{font-size:12px;color:#555;background:#f7f9f7;border-radius:6px;padding:6px 8px}
  .bar{position:sticky;bottom:0;background:#fff;border-top:1px solid #e6e8ec;padding:14px 22px;margin:22px -22px -60px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 -2px 8px rgba(0,0,0,.05)}
  /* Suivi live */
  .live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .rec{border:1.5px solid #e6e8ec;border-radius:10px;padding:12px;margin-bottom:10px}
  .rec.draft{background:#fff8e1;border-color:#ffb300}
  .rec.valid{background:#e8f5e9;border-color:#4caf50}
  .rec.expired{background:#f4f5f7;border-color:#ccc;opacity:.75}
  .pbar{background:#e6e8ec;height:9px;border-radius:5px;overflow:hidden;margin-top:8px}
  .pfill{height:100%;background:#4caf50}
  .since{font-variant-numeric:tabular-nums;font-weight:700;color:#e65100}
  .card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);padding:20px;max-width:640px}
  .dot{width:7px;height:7px;border-radius:50%;background:#e53935;display:inline-block;animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.2}}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}

  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal-box{background:#fff;border-radius:12px;padding:20px;max-width:780px;width:100%;max-height:92vh;overflow:auto}

  .update-bar button{background:#fff;color:#c62828;font-weight:800;padding:6px 14px;border-radius:6px;font-size:13px;border:none;cursor:pointer}

<script>
/* =========================== CONFIGURATION =========================== */
// Version de l'app (voir VERSIONS.md). Comparée à get-version pour proposer la MAJ.
const APP_VERSION = "1.4.0";
const OAUTH_CLIENT_ID = "757658680772-ogalpu5olqd2fiovnbnj55j1g0lbq7rr.apps.googleusercontent.com";
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzSMWziEuPvxY6UvM6FimJlFCTE1v9u1mWh3gJXbOtMVlHcb478_gASeIwZ1PMEw7-2Sw/exec";
// Un objet par magasin. Colle la config Firebase de CHAQUE magasin (comme dans son index.html).
// Laisse firebaseConfig vide ({}) pour un magasin pas encore prêt.
const STORES = [
  { code:"ROBESPIERRE", label:"Pribon Robespierre", firebaseConfig:{

apiKey: "AIzaSyAe-oMdObRk0_JSMHK7F4Mgqo7yMrHEK5g",

  authDomain: "robespierre-65cdf.firebaseapp.com",

  databaseURL: "https://robespierre-65cdf-default-rtdb.europe-west1.firebasedatabase.app",

  projectId: "robespierre-65cdf",

  appId: "1:870656040014:web:8a33269cc4bc348145771f"

  } },
  { code:"TOLBIAC",     label:"Pribon Tolbiac",     firebaseConfig:{ } },

  
  { code:"BICHAT",      label:"Pribon Bichat",      firebaseConfig:{

 apiKey: "AIzaSyDuWxm_3ZSnhF5NNmJIBuBHsKVZOvwSxJI",

    authDomain: "bichat-80d62.firebaseapp.com",

    databaseURL: "https://bichat-80d62-default-rtdb.europe-west1.firebasedatabase.app",

    projectId: "bichat-80d62",


appId: "1:230290923547:web:620b87f707d8883fd1d8be"

    


    
  } },
  { code:"BELLEVILLE",  label:"Pribon Belleville",  firebaseConfig:{ } }
];
// Firebase du projet CENTRALE (app Dispatch palette « LA CENTRALE PDP »).
// Lecture seule des commandes dispatchées (nœud "dispatch") + écriture du suivi de réception centrale.
const CENTRALE_FIREBASE_CONFIG = {
  apiKey: "AIzaSyDtcoRoknYM4JrJJfcuhpnVMeS-OurwYdU",
  authDomain: "kelbongoo-prep.firebaseapp.com",
  databaseURL: "https://kelbongoo-prep-default-rtdb.firebaseio.com",
  projectId: "kelbongoo-prep",
  storageBucket: "kelbongoo-prep.firebasestorage.app",
  messagingSenderId: "596701505006",
  appId: "1:596701505006:web:3f2f8d3f0f43ca828e5aff"
};
/* =================================================================== */

let ID_TOKEN=null;
let ME_EMAIL="";
const dbByStore={};      // code -> firebase database
const names={};          // operatorCode -> "Prénom Nom"
const state={};          // code -> { receptions, docs, broadcasts }
let pendingNames=false;
let msgStore=null;       // magasin sélectionné dans l'onglet Messages
let avoirView="magasin", avoirStatut="", avoirDate=""; // onglet Suivi des avoirs
let dbCentrale=null;                       // Firebase du projet CENTRALE (app Dispatch)
const centraleState={ dispatch:{}, reception:{} };
let centraleView="todo";                   // onglet Commande à la centrale : todo | done
let FOURNS=[];           // répertoire fournisseurs (nom + email litiges)
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function norm(s){ return (s||"").toString().normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim(); }
function toNum(s){ if(s==null) return 0; const n=parseFloat(String(s).replace(/\s/g,"").replace(",",".")); return isNaN(n)?0:n; }
/* --- écarts / avoirs (v1.2) --- */
const MOTIF_LABELS={ mauvaise_qte:"Mauvaise quantité", casse_fournisseur:"Casse fournisseur", auto_conso:"Auto-consommation", casse_salarie:"Casse (salarié)", delotage:"Délotage", perime_perte:"Périmé / perte" };
function motifLabel(k){ return MOTIF_LABELS[k]||k||"écart"; }
function recLineArr(r){ return Object.values((r&&r.lines)||{}); }
function recEcartLines(r){ return recLineArr(r).filter(s=>s && (s.status==='ecart'||s.status==='nonrecu')); }
function recAvoirLines(r){ return recLineArr(r).filter(s=>s && s.avoir===true); }

/* ============================ VERSION / MAJ ============================ */
function isNewer(a,b){
  const pa=String(a).split(".").map(n=>parseInt(n,10)||0), pb=String(b).split(".").map(n=>parseInt(n,10)||0);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){ const x=pa[i]||0,y=pb[i]||0; if(y>x)return true; if(y<x)return false; }
  return false;
}
function reloadToLatest(latest){ try{ const u=new URL(location.href); u.searchParams.set("v",latest||String(Date.now())); location.replace(u.toString()); }catch(e){ location.reload(); } }
function showUpdateBar(latest){
  if(document.getElementById("updbar")) return;
  const d=document.createElement("div"); d.className="update-bar"; d.id="updbar";
  d.innerHTML='<span>Nouvelle version '+esc(latest)+' disponible</span>';
  const b=document.createElement("button"); b.textContent="Mettre à jour"; b.onclick=()=>reloadToLatest(latest);
  d.appendChild(b); document.body.appendChild(d);
}
function checkVersion(){
  fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"get-version"})})
    .then(r=>r.json()).then(j=>{ if(j&&j.version&&isNewer(APP_VERSION,j.version)) showUpdateBar(j.version); }).catch(()=>{});
}

/* ============================ AUTH ============================ */
function onCredential(resp){
  ID_TOKEN=resp.credential;
  fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action:"verify-responsable",idToken:ID_TOKEN})})
    .then(r=>r.json()).then(j=>{
      if(j&&j.allowed){ start(j.email); }
      else document.getElementById("gateErr").textContent="Accès refusé : "+((j&&j.email)||"")+" n'est pas autorisé.";
    }).catch(e=>document.getElementById("gateErr").textContent="Erreur : "+e.message);
}
window.onload=function(){
  if(OAUTH_CLIENT_ID.indexOf("__")!==-1){ document.getElementById("gateErr").textContent="Renseigne OAUTH_CLIENT_ID et APPS_SCRIPT_URL en haut du fichier."; return; }
  document.querySelector(".header .sub").textContent="Suivi & chargement BL + commande · tous les magasins · v"+APP_VERSION;
  checkVersion(); setInterval(checkVersion, 10*60*1000);
  const t=setInterval(()=>{ if(window.google&&google.accounts&&google.accounts.id){ clearInterval(t);
    google.accounts.id.initialize({client_id:OAUTH_CLIENT_ID,callback:onCredential});
    google.accounts.id.renderButton(document.getElementById("gbtn"),{theme:"filled_blue",size:"large",text:"signin_with"});
  }},150);
};

const readyStores=()=>STORES.filter(s=>s.firebaseConfig&&s.firebaseConfig.databaseURL);

function start(email){
  ME_EMAIL=email;
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("whoami").textContent=email;
  // Init une app Firebase par magasin configuré
  readyStores().forEach(s=>{
    try{
      const appF=firebase.initializeApp(s.firebaseConfig, s.code);
      dbByStore[s.code]=firebase.database(appF);
      state[s.code]={receptions:{},docs:{},broadcasts:{}};
    }catch(e){ console.error("Firebase "+s.code, e); }
  });
  // Connexion au projet CENTRALE (app Dispatch palette) — lecture des commandes dispatchées.
  try{
    const appC=firebase.initializeApp(CENTRALE_FIREBASE_CONFIG,"CENTRALE");
    dbCentrale=firebase.database(appC);
    dbCentrale.ref("dispatch").on("value",snap=>{ centraleState.dispatch=snap.val()||{}; renderCentrale(); });
    dbCentrale.ref("centrale_reception").on("value",snap=>{ centraleState.reception=snap.val()||{}; renderCentrale(); });
  }catch(e){ console.error("Firebase CENTRALE", e); }
  // Onglets
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
  renderMulti(); renderSimple(); renderMsg();
  apiRP("get-fournisseurs").then(j=>{ if(j&&j.fournisseurs) FOURNS=j.fournisseurs; }).catch(()=>{});
  // Écouteurs live : réceptions + documents + messages de chaque magasin
  readyStores().forEach(s=>{ const db=dbByStore[s.code]; if(!db) return;
    db.ref("receptions").on("value",snap=>{ state[s.code].receptions=snap.val()||{}; queueNames(); renderSuivi(); renderG5(); renderArchives(); renderAvoirs(); });
    db.ref("documents").on("value",snap=>{ state[s.code].docs=snap.val()||{}; renderSuivi(); renderG5(); renderArchives(); });
    db.ref("broadcasts").on("value",snap=>{ state[s.code].broadcasts=snap.val()||{}; queueNames(); renderMsg(); });
  });
  renderG5(); renderArchives();
  setInterval(renderSuivi,1000);
}
function switchTab(t){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));
  ["multi","simple","g5","centrale","avoirs","archives","suivi","msg","fourn"].forEach(x=>document.getElementById("tab-"+x).classList.toggle("hidden",x!==t));
  if(t==="avoirs") renderAvoirs();
  if(t==="centrale") renderCentrale();
  if(t==="fourn") renderFournisseurs();
}
/* Appel Apps Script authentifié (idToken responsable). */
async function apiRP(action, extra){
  const r=await fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(Object.assign({action, idToken:ID_TOKEN}, extra||{}))});
  return await r.json();
}

/* ============================ PARSEURS ============================ */
function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return {docNumber:"",supplier:"",lines:[]};
  const head=lines[0].split(";").map(h=>norm(h));
  const col=(names)=>{ for(const n of names){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
  const iType=col(["type de piece"]),iDoc=col(["numero piece"]),iEan=col(["ean"]),iRef=col(["reference"]),
        iDes=col(["designation"]),iQte=col(["qte","qte "]),iMar=col(["marque"]),iComm=col(["commentaire"]),
        iFam=col(["famille"]),iRay=col(["rayon"]);
  const out=[]; let docNumber="";
  for(let r=1;r<lines.length;r++){
    const c=lines[r].split(";"); if(c.length<3) continue;
    const type=(iType>=0?c[iType]:"").trim(), article=(iRef>=0?c[iRef]:"").trim(), des=(iDes>=0?c[iDes]:"").trim();
    if(!article&&!des) continue;
    const nonLivre=/non\s*livr/i.test(type);
    if(iDoc>=0&&c[iDoc]&&!docNumber&&!nonLivre) docNumber=c[iDoc].trim();
    const fam=(iFam>=0?c[iFam]:"").trim(), ray=(iRay>=0?c[iRay]:"").trim();
    out.push({ article, ean:(iEan>=0?c[iEan]:"").trim().replace(/^0+(?=\d)/,""), designation:des,
      marque:(iMar>=0?c[iMar]:"").trim(), attendu:toNum(iQte>=0?c[iQte]:0),
      categorie:(fam||ray||"Autres"), comment:(iComm>=0?(c[iComm]||"").trim():""), nonLivre });
  }
  return { docNumber, supplier:"", lines:out };
}
function parseTXT(text){
  const rows=text.split(/\r?\n/); const out=[]; let docNumber=""; let skipped=0;
  const dateRe=/^\d{2}\/\d{2}\/\d{4}$/;
  for(const raw of rows){
    if(!raw.trim()) continue;
    const c=raw.split("\t");
    if(c.length<9||!dateRe.test((c[2]||"").trim())){ skipped++; continue; }
    const article=(c[4]||"").trim(), des=(c[5]||"").trim(), qte=toNum(c[8]);
    if(!article||!des){ skipped++; continue; }
    if(c[3]) docNumber=(c[3]||"").trim();
    out.push({ article, ean:"", designation:des, marque:"", attendu:qte, categorie:"Autres", label:(c[6]||"").trim() });
  }
  return { docNumber, supplier:"", lines:out, skipped };
}
function parsePDFLines(rowLines){
  const out=[]; let supplier=""; let docNumber="";
  const lineRe=/^(\d{2,7})\s+(.*\S)\s+(\d{8,13})\s+(\d+)\s+[\d.,]+\s+[\d.,]+\s*$/;
  for(const L of rowLines){
    if(!supplier&&/VITAFRAIS/i.test(L)) supplier="VITAFRAIS";
    const mBL=L.match(/n[°º]\s*BL\s*:?\s*(\d+)/i); if(mBL) docNumber=mBL[1];
    if(/^(Palette|Colis \d|Poids|Total|Distribution|Page|Commande|BIO :|DEM :)/i.test(L)) continue;
    const m=L.match(lineRe); if(!m) continue;
    out.push({ article:m[1], ean:m[3].replace(/^0+(?=\d)/,""), designation:m[2].replace(/\s+\d+$/,"").trim(), marque:"", attendu:parseInt(m[4],10), categorie:"Autres" });
  }
  return { docNumber, supplier, lines:out };
}
// --- Parseur PDF Biodis (mise en page différente de Vitafrais) ---
function cleanDesBiodis(s){ return String(s||"").replace(/\s+(Non\s+Bio|Bio|Conv(?:ersion)?|Cosmebio|Ecocert)\s*$/i,"").trim(); }
function parseBiodisPDF(rowLines){
  const out=[]; let supplier="BIODIS", docNumber=""; let stopped=false;
  const reU  = /^(\d{3,7})\s+(.+?)\s+(\d{13})\s+\d+\s+(\d+)\s+U\s+[\d.,]+\s+[\d.,]+\s+\d+\s*$/;
  const reKG = /^(\d{3,7})\s+(.+?)\s+(\d{13})\s+\d+\s+([\d.,]+)\s*KG\s+[\d.,]+\s+[\d.,]+\s+\d+\s*$/;
  const reND = /^(\d{3,7})\s+(.+?)\s+(Non livr[ée]|Produit sur commande|Rupture fournisseur)\s+(\d+)\s+U\s*$/i;
  const isItemNum=(s)=>reU.test(s)||reKG.test(s);
  const isMeta=(s)=>/^(Prix\b|DLC\b|DDM\b|Contribution\b|Lot\b|Sous-total\b|Commande n\b|SASU\b|NAF\b|No AGREMENT|www\.|http|BIO :|CONV\b|COSMEBIO|FR-BIO|Page \d|Poids\b|Date\b|Certification\b|Marque\b|Cat\.|TPF\b|TVA\b|Bon de Livraison|PRIBON|T[ée]l\.|Fax\b|e_mail|Site WEB|EAN\b|PRIX\b|Montant\b|Colis\b|UNITAIRE|H\.T\.|Scannez|Espace Pro|C'est Biodis|Vous pouvez|pr[ée]command|commerciales|Merci|ne pourrons|PARTICIPATION|prix indicatif|-{3,})/i.test(s) || /^[\d.,]+$/.test(String(s).trim());
  for(let i=0;i<rowLines.length;i++){
    const L=rowLines[i];
    const doc=L.match(/(\d{2}\/\d{2}\/\d{4})\s+(\d{6,8})\s/); if(doc && !docNumber) docNumber=doc[2];
    if(/Produits en arr[eê]t long|R[ée]f[ée]rence D[ée]s/i.test(L)){ stopped=true; continue; }
    if(stopped) continue;
    let m;
    if((m=L.match(reND))){ out.push({ article:m[1], ean:"", designation:cleanDesBiodis(m[2]), marque:"", attendu:parseInt(m[4],10), categorie:"Autres", nonLivre:true, comment:m[3] }); continue; }
    let art=null, ean="", att=0;
    if((m=L.match(reU)))  { art=m[1]; ean=m[3]; att=parseInt(m[4],10); }
    else if((m=L.match(reKG))){ art=m[1]; ean=m[3]; att=toNum(m[4]); }
    if(art){
      let des=[];
      for(let j=i+1;j<rowLines.length && des.length<3;j++){
        const N=rowLines[j];
        if(isItemNum(N)||reND.test(N)||isMeta(N)) break;
        des.push(N);
      }
      out.push({ article:art, ean:ean.replace(/^0+(?=\d)/,""), designation:cleanDesBiodis(des.join(" ")), marque:"", attendu:att, categorie:"Autres" });
    }
  }
  return { docNumber, supplier, lines: out };
}
function pickPdfParser(rowLines){
  const j=rowLines.join("\n");
  if(/BIODIS/i.test(j)) return parseBiodisPDF(rowLines);
  return parsePDFLines(rowLines); // Vitafrais (par défaut)
}
async function readPDF(buf){
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let rowLines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p); const tc=await page.getTextContent();
    const rows={};
    for(const it of tc.items){ const y=Math.round(it.transform[5]); (rows[y]=rows[y]||[]).push([it.transform[4],it.str]); }
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{
      const line=rows[y].sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(" ").replace(/\s+/g," ").trim();
      if(line) rowLines.push(line);
    });
  }
  return pickPdfParser(rowLines);
}
/* ---------- LECTURE COMMANDE (export G5 xlsx) ---------- */
// Code fournisseur G5 -> nom lisible (complète au besoin).
const FOURN_MAP={ "K113":"SBV", "K005":"BODIN" };
async function parseOrderXlsx(file){
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""});
  const N=(s)=>String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
  let h=-1;
  for(let i=0;i<rows.length;i++){ const r=(rows[i]||[]).map(N);
    if(r.includes("CODE") && r.some(c=>c.startsWith("DESIGNATION"))){ h=i; break; } }
  if(h<0) throw new Error("Export de commande non reconnu (en-tête Code/Désignation introuvable).");
  const head=rows[h].map(x=>String(x).trim());
  const col=(names)=>{ for(const n of names){ const i=head.findIndex(c=>N(c)===N(n)); if(i>=0) return i; } return -1; };
  const iCode=col(["Code"]), iRef=col(["Ref Fourn.","Ref Fourn"]), iDes=col(["Désignation","Designation"]),
        iCdt=col(["CDT"]), iQte=col(["Qté","Qte"]), iFourn=col(["Fournisseur"]);
  let dateLiv="", cmd="", supplier="";
  rows.forEach(r=>{ const j=(r||[]).map(x=>String(x));
    const li=j.findIndex(x=>/^\s*Le\s*$/i.test(x)); if(li>=0 && /\d{2}\/\d{2}\/\d{4}/.test(j[li+1]||"")) dateLiv=j[li+1].trim();
    const ci=j.findIndex(x=>/Commande à la Centrale N°/i.test(x)); if(ci>=0 && j[ci+1]) cmd=String(j[ci+1]).trim();
    const fi=j.findIndex(x=>/Adresse de Livraison/i.test(x)); if(fi>=0 && j[fi+1]) supplier=j[fi+1].trim();
    j.forEach(x=>{ if(!cmd && /^\d{2}-\d-[A-Za-z0-9]+$/.test(String(x).trim())) cmd=String(x).trim(); });
  });
  const lines=[]; let fournCode="";
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]||[]; const code=String(r[iCode]||"").trim(); const des=String(r[iDes]||"").trim();
    if(!/^(NC-|\d)/i.test(code) || !des) continue;              // ignore pied de page / 2e en-tête
    const cdtRaw=iCdt>=0?String(r[iCdt]||"").trim():"";
    const cdt=cdtRaw?toNum(cdtRaw.replace(/^C/i,"")):null;      // "C6" -> 6 (pièces par colis)
    const qte=toNum(r[iQte]);
    if(iFourn>=0 && r[iFourn] && !fournCode) fournCode=String(r[iFourn]).trim();
    const isPV=/000000$/.test(code)||/^2\d{11,12}$/.test(code)||/\bENV\b/i.test(des);
    const isEan=/^\d{12,13}$/.test(code);
    lines.push({ article:code, code, ean:isEan?code.replace(/^0+(?=\d)/,""):"", ref:String(iRef>=0?r[iRef]||"":"").trim(),
      designation:des, cdt, qteCmd:qte, unit:cdt?"colis":"piece",
      attendu: cdt?Math.round(qte*cdt):qte, poidsVariable:isPV, categorie:"Autres" });
  }
  if(!supplier && fournCode) supplier=FOURN_MAP[fournCode]||fournCode;
  if(!lines.length) throw new Error("Commande lue mais aucune ligne article trouvée.");
  return { format:"CMD", g5Key:"code", supplier, docNumber:cmd||"", deliveryDate:dateLiv, lines };
}

async function parseAnyFile(file){
  const name=(file.name||"").toLowerCase();
  if(name.endsWith(".xlsx")||name.endsWith(".xls")) return await parseOrderXlsx(file);
  if(name.endsWith(".pdf")){ const buf=await file.arrayBuffer(); return { ...(await readPDF(buf)), format:"PDF" }; }
  const buf=await file.arrayBuffer();
  let text; try{ text=new TextDecoder("windows-1252").decode(buf); }catch(e){ text=new TextDecoder("utf-8").decode(buf); }
  const first=text.split(/\r?\n/).slice(0,5).join("\n");
  if(name.endsWith(".csv")||first.includes(";")){
    if(!first.includes(";")&&first.includes("\t")) return { ...parseTXT(text), format:"TXT" };
    return { ...parseCSV(text), format:"CSV" };
  }
  return { ...parseTXT(text), format:"TXT" };
}
function fmtFr(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-"); return d+"/"+m+"/"+y; }
// Écrit un document parsé dans le Firebase du magasin
async function loadToStore(code, parsed, {supplier,type,deliveryDate}){
  const db=dbByStore[code]; if(!db) throw new Error("Magasin "+code+" non configuré");
  const ref=db.ref("documents").push();
  await ref.set({ docNumber:parsed.docNumber||"(sans n°)", supplier:(supplier||parsed.supplier||"").trim()||"(fournisseur ?)",
    type:type||"BL", format:parsed.format, deliveryDate:fmtFr(deliveryDate)||"",
    g5Key:parsed.g5Key||'ean',
    createdAt:firebase.database.ServerValue.TIMESTAMP, lines:parsed.lines });
}
// Détermine la clé utilisée pour le .txt G5 : EAN si présent, sinon on propose le code article.
function detectG5Key(parsed){
  const hasEan=(parsed.lines||[]).some(l=>l.ean&&String(l.ean).trim().length>=6);
  if(hasEan) return 'ean';
  const hasArticle=(parsed.lines||[]).some(l=>l.article);
  if(hasArticle){
    const ok=confirm("⚠️ Pas d'EAN sur ce document.\n\nUtiliser le CODE ARTICLE pour le .txt à charger sur G5 ?\n\n(OK = oui, utiliser le code article · Annuler = laisser tel quel)");
    return ok?'article':'ean';
  }
  return 'ean';
}
// Clé de ligne identique à l'app vendeur (pour retrouver la quantité réelle).
function lineKeyOf(l,idx){ const a=(l.article||"").toString().trim(); return a?("a_"+a.replace(/[.#$/\[\]]/g,"_")):("i_"+idx); }
// Construit le .txt G5.
// - code = colonne "Code" de la commande (l.code) si présent, sinon EAN/article (ancien mode).
// - quantité exprimée dans l'unité de la commande :
//     colis (l.cdt) -> pièces_reçues / cdt ; poids variable -> poids saisi ; sinon pièces.
function buildG5Txt(rec, doc){
  const key=(doc&&doc.g5Key)||'ean';
  const active=((doc&&doc.lines)?doc.lines:[]).filter(l=>!l.nonLivre);
  const out=[];
  active.forEach((l,i)=>{
    const st=(rec.lines||{})[lineKeyOf(l,i)]||{};
    const reelPieces = st.status ? (st.reel!=null?st.reel:l.attendu) : l.attendu; // non pointé = attendu
    let qty;
    if(l.poidsVariable){
      qty = (st.poids!=null && st.poids!=="") ? st.poids : (st.status?reelPieces:""); // poids saisi (P2) sinon repli
    } else if(l.cdt){
      const c = reelPieces / l.cdt;
      qty = (Math.abs(c-Math.round(c))<1e-9) ? Math.round(c) : Number(c.toFixed(3)); // colis entiers si possible
    } else {
      qty = reelPieces;
    }
    const code = l.code || (key==='article'?(l.article||l.ean||''):(l.ean||l.article||''));
    if(!code) return;
    out.push(code+"\t"+qty);
  });
  return out.join("\r\n");
}
function downloadTxt(filename, content){
  const blob=new Blob([content],{type:"text/plain;charset=utf-8"});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function dateShort(ts){ if(!ts) return ""; return new Date(ts).toLocaleDateString("fr-FR"); }

/* ==================== CHARGEMENT BL + COMMANDE ==================== */
// La commande est la REFERENCE : elle fournit le code G5, la quantité commandée et le CDT.
// Le BL sert à identifier les articles réellement livrés et le n° de BL.
// Les deux fichiers sont rapprochés avant d'être envoyés dans Firebase.
const multiFiles={}; // code -> { orderFile, orderParsed, blFile, blParsed, deliveryDate, supplier }

function normKey(s){ return String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g,"").trim(); }
function lineCandidates(l){
  return [l.code,l.article,l.ref,l.ean,l.designation].map(normKey).filter(Boolean);
}
function mergeOrderAndBL(order, bl){
  if(!order || order.format!=="CMD") throw new Error("Le bon de commande doit être un fichier XLSX/XLS de commande.");
  if(!bl || bl.format==='CMD') throw new Error("Le BL doit être un CSV, TXT ou PDF (pas la commande).");
  const blLines=bl.lines||[];
  const used=new Set();
  const merged=[];
  let unmatched=0;

  (order.lines||[]).forEach((ol, oi)=>{
    const keys=lineCandidates(ol);
    let bi=-1;
    // 1. correspondance exacte sur code / référence fournisseur / EAN / article
    for(let i=0;i<blLines.length;i++){
      if(used.has(i)) continue;
      const blc=lineCandidates(blLines[i]);
      if(keys.slice(0,4).some(k=>k && blc.includes(k))){ bi=i; break; }
    }
    // 2. secours : désignation normalisée suffisamment proche
    if(bi<0){
      const kd=normKey(ol.designation);
      if(kd && kd.length>=8){
        for(let i=0;i<blLines.length;i++){
          if(used.has(i)) continue;
          const bd=normKey(blLines[i].designation);
          if(bd && (bd===kd || bd.includes(kd) || kd.includes(bd))){ bi=i; break; }
        }
      }
    }

    const blLine=bi>=0 ? blLines[bi] : null;
    if(bi>=0) used.add(bi); else unmatched++;

    // La commande reste la source de vérité pour code G5, attendu et CDT.
    // Le BL apporte article/EAN/désignation si disponibles.
    merged.push({
      article: blLine?.article || ol.ref || ol.article || ol.code || "",
      code: ol.code || blLine?.code || "",
      ean: blLine?.ean || ol.ean || (String(ol.code||"").match(/^\d{12,13}$/)?String(ol.code):"") || "",
      ref: ol.ref || blLine?.article || "",
      designation: blLine?.designation || ol.designation || "",
      marque: blLine?.marque || ol.marque || "",
      cdt: ol.cdt || null,
      qteCmd: ol.qteCmd != null ? ol.qteCmd : null,
      unit: ol.unit || (ol.cdt?"colis":"piece"),
      attendu: Number(ol.attendu)||0,
      poidsVariable: !!(ol.poidsVariable || blLine?.poidsVariable),
      categorie: blLine?.categorie || ol.categorie || "Autres",
      label: blLine?.label || ol.label || "",
      nonLivre: false,
      commandMatched: bi>=0,
      blArticle: blLine?.article || "",
      blEan: blLine?.ean || ""
    });
  });

  // Articles présents sur le BL mais absents de la commande : on les conserve,
  // mais avec attendu=0 pour qu'ils soient visibles et signalés au pointage.
  blLines.forEach((blLine,i)=>{
    if(used.has(i)) return;
    merged.push({
      article: blLine.article || blLine.ean || "",
      code: blLine.article || blLine.ean || "",
      ean: blLine.ean || "",
      ref: blLine.article || "",
      designation: blLine.designation || "",
      marque: blLine.marque || "",
      cdt: null, qteCmd:0, unit:"piece", attendu:0,
      poidsVariable:!!blLine.poidsVariable, categorie:blLine.categorie||"Autres",
      label:blLine.label||"", nonLivre:false, commandMatched:false,
      blArticle:blLine.article||"", blEan:blLine.ean||"", horsCommande:true
    });
  });

  return {
    format:"BL+CMD",
    g5Key:"code",
    supplier:order.supplier || bl.supplier || "",
    docNumber:bl.docNumber || order.docNumber || "",
    commandNumber:order.docNumber || "",
    deliveryDate:order.deliveryDate || "",
    lines:merged,
    reconciliation:{ commandLines:(order.lines||[]).length, blLines:blLines.length, unmatchedCommand:unmatched, unmatchedBL:merged.filter(x=>x.horsCommande).length }
  };
}
function parseNote(p){
  if(p.format==='BL+CMD'){
    const cl=p.lines.filter(l=>l.cdt).length;
    const hors=p.lines.filter(l=>l.horsCommande).length;
    return `<div class="parse-note">🔗 <b>BL + commande rapprochés</b> · BL ${esc(p.docNumber||'—')} · commande ${esc(p.commandNumber||'—')} · ${p.lines.length} lignes${cl?' · '+cl+' conditionnements':''}${hors?' · ⚠️ '+hors+' BL hors commande':''}</div>`;
  }
  if(p.format==='CMD'){
    const pv=p.lines.filter(l=>l.poidsVariable).length, cl=p.lines.filter(l=>l.cdt).length;
    return `<div class="parse-note">📋 <b>Commande ${esc(p.supplier||'?')}</b> ${esc(p.docNumber||'')} · ${p.lines.length} lignes${cl?(' · '+cl+' en colis'):''}${pv?(' · '+pv+' poids variable'):''}</div>`;
  }
  const g5 = p.g5Key==='article' ? ' · clé G5 : <b>code article</b>' : (p.g5Key==='ean' ? ' · clé G5 : EAN' : '');
  return `<div class="parse-note">N° <b>${esc(p.docNumber||'—')}</b> · ${esc(p.format)} · ${p.lines.length} lignes${p.skipped?(' · '+p.skipped+' ignorée(s)'):''}${g5}</div>`;
}

// Nom de fichier G5 : AAMMJJ_FOURNISSEUR_BL.txt (ex : 260814_BIODIS_1154370.txt)
function g5Filename(r){
  const d=new Date(r.validatedAt||r.createdAt||Date.now());
  const yy=String(d.getFullYear()).slice(-2), mm=String(d.getMonth()+1).padStart(2,"0"), dd=String(d.getDate()).padStart(2,"0");
  const sup=String(r.supplier||"FOURNISSEUR").toUpperCase().replace(/[^A-Z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "FOURNISSEUR";
  const bl=String(r.docNumber||"BL").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "BL";
  return yy+mm+dd+"_"+sup+"_"+bl+".txt";
}
function dlG5(code,id){
  const st=state[code]; const r=st.receptions[id]; const doc=st.docs[r.docId]||null;
  const txt=buildG5Txt(r,doc);
  if(!txt){ alert("Aucune ligne avec code (EAN / article) — impossible de générer le .txt."); return; }
  downloadTxt(g5Filename(r), txt);
}

  const mag=document.getElementById("avVueMag"), fou=document.getElementById("avVueFou");
  if(mag){ mag.style.background=avoirView==='magasin'?'#1a4d2e':'#eef2f7'; mag.style.color=avoirView==='magasin'?'#fff':'#333'; }
  if(fou){ fou.style.background=avoirView==='fournisseur'?'#1a4d2e':'#eef2f7'; fou.style.color=avoirView==='fournisseur'?'#fff':'#333'; }
  const recs=avoirRecs();
  if(!recs.length){ box.innerHTML='<div class="muted">Aucune demande d\'avoir en cours.</div>'; return; }
  const groups={};
  recs.forEach(r=>{ const key=avoirView==='fournisseur'?(r.supplier||'?'):(r.storeLabel||r.storeCode); (groups[key]=groups[key]||[]).push(r); });
  box.innerHTML=Object.keys(groups).sort().map(k=>`<div class="store-card"><h3>${esc(k)} <span class="badge info">${groups[k].length}</span></h3>${groups[k].map(avoirCard).join("")}</div>`).join("");
}
function closeAvoir(code,id){
  if(!confirm("Confirmer : l'avoir a bien été reçu du fournisseur ? La demande passera dans les Archives.")) return;
  const db=dbByStore[code]; if(!db) return;
  db.ref("receptions/"+id).update({ avoir:{ status:"termine", closedAt:firebase.database.ServerValue.TIMESTAMP, by:ME_EMAIL } }).catch(e=>alert(e.message));
}
function genAvoir(code,id){
  const st=state[code]; const r=st.receptions[id]; if(!r) return;
  const doc=st.docs[r.docId]||null; const active=((doc&&doc.lines)?doc.lines:[]);
  const avLines=[];
  active.forEach((l,i)=>{ const s2=(r.lines||{})[lineKeyOf(l,i)]; if(s2&&s2.avoir){
    const codeVal=(doc&&doc.g5Key==='code')?(l.code||l.ean||''):(l.ean||l.article||'');
    avLines.push({ code:codeVal, ref:l.ref||'', des:l.designation||'', qte:(s2.manque||s2.saisi||''), motif:motifLabel(s2.motif) }); }});
  if(!avLines.length){ alert("Aucune ligne en avoir sur cette réception."); return; }
  const dateStr=dateShort(r.validatedAt);
  let body="Bonjour,\n\nSuite à la réception du "+dateStr+" (BL "+(r.docNumber||'')+"), nous constatons les écarts suivants :\n\n";
  avLines.forEach(a=>{ body+="- réf "+(a.ref||a.code)+" — "+a.des+" — quantité : "+a.qte+" ("+a.motif+")\n"; });
  body+="\nMerci de bien vouloir effectuer l'avoir en conséquence.\n\nCordialement,\n"+(ME_EMAIL||'');
  try{
    const JS=(window.jspdf&&window.jspdf.jsPDF); if(JS){ const pdf=new JS();
      pdf.setFontSize(14); pdf.text("Demande d'avoir — "+(r.supplier||''),14,18);
      pdf.setFontSize(10); pdf.text("Réception du "+dateStr+" · BL "+(r.docNumber||'')+" · "+(r.storeLabel||''),14,26);
      let y=40; pdf.setFont(undefined,'bold'); pdf.text("Réf/Code",14,y); pdf.text("Désignation",50,y); pdf.text("Qté",150,y); pdf.text("Motif",165,y); pdf.setFont(undefined,'normal'); y+=6;
      avLines.forEach(a=>{ pdf.text(String(a.ref||a.code),14,y); pdf.text(String(a.des).slice(0,45),50,y); pdf.text(String(a.qte),150,y); pdf.text(String(a.motif).slice(0,18),165,y); y+=6; if(y>280){pdf.addPage();y=20;} });
      y+=8; pdf.text("Merci d'effectuer l'avoir en conséquence.",14,y);
      pdf.save("avoir_"+(r.supplier||'F')+"_"+(r.docNumber||'')+".pdf");
    }
  }catch(e){ /* PDF best-effort */ }
  const email=fournEmail(r.supplier);
  const subj="Demande d'avoir — réception du "+dateStr+" (BL "+(r.docNumber||'')+")";
  window.location.href="mailto:"+encodeURIComponent(email)+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);
  const db=dbByStore[code]; if(db) db.ref("receptions/"+id).update({ avoir:{ status:"en_cours", requestedAt:firebase.database.ServerValue.TIMESTAMP, by:ME_EMAIL } });
}

/* ==================== ONGLET FOURNISSEURS (P5) ==================== */
function renderFournisseurs(){
  const el=document.getElementById("tab-fourn"); if(!el) return;
  el.innerHTML=`<div class="card"><h2 style="margin-top:0">Fournisseurs</h2>
    <p class="muted">Nom + adresse mail pour les demandes d'avoir / litiges (sert à préparer le mail d'avoir).</p>
    <div id="fournList"><div class="muted">Chargement…</div></div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <input id="fnNom" placeholder="Nom fournisseur (ex : BIODIS)" style="flex:1;min-width:150px"/>
      <input id="fnMail" placeholder="email litiges" style="flex:1;min-width:150px"/>
      <button class="btn btn-primary" style="padding:10px 16px" onclick="addFourn()">Ajouter</button>
    </div><div id="fnMsg"></div></div>`;
  apiRP("get-fournisseurs").then(j=>{ if(j&&j.fournisseurs) FOURNS=j.fournisseurs; renderFournList(); }).catch(()=>renderFournList());
}
function renderFournList(){
  const box=document.getElementById("fournList"); if(!box) return;
  if(!FOURNS.length){ box.innerHTML='<div class="muted">Aucun fournisseur enregistré.</div>'; return; }
  box.innerHTML='<table><thead><tr><th>Nom</th><th>Email litiges</th><th></th></tr></thead><tbody>'+
    FOURNS.map((f,i)=>`<tr><td>${esc(f.nom)}</td><td>${esc(f.email||'')}</td><td><button class="btn" style="background:#fdecea;color:#c62828;padding:6px 10px;font-size:12px" onclick="delFourn(${i})">Suppr.</button></td></tr>`).join("")+'</tbody></table>';
}
function addFourn(){
  const nom=document.getElementById("fnNom").value.trim(), mail=document.getElementById("fnMail").value.trim();
  if(!nom) return;
  FOURNS.push({nom, email:mail}); document.getElementById("fnNom").value=""; document.getElementById("fnMail").value=""; saveFourns();
}
function delFourn(i){ FOURNS.splice(i,1); saveFourns(); }
function saveFourns(){
  renderFournList();
  apiRP("set-fournisseurs",{fournisseurs:FOURNS}).then(j=>{ const m=document.getElementById("fnMsg"); if(m) m.innerHTML=(j&&j.ok)?'<div class="ok">✓ Enregistré</div>':'<div class="err">Erreur : '+esc((j&&j.error)||'')+'</div>'; }).catch(e=>{ const m=document.getElementById("fnMsg"); if(m) m.innerHTML='<div class="err">'+esc(e.message)+'</div>'; });
}

/* ==================== ONGLET SUIVI LIVE ==================== */
function queueNames(){
  const need=new Set();
  Object.values(state).forEach(st=>{
    Object.values(st.receptions||{}).forEach(r=>{ if(r.operatorCode&&!(r.operatorCode in names)) need.add(r.operatorCode); });
    Object.values(st.broadcasts||{}).forEach(b=>{ Object.keys(b.reads||{}).forEach(c=>{ if(!(c in names)) need.add(c); }); });
  });
  if(!need.size||pendingNames) return;
  pendingNames=true;
  fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action:"resolve-names",idToken:ID_TOKEN,codes:Array.from(need)})})
    .then(r=>r.json()).then(j=>{ if(j&&j.names) Object.assign(names,j.names); pendingNames=false; renderSuivi(); renderMsg(); })
    .catch(()=>{ pendingNames=false; });
}
function activeCount(doc){ if(!doc||!doc.lines) return 0; return doc.lines.filter(l=>!l.nonLivre).length; }
function pointed(recLines){ return Object.values(recLines||{}).filter(s=>s&&s.status).length; }
function since(ts){ if(!ts) return ""; let s=Math.max(0,Math.floor((Date.now()-ts)/1000));
  const h=Math.floor(s/3600); s%=3600; const m=Math.floor(s/60); s%=60;
  return (h?h+"h":"")+String(m).padStart(h?2:1,"0")+"m"+String(s).padStart(2,"0"); }
function heure(ts){ if(!ts) return ""; const d=new Date(ts); return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }
function renderSuivi(){
  const el=document.getElementById("tab-suivi");
  if(el.classList.contains("hidden") && el.dataset.rendered) { /* still update timers if visible */ }
  let totalDraft=0;
  const html=STORES.map(s=>{
    const st=state[s.code];
    if(!st) return `<div class="store-card nocfg"><h3>${esc(s.label)}</h3><div class="muted">Non configuré</div></div>`;
    const recs=Object.entries(st.receptions||{}).map(([id,r])=>({id,...r}));
    const drafts=recs.filter(r=>r.status!=="validated").sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    const valids=recs.filter(r=>r.status==="validated").sort((a,b)=>(b.validatedAt||0)-(a.validatedAt||0)).slice(0,4);
    totalDraft+=drafts.length;
    const card=(r,isDraft)=>{ const doc=st.docs[r.docId]; const tot=activeCount(doc); const p=pointed(r.lines); const pct=tot?Math.round(p/tot*100):0;
      const who=names[r.operatorCode]||"…";
      return `<div class="rec ${isDraft?'draft':'valid'}">
        <div style="display:flex;justify-content:space-between;gap:8px"><div><div style="font-weight:800;font-size:14px">${esc(r.supplier||'?')} · ${esc(r.docNumber||'')}</div>
        <div style="font-size:12px;color:#1a4d2e;font-weight:700">👤 ${esc(who)}</div></div>
        <span class="badge ${isDraft?'warn':'ok'}">${isDraft?'En cours':'Validée'}</span></div>
        <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
        <div style="font-size:12px;color:#666;margin-top:4px">${p}/${tot||'?'} pointés (${pct}%)${isDraft?` · débutée ${esc(heure(r.createdAt))} · <span class="since">depuis ${esc(since(r.createdAt))}</span>`:` · validée ${esc(heure(r.validatedAt))}`}${r.ecartCount?` · ⚠ ${r.ecartCount} écart(s)`:''}</div></div>`;
    };
    const body=(drafts.length?drafts.map(r=>card(r,true)).join(""):'<div class="muted">Aucune réception en cours.</div>')
      +(valids.length?'<div class="muted" style="margin-top:6px">Dernières validées</div>'+valids.map(r=>card(r,false)).join(""):"");
    return `<div class="store-card"><h3>${esc(s.label)} <span class="badge info"><span class="dot"></span> LIVE</span></h3>${body}</div>`;
  }).join("");
  el.innerHTML=`<p class="muted" style="margin-top:0">${readyStores().length} magasin(s) connecté(s) · ${totalDraft} réception(s) en cours — mise à jour en temps réel.</p><div class="live-grid">${html}</div>`;
  el.dataset.rendered="1";
}

/* ==================== ONGLET COMMANDE À LA CENTRALE ==================== */
/* Lecture du projet CENTRALE (app Dispatch palette). Vue PAR FOURNISSEUR :
   commande passée à la centrale vs ce qui a été réellement dispatché en magasins,
   avec les écarts + motifs (CASSE FOURNISSEUR / DLC / NON RECU / CASSE / AUTRE),
   export .txt pour G5, et validation de la réception centrale. */
function cKeyOfLine(p,idx){ const a=(p.article||"").toString().trim(); return a?("a_"+a):("l_"+idx); }
function cEffQty(st,p,code){ if(st&&st.qtyStores&&st.qtyStores[code]!=null) return st.qtyStores[code]; return (p.stores&&p.stores[code])||0; }
function cSupKey(sup){ return String(sup||"FRS").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9_]/g,"_"); }
function centraleLines(sess){
  const products=(sess.meta&&sess.meta.products)||[];
  const stt=sess.state||{};
  const cols=(sess.meta&&sess.meta.storeColumns)||[];
  return products.map((p,idx)=>{
    const st=stt[cKeyOfLine(p,idx)]||{};
    const dispatched=cols.reduce((a,c)=>a+cEffQty(st,p,c.code),0);
    const commande=(p.recue!=null)?p.recue:Object.values(p.stores||{}).reduce((a,b)=>a+b,0);
    return { article:p.article||"", designation:p.designation, colisage:p.colisage||0, commande, dispatched, ecart:dispatched-commande, done:!!st.done, ecarts:st.ecarts||[] };
  });
}
function centraleSessions(){
  const out=[];
  Object.entries(centraleState.dispatch||{}).forEach(([sid,s])=>{ if(s&&s.meta&&s.meta.supplier) out.push(Object.assign({id:sid},s)); });
  out.sort((a,b)=>((b.meta.startedAt||0)-(a.meta.startedAt||0)));
  return out;
}
function centraleTxt(sess){
  const lines=centraleLines(sess); const rows=[];
  rows.push("COMMANDE A LA CENTRALE - LA CENTRALE PDP");
  rows.push("Fournisseur:\t"+(sess.meta.supplier||"?"));
  rows.push("Date:\t"+new Date(sess.meta.startedAt||Date.now()).toLocaleString("fr-FR"));
  rows.push("");
  rows.push(["Code EAN","Designation","Colisage","Commande","Dispatche","Ecart","Motif(s)"].join("\t"));
  lines.forEach(l=>{ const motifs=(l.ecarts||[]).map(e=>(e.storeLabel||e.store)+":"+e.reason+(e.reasonText?"("+e.reasonText+")":"")).join(" | ");
    rows.push([l.article,l.designation,l.colisage||"",l.commande,l.dispatched,l.ecart,motifs].join("\t")); });
  return rows.join("\r\n");
}
function renderCentrale(){
  const el=document.getElementById("tab-centrale"); if(!el) return;
  if(!dbCentrale){ el.innerHTML='<div class="muted">Connexion à la centrale indisponible.</div>'; return; }
  const sessions=centraleSessions();
  const isDone=(s)=>!!(centraleState.reception&&centraleState.reception[s.id]&&centraleState.reception[s.id].receivedAt);
  const todo=sessions.filter(s=>!isDone(s));
  const done=sessions.filter(s=>isDone(s));
  const view=centraleView||"todo";
  const list=view==="done"?done:todo;
  const card=(s)=>{
    const lines=centraleLines(s);
    const totCmd=lines.reduce((a,l)=>a+l.commande,0);
    const totDisp=lines.reduce((a,l)=>a+l.dispatched,0);
    const ecartLines=lines.filter(l=>l.ecart!==0||(l.ecarts&&l.ecarts.length));
    return `<div class="rec valid" style="${ecartLines.length?'border-color:#e53935;border-width:2px':''}">
      <div style="font-weight:800;font-size:15px">${esc(s.meta.supplier||'?')}</div>
      <div style="font-size:12px;color:#666;margin-top:2px">${esc(dateShort(s.meta.startedAt))} · commande ${totCmd} → dispatché ${totDisp}</div>
      ${ecartLines.length?`<div style="margin-top:6px"><span class="badge warn">⚠ ${ecartLines.length} écart(s)</span></div>`:'<div style="margin-top:6px"><span class="badge ok">conforme</span></div>'}
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn btn-primary" style="padding:8px 12px;font-size:13px" onclick="openCentraleDetail('${esc(s.id)}')">👁 Détail / écarts</button>
        <button class="btn" style="background:#eef2f7;padding:8px 12px;font-size:13px" onclick="dlCentraleTxt('${esc(s.id)}')">⬇️ .txt</button>
        ${view==="done"
          ? `<button class="btn" style="background:#fff3e0;color:#e65100;padding:8px 12px;font-size:13px" onclick="unmarkCentrale('${esc(s.id)}')">↩︎ Ré-ouvrir</button>`
          : `<button class="btn btn-green" style="padding:8px 12px;font-size:13px" onclick="markCentrale('${esc(s.id)}')">✓ Réceptionné centrale</button>`}
      </div></div>`;
  };
  el.innerHTML=`<p class="muted" style="margin-top:0">Commandes passées à la centrale (Porte de Pantin) puis dispatchées en magasins — <b>par fournisseur</b>. Données issues de l'app Dispatch. « Détail » = écarts avec motif · « .txt » = export G5 · « Réceptionné centrale » = archive.</p>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn" style="padding:8px 14px;font-size:13px;background:${view==='todo'?'#1a4d2e':'#eef2f7'};color:${view==='todo'?'#fff':'#333'}" onclick="centraleView='todo';renderCentrale()">À réceptionner (${todo.length})</button>
      <button class="btn" style="padding:8px 14px;font-size:13px;background:${view==='done'?'#1a4d2e':'#eef2f7'};color:${view==='done'?'#fff':'#333'}" onclick="centraleView='done';renderCentrale()">Réceptionnées (${done.length})</button>
    </div>
    ${list.length?('<div class="live-grid">'+list.map(card).join("")+'</div>'):'<div class="muted">'+(view==='done'?'Aucune réception centrale archivée.':'Aucune commande centrale à réceptionner.')+'</div>'}`;
}
function openCentraleDetail(sid){
  const s=(centraleState.dispatch||{})[sid]; if(!s) return; const sess=Object.assign({id:sid},s);
  const lines=centraleLines(sess);
  const rows=lines.map(l=>{ const bg=l.ecart!==0?' style="background:#fff3e0"':'';
    const motifs=(l.ecarts||[]).map(e=>esc((e.storeLabel||e.store)+" : "+e.reason+(e.reasonText?" ("+e.reasonText+")":"")+(e.fournisseur?" [avoir]":" [interne]"))).join("<br>");
    return `<tr${bg}><td>${esc(l.article||'')}</td><td>${esc(l.designation||'')}</td><td>${l.colisage>1?('C'+l.colisage):'—'}</td><td>${l.commande}</td><td><b>${l.dispatched}</b></td><td style="${l.ecart!==0?'color:#c62828;font-weight:700':''}">${l.ecart!==0?((l.ecart>0?'+':'')+l.ecart):'0'}</td><td>${motifs||''}</td></tr>`;
  }).join("");
  const back=document.createElement("div"); back.className="modal-back";
  back.innerHTML=`<div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0;font-size:17px">Commande centrale · ${esc(sess.meta.supplier||'')}</h2><button class="btn" style="background:#eef2f7" onclick="this.closest('.modal-back').remove()">Fermer</button></div>
    <div class="muted" style="margin:4px 0 10px">${esc(dateShort(sess.meta.startedAt))} · dispatché par ${esc(sess.meta.createdBy||'—')}</div>
    <div style="overflow:auto;max-height:60vh"><table><thead><tr><th>Code</th><th>Désignation</th><th>Colis.</th><th>Commande</th><th>Dispatché</th><th>Écart</th><th>Motif(s)</th></tr></thead><tbody>${rows}</tbody></table></div>
    <button class="btn btn-green btn-lg" style="margin-top:14px" onclick="dlCentraleTxt('${esc(sid)}')">⬇️ Télécharger le .txt</button>
  </div>`;
  back.onclick=(e)=>{ if(e.target===back) back.remove(); };
  document.body.appendChild(back);
}
function dlCentraleTxt(sid){
  const s=(centraleState.dispatch||{})[sid]; if(!s) return; const sess=Object.assign({id:sid},s);
  const txt=centraleTxt(sess);
  const d=new Date(sess.meta.startedAt||Date.now());
  const yy=String(d.getFullYear()).slice(-2),mm=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");
  downloadTxt(yy+mm+dd+"_CENTRALE_"+cSupKey(sess.meta.supplier)+".txt", txt);
}
function markCentrale(sid){
  if(!dbCentrale) return;
  if(!confirm("Marquer cette commande centrale comme réceptionnée ? Elle passera dans « Réceptionnées ».")) return;
  dbCentrale.ref("centrale_reception/"+sid).set({ receivedAt:firebase.database.ServerValue.TIMESTAMP, by:ME_EMAIL }).catch(e=>alert("Erreur : "+e.message));
}
function unmarkCentrale(sid){
  if(!dbCentrale) return;
  dbCentrale.ref("centrale_reception/"+sid).remove().catch(e=>alert("Erreur : "+e.message));
}
</script>
